# CORE — exigences imposées par la Forge à TOUT jeu.
#
# Source d'autorité : la Forge. Ni le Prisme ni le builder ne peuvent en ajouter,
# en retirer, ni en declarer une NOT_APPLICABLE (`not_applicable_allowed: false`
# partout — c'est la definition meme du CORE : si une entree peut etre declaree
# non applicable, elle n'est pas CORE, elle est EXPECTED).
#
# Ecrit en CASES, une ligne par exigence, jamais en prose. Raison mesuree :
# l'experience WFL-02 (2026-07-13) a montre qu'une regle vivant dans la prose d'un
# charter echappe a la fois aux lecteurs multiples (0/5) et a toute fusion
# mecanique — l'oracle reste vert et la regle disparait.
#
# `proof_kind` dit QUELLE FORME DE PREUVE est attendue. C'est une exigence posee
# en amont, jamais un recu : les recus viennent de l'execution des oracles.
#   artifact   : un fichier/une declaration existe et est referencee
#   test       : un test deterministe passe
#   bot_action : un bot execute l'action de bout en bout (reutilise le harnais
#                de solvabilite R9 — la forme que le builder ne peut pas simuler)
#   pixel      : une capture d'ecran satisfait un critere mecanique
#
# schema_version : version du SCHEMA de ce fichier, distincte du contenu.

schema_version: 1
source: forge
not_applicable_allowed: false   # vaut pour toutes les entrees ci-dessous

requirements:

  - id: core.boot
    capability: game.boot
    statement: "Le jeu demarre et atteint un etat initial observable."
    proof_kind: bot_action
    proof_expectation: "Lancement -> etat initial atteint sans erreur, sans intervention humaine."

  - id: core.main_loop
    capability: game.loop
    statement: "Une boucle de jeu fait avancer l'etat de maniere deterministe."
    proof_kind: test
    proof_expectation: "Meme etat + meme entree + meme seed -> meme etat suivant, sur N ticks."

  - id: core.input
    capability: input.action
    statement: "Le joueur peut agir sur le jeu."
    proof_kind: bot_action
    proof_expectation: "Une action emise modifie l'etat de jeu de facon observable."

  - id: core.game_state
    capability: game.state
    statement: "L'etat de partie est observable et nomme (en cours / gagne / perdu)."
    proof_kind: test
    proof_expectation: "L'etat est lisible a tout instant et ne prend que des valeurs declarees."

  - id: core.end_condition
    capability: game.end
    statement: "La partie peut se terminer, et la condition de fin est definie par les regles."
    proof_kind: bot_action
    proof_expectation: "Un bot atteint une fin de partie ; l'etat final est gagne ou perdu, jamais indefini."
    # AJOUT orchestrateur (a confirmer par Pierre) — absent de la liste initiale.
    # Motif : incident reel auto_battler, « victoire de PARTIE non definie par les
    # regles » est reste un TODO alors que tous les oracles etaient verts.

  - id: core.restart
    capability: game.restart
    statement: "Une nouvelle partie peut etre relancee dans un etat initial propre."
    proof_kind: bot_action
    proof_expectation: "Apres une fin de partie, relance -> etat identique au premier demarrage (aucun residu)."

  - id: core.exit
    capability: game.exit
    statement: "Le jeu peut etre quitte proprement."
    proof_kind: bot_action
    proof_expectation: "Sortie demandee -> processus termine, code de sortie 0, aucune ressource laissee active."

  - id: core.render
    capability: render.frame
    statement: "Le jeu affiche son etat, et l'affichage change quand l'etat change."
    proof_kind: pixel
    proof_expectation: "Deux captures a des etats differents different ; aucune capture n'est monochrome."
    # AJOUT orchestrateur (a confirmer par Pierre) — absent de la liste initiale.
    # Motif : incident reel shmup_slice, mutation 111/112 et rendu mort a l'ecran.
    # Sans cette case, « C+A systematique » n'a aucun point de controle.

  - id: core.audio
    capability: audio.cue
    statement: "Au moins un retour sonore est declenche par une action de jeu."
    proof_kind: artifact
    proof_expectation: "Un asset audio existe, est reference par le contrat, et son declenchement est trace."

  - id: core.error_handling
    capability: error.guard
    statement: "Une entree invalide ou inattendue ne casse pas la partie en cours."
    proof_kind: test
    proof_expectation: "Entrees hors domaine (nulle, hors bornes, repetee, simultanee) -> etat de jeu toujours valide."
