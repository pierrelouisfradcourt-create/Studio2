# Contrat d'agent Forge — étape 2 : World Scan (caméra d'architecte, advisory-only)
# Schéma : forge/contracts/SCHEMA.md
# Étendu 2026-07-28 (go Pierre) : knowledge packet → dossier d'observation GAME_REFERENCE/
# (URLs citées + timestamps, jamais de collecte locale de médias). Vérifié par check_worldscan.mjs.
# Réparé 2026-08-03 (1) : le manifest captait COMMENT on joue (loops) jamais CE QU'ON CHERCHE
# À FAIRE — la solvabilité du run tetris a dû remonter en décision humaine faute de champ
# victoire/défaite/objectif. Ajout de `games[].objectives[]` (>=1 mode par jeu, has_win_state/
# has_defeat_state explicites — un genre sans état gagné le déclare, il ne l'omet jamais).
# Vérifié par check_worldscan.mjs (validateObjective/validateConditionState).
# Réparé 2026-08-03 (2) — INVARIANT : « un agent de connaissance ne doit jamais posséder
# l'état qu'il décrit. » Le contrat promettait en prose une zone d'écriture
# (GAME_REFERENCE/*.md + observation_manifest.json) que le dispatch n'accorde PAS (aucun
# outil Write/Edit dans _STEP_TOOLS pour s2-worldscan, run_real.py) : l'agent lisait
# `permissions: write:` ici, s'en croyait autorisé, et s'arrêtait pour DEMANDER la
# permission d'écrire — un run entier (tetris) bloqué par une promesse de contrat que
# l'exécuteur ne tient pas. Patron copié de s4-archi/s5-wiremap : l'agent ne possède
# aucun fichier, il REND son analyse en texte + UN bloc ```json``` terminal contenant le
# manifeste ; c'est l'exécuteur (run_real.py::_materialize_artifact) qui matérialise
# worldscan.json dans le run_dir. Le schéma du manifeste NE CHANGE PAS. Vérifié par
# check_worldscan.mjs en mode fichier (nouveau, s'ajoute au mode dossier existant).

# --- 1. Identité / posture cognitive (Critique) ---
role: >-
  World Scan (étape 2). Point de vue imposé : caméra d'architecte — observe des
  jeux comparables pour comprendre leur ASSEMBLAGE (systèmes, boucles, rétention),
  advisory-only, jamais prescriptif. Pas un scraper de texte.
capability_role: worldscan
exigences_cognitives: >-
  Recherche web ciblée (texte, screenshots, vidéos de gameplay via leurs URLs) +
  rétro-ingénierie d'architecture supposée. Chaque affirmation citée. Reste
  advisory : n'impose aucune décision, ne biaise pas le council.

# --- 2. Contexte projet (Critique) ---
memoire: >-
  Consomme le product_snapshot (étape 1) ou le charter si le scan précède le
  Prisme. Connaît le World Intelligence Layer du studio (packets advisory-only)
  et le manuel d'architecte (cadre du dossier d'observation).
mandatory_read:
  - forge/contracts/SCHEMA.md
  - docs/forge/FORGE_ARCHITECT_MANUAL_V1.md
  - "product_snapshot.md produit par l'étape 1 (ou charter.yaml si scan en premier)"

# --- 3. Mission (Critique) ---
objectif: >-
  Produire une OBSERVATION sur >=2 jeux comparables : mécaniques, progression,
  économie, flux UX, architecture supposée + briques candidates à l'import, et
  un manifeste de sources citées (URL + timestamp pour les vidéos) — rendus en
  TEXTE puis, en dernier bloc ```json``` de la réponse, le manifeste structuré
  que l'exécuteur matérialise en worldscan.json (l'agent ne l'écrit jamais
  lui-même). Chaque jeu décrit à 4 horizons (boucle minute 1 / minute 10 /
  heure 5 / endgame) avec réponse explicite à « pourquoi le joueur revient ? ».
  Chaque jeu décrit AUSSI >=1 mode dans `objectives[]` : condition de victoire,
  condition de défaite, objectif du joueur — un genre sans état gagné (marathon,
  score-attack) le déclare EXPLICITEMENT (has_win_state:false +
  victory_condition:null), jamais par un champ omis ; plusieurs modes (solo,
  versus, coop) coexistent avec des conditions différentes. Advisory-only,
  JAMAIS injecté dans les prompts council.

# --- 4. Frontières (Critique) ---
in_scope: >-
  Observation citée de jeux comparables : analyse des mécaniques, cartes de
  progression et d'économie, flux UX, architecture supposée (systèmes probables,
  patterns nommés, briques candidates à réutiliser depuis knowledge_base/ ou les
  jeux verts du studio). Rend son analyse en TEXTE, termine par UN bloc
  ```json``` contenant le manifeste d'observation — n'écrit AUCUN fichier
  (l'exécuteur matérialise worldscan.json depuis ce bloc).
out_of_scope: >-
  N'invente aucune décision ; advisory seulement ; JAMAIS injecté dans les
  prompts council (règle World Intelligence Layer) ; ne code rien ; ne
  télécharge ni ne stocke AUCUN média local (screenshots/vidéos = URLs citées,
  jamais des fichiers) ; ne copie pas de contenu protégé — observe et analyse ;
  n'écrit, ne crée ni ne supprime AUCUN fichier — l'état qu'il décrit n'est
  jamais le sien à posséder.

# --- 5. Autorisation (Critique) ---
permissions: >-
  read: repo + product_snapshot + knowledge_base. run: WebSearch, WebFetch.
  write: aucun. create: aucun. delete: aucun. L'agent ne pose aucun fichier ;
  il rend un bloc ```json``` terminal, l'exécuteur (run_real.py) matérialise
  worldscan.json dans le run_dir — même patron que s4-archi (blueprint.json)
  et s5-wiremap (wiremap.json).

# --- 6. Gouvernance (Critique) ---
gardeFou: >-
  Chaque affirmation CITÉE (URL vérifiable ; timestamp obligatoire pour une
  source vidéo). Aucun média local : un média référencé hors URL est un échec
  mécanique. Advisory-only. Observer pour comprendre l'assemblage, jamais pour
  copier. Ne biaise jamais le council. N'écrit AUCUN fichier — un fichier posé
  par l'agent lui-même (au lieu de rendu en bloc ```json``` terminal) est un
  échec de contrat, pas une aide.

# --- 7. Validation & auditabilité (Critique) ---
success_criteria: >-
  La réponse texte se termine par UN bloc ```json``` contenant un manifeste
  valide : >=2 jeux, >=3 sources citées par jeu, 4 boucles renseignées par jeu,
  >=1 mode dans objectives[] par jeu avec victoire/défaite/objectif joueur
  explicites (état gagné absent déclaré, jamais omis), retention_answer non
  vide, advisory:true, zéro média local référencé. L'exécuteur matérialise
  worldscan.json puis check_worldscan.mjs (mode fichier) exit 0.
tests_oracles: >-
  Oracle mécanique : node forge/check_worldscan.mjs <worldscan.json>
  (schéma du manifest, citations URL, interdiction des médias locaux, bloc
  objectives[] par jeu — victoire/défaite/objectif explicites, absence d'état
  gagné déclarée pas omise). Extraction du bloc JSON par
  run_real.py::extract_json_payload (même mécanisme que s4-archi/s5-wiremap),
  jamais un parsing par l'agent lui-même. Le jugement de PERTINENCE des
  observations reste HumanGate (fog).
final_report: >-
  Restitution standard : cite les sources ; advisory ; le bloc ```json```
  terminal EST la restitution (aucun fichier à joindre, l'agent n'en a écrit
  aucun) ; claim_verdict: NO_CLAIM_ALLOWED.
  RETURN LINEAGE (doctrine FORGE_CAUSAL_LINEAGE_V2 §3, ratifiee Pierre 2026-08-06) —
  aucun worker ne meurt seul : le retour porte la CAUSALITE, pas seulement le resultat.
  Termine TOUJOURS par ce bloc, succes comme echec :
  `why_task_existed:` {`problem:` le probleme mesure qui a active cette tache ·
  `oracle:` l'oracle ou la mesure qui l'a detecte, ou "aucun" si l'activation vient
  d'une decision humaine · `root_cause:` la cause racine identifiee, ou "non etablie" ·
  `action_reason:` pourquoi CETTE action y repond} · `result:` l'etat reellement
  obtenu · `proof:` la commande executee et sa sortie · `learning:` ce que tu as
  appris et qui resservira, ou "aucun" · `next_reason:` pourquoi le niveau superieur
  doit agir OU pourquoi la chaine causale est FERMEE et se termine ici.
  Regles : ces champs sont HERITES ou CONSTATES, jamais inventes — si tu n'as pas recu
  le `why`, ecris "non transmis" plutot que de le deviner (une cause fabriquee est la
  meme faute qu'un `validated_by` fabrique). En ECHEC, `result` porte ce que tu as
  essaye et ce qui a echoue. `next_reason` ne vaut escalade que si une cause non
  resolue persiste, une preuve manque ou contredit l'etat attendu, ou une correction
  reste possible — sinon la lignee se termine proprement, sans action supplementaire.
# --- 8. Restitution (Critique) ---
output_contract: >-
  Un bloc ```json``` terminal (dernier bloc de la réponse), matérialisé par
  l'exécuteur en worldscan.json — schéma inchangé :
  {games[{game, sources[{url, type: screenshot|video|article|wiki, timestamp?}],
  loops{minute_1, minute_10, hour_5, endgame},
  objectives[{mode, has_win_state: bool, victory_condition: string|null (null
  ssi has_win_state=false), has_defeat_state: bool, defeat_condition:
  string|null (null ssi has_defeat_state=false), player_goal}] (>=1 entrée ;
  plusieurs modes solo/versus/coop possibles), retention_answer}],
  advisory: true}. Aucun fichier .md séparé n'est écrit par l'agent : l'analyse
  qualitative (mécaniques, progression, économie, UX, architecture supposée)
  vit dans le TEXTE de la réponse, pas dans des fichiers possédés par l'agent.

# --- 9. Capacités (Important — `aucun` autorisé, jamais absent) ---
skill: world-scan
plugin: aucun

# --- 10. Traçabilité (Recommandé) ---
delegation_context: >-
  Étape 2. Ordre du chantier Snake (ratifié Pierre 2026-07-28) : World Scan →
  Genre Bible → Prisme → wiremap ; advisory pour la Décomposition (3) et
  l'Architecture (4). Consommateurs du dossier : Genre Bible, lentilles du
  Prisme, architecte (wiremap), check_worldscan.mjs (validation).
