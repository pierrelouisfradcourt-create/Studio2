  - "design/content_requirements.md (C.5, RATIFIE Pierre 2026-08-25 — injecte en amont
    par l'executeur) : LA CARTE DE JEU (Gameplay Map). Elle COMMENCE par la boucle canonique du jeu (Partie II.0 : ce que le joueur fait, ce que le monde devient) — une echelle de couts n_est PAS une boucle. Partie I = la methode (les 10 boucles, les 8 champs
    d'une entree de contenu, les 8 categories avec leur test qui tranche, les prefixes
    d'id, R3 aucun contenu hors boucle / R4 aucun etat sans transformation) ; Partie II
    = l'inventaire REEL de ce jeu, boucle par boucle, avec ses questions ouvertes ;
    Partie III = les glossaires. Tu ne remplis pas une grille vide : tu COMPLETES cette
    carte et tu la rends modifiee. Un trou ne se comble jamais au juge — il devient une
    entree QUESTION_OUVERTE portee par son producteur. R5 : une boucle porte PRODUCTEUR, CONSOMMATEUR, JOUEUR, OBJECTIF, NOUVELLE POSSIBILITE, CONTENU, TRANSFORMATION PERCEPTIBLE — s_il en manque UN SEUL elle est PARTIELLE, jamais COMPLETE."
  - forge/contracts/SCHEMA.md
  - "docs/forge/FORGE_PIPELINE_TARGET_V1.md (cible figee, §1.1 : les 11 dimensions)"
  - "l'artefact worldscan.json produit par s2-worldscan (injecte en amont par
    l'executeur — modes, boucles, conditions de victoire/defaite deja mesures : NE PAS
    les redire, s'y ADOSSER)"
  - "l'artefact story_bible.json produit par s2.6-story-bible (injecte en amont par
    l'executeur — monde, personnages, lieux, objets deja mesures)"
  - "l'artefact art_bible.md produit par s2.5-artbible (injecte en amont par
    l'executeur — identite visuelle deja DECIDEE : style, regles d'affordance, etats
    des personnages)"
  - "l'artefact asset_requests.json produit par s2.5-artbible (injecte en amont par
    l'executeur — demandes d'asset deja formulees)"
  - "heritage/art_response.json et heritage/gm_worldscan.json (Lot B 2026-08-23,
    injectes en amont par l'executeur QUAND ils existent — la reponse de l'Artiste et
    ton propre bloc game_master du run precedent : contrat de retour GM <-> Artiste
    sans station nouvelle. Absents au 1er run : comportement inchange)"
  - "design_intent.md, design/gameplay_loop_content_contract.md,
    design/progression_contract.md, design/calibration.md (Lot D 2026-08-23, GO
    Pierre — fuite de mesure fermee : ces fichiers n'etaient lus par PERSONNE ;
    deposes par l'orchestrateur dans EVIDENCE/runs/<projet>/design/, injectes en
    amont par l'executeur QUAND ils existent. `design/calibration.md` porte les
    INVARIANTS/TARGETS que tu dois reprendre TELS QUELS dans progression_metrics
    — jamais reinventer un nombre que le design a deja fixe. Absents : comportement
    inchange, tu le declares plutot que de compenser)"

# --- 5. Perimetre ---
objectif: >-
  Section 1 (INCHANGEE) : produire les VARIABLES DE CALIBRATION du genre, chiffrees et
  sourcees, sur les 8 dimensions que s2-worldscan ne structure pas : combat,
  progression, economie, RNG, rarete, bonus, metagame, construction. Section 2 (Lot B) :
  traduire le monde decouvert (World Scan + Story Bible + Art Bible + heritage
  inter-run) en un jeu MESURABLE -- avant le Builder, dire pour chaque element
  important WHY -> regle -> metrique -> preuve -> representation visuelle ->
  consommation Builder, au format du bloc `game_master` (9 sorties, cf.
  `output_contract`).

  BOUCLE DE COMPLETION MUTUELLE (Lot F, 2026-08-23 ; canal durci Rupture 11,
  2026-08-23) : cette etape peut tourner deux fois dans le meme run, SUR CE MEME
  CONTRAT (alias `s2.7-gm-worldscan-r2`, cf. forge.contract.base_step -- aucun
  fichier de contrat separe pour le round 2, R1 et R2 partagent EXPRES ce
  texte). Round 1 (premiere passe) : produis les deux sections (scan de genre +
  bloc `game_master`) -- un `game_master` INCOMPLET est TOLERE en round 1
  (jamais en round 2) SEULEMENT si tu termines IMPERATIVEMENT ta reponse par un
  bloc ```design_questions``` VALIDE -- OBLIGATOIRE DES CE ROUND 1, MEME SANS
  QUESTION (`"questions": []` accepte si `declarations` est present -- un GM
  qui n'a AUCUNE question DOIT le declarer dans son bloc, il ne se tait
  jamais ; c'est la presence du fence, pas une question bloquante, qui tolere
  le `game_master` incomplet). Quand tu as des questions : AU MOINS une
  `blocking:true` adressee a l'Artiste pour chaque bloc que tu ne peux pas
  remplir -- "voila ce que je vois" (resume factuel bref) + "voila ce qui me
  manque" : des questions CAUSALES (JAMAIS des cases a cocher -- exemples de
  bonnes questions : "pourquoi le joueur fait-il ceci ?", "quelle
  representation rend cette possibilite evidente ?", "quels etats faut-il
  montrer ?"). Round 2 (si c'est ta 2e passe sur cette etape dans ce run) :
  reponds a TOUTES les questions que tu as recues de l'Artiste -- chaque
  reponse porte un `ref` qui resout dans TON PROPRE gm_worldscan.json
  (`game_master.<bloc>[.<id>]`) -- OU declare `ready_for_freeze:false` MOTIVE
  dans le meme bloc `design_questions`, et COMPLETE ton `game_master` (COMPLET
  exige en round 2, comportement Lot B inchange).

  FORME DU FENCE (durcie -- Rupture 11, mesure sur run 10c : un fence rempli de
  prose markdown -- titres, puces, `ready_for_freeze: true` en queue -- n'est
  PAS parsable et etait tolere a tort) : le fence ```design_questions``` NE
  CONTIENT QUE l'objet JSON, RIEN D'AUTRE -- aucun titre markdown, aucune puce,
  aucune prose, aucun YAML. Toute prose (ton resume factuel, tes intentions) va
  AILLEURS dans ta reponse, JAMAIS a l'interieur de ce fence. Squelette EXACT a
  recopier (adapte `from`/`to`/`about`/`loop_id` a TON pilier -- GM ici ;
  `about` pointe TON PROPRE artefact, jamais celui de l'Artiste ; `loop_id`
  EST OBLIGATOIRE, DEPUIS LE LOT C.4-code -- une des 9 boucles ci-dessous, ou
  'art_gm' pour une question qui porte sur le protocole lui-meme, jamais sur
  une boucle precise) :
  ```design_questions
  {"schema_version": 1, "round": 1, "questions": [{"id": "q_gm_001", "from":
  "GM", "to": "ART", "round": 1, "about": "gm_worldscan:game_master.<bloc>",
  "loop_id": "core_loop", "missing": ["..."], "why": "...", "blocking": true,
  "answer": null}], "declarations": {"ART": {"round": 1,
  "ready_for_freeze": false, "open_to_gm": 0}, "GM": {"round": 1,
  "ready_for_freeze": false, "open_to_art": 1}}}
  ```
  `answer.ref` (round 2) pointe lui aussi TON artefact (le chemin dans
  `game_master` ou tu as repondu).

  SAS CORRECTIF C1/C3 (2026-08-30) -- `answer.modification_locus` (OPTIONNEL,
  retrocompat : une reponse sans ce champ reste valide) : quand tu repondS a
  une question BLOQUANTE, precise l'objet que TA REPONSE a reellement modifie
  -- `{"type": "gm_worldscan"|"art_bible"|"aucune_requise", "justification":
  "..."}`. `"gm_worldscan"` si tu as modifie le bloc `game_master` vise par la
  question (comportement historique). `"art_bible"` si la modification induite
  vit dans l'Art Bible et NULLE PART dans ton propre `game_master` (ex. une
  question sur le theme/habillage). `"aucune_requise"` UNIQUEMENT si l'objet
  questionne est declare normatif/immuable par le Brief du projet ET que tu
  fournis une `justification` non vide -- sinon ta reponse est REFUSEE au
  canal (fail-closed, jamais un laisser-passer silencieux).
  Une sortie SANS ce fence, ou dont le fence
  n'est ni JSON ni YAML structure, ou dont une question ne porte pas de
  `loop_id` valide, est REFUSEE et rejouee avec le retour du materialiseur
  (cf. forge.driver._is_materialize_refusal_reason) -- lis le retour du
  materialiseur si on te le represente, il nomme precisement ce qui a ete
  refuse. Doctrine (verbatim) : « un agent n'est pas oblige de savoir ; il
  est oblige de savoir ce qu'il ne sait pas et de le demander au bon agent ».

  LE PROTOCOLE C.4, PAR BOUCLE (Lot C.4-code -- REFERENCE NORMATIVE :
  kitten_clicker_mutual_completion_contract_v1.md ; les 9 boucles se
  traitent DANS L'ORDRE de C.3 : core -> gameplay -> progression -> content ->
  economy -> skill -> world -> quest -> meta) : TU (GM) PROPOSES la boucle --
  les champs {steps, produces, consumes, unlocks, transformation_perceptible,
  metric_propre} avec ce que tu SAIS ; CHAQUE TROU que tu ne sais pas remplir
  DEVIENT une question `loop_id`-nommee, JAMAIS rempli en silence par une
  estimation. L'ARTISTE VERIFIE ensuite la representation (chaque etat/
  animation/affordance exige par la boucle est-il representable ?) et TE
  DEMANDE ce qui manque (questions causales, blocking si la boucle ne peut
  pas etre COMPLETE sans). Quand tu REPONDS (round 2), ta reponse doit
  REECRIRE les champs C.3 de la boucle concernee -- une reponse qui ne
  modifie AUCUN champ de la boucle est une reponse a cote, refusee par R3-lite
  (regle du driver, hors perimetre de ce contrat) et par R1 (la question
  reste ouverte tant que la boucle n'a pas change). Les deux regles dures
  (C.4, verbatim) :
  R1 -- Freeze : un pilier ne peut declarer `ready_for_freeze` s'il existe
  une question bloquante de l'autre pilier RECUE et non fermee, NI une
  question bloquante qu'IL A LUI-MEME EMISE et non fermee (l'extension R1 du
  Lot C.4-code : poser une question bloquante bloque aussi son propre
  freeze).
  R2 -- Completude : une boucle n'est `COMPLETE` que si (a) son `produces`
  est reference par le `consumes` d'au moins une AUTRE boucle (R2a, sinon
  boucle orpheline) ET (b) sa `transformation_perceptible` est prouvee par un
  `proof_ref` dont le `how` n'est PAS 'humangate' seul (R2b -- une boucle
  structurellement remplie qui ne change rien au jeu, ou dont la seule preuve
  est un avis humain, n'est PAS COMPLETE mecaniquement).

in_scope: >-
  Section 1 : observation comparative de >=2 jeux reels du genre, extraction de
  grandeurs (cadences, vitesses, degats, durees, couts, taux d'apparition, nombres de
  paliers, tailles de pools, distributions), citation de la source de chaque grandeur.
  Section 2 (Lot B, boucles 9 -- Lot C.4-code) : `world_interpretation` (>=3 faits
  cites par adresse worldscan:|story_bible:|art_bible:) ; les 9 boucles testables
  `loops` (core, gameplay, progression, content, economy, skill, world, quest, meta --
  `player_loop` de l'ancien schema Lot B est ABSORBE par `gameplay_loop`), chaque
  boucle un OBJET {steps, produces, consumes, unlocks, transformation_perceptible,
  metric_propre} : chaque etape de `steps` porte `why`, `metric_ref`, `proof_ref` ;
  `produces` (ce que la boucle produit, texte) ; `consumes` (liste de noms de boucles
  qui l'alimentent) ; `unlocks` (liste de noms de boucles = NEXT_LOOP) ;
  `transformation_perceptible` ({text, proof_ref} -- ce que le joueur voit/fait de
  different, prouve par un proof_ref dont le `how` != 'humangate' seul) ;
  `metric_propre` (id de `progression_metrics` EXCLUSIF a cette boucle -- utilise par
  aucune autre, ni comme metric_propre ni comme metric_ref d'une de ses etapes) ;
  `economy_model` (ressources + formules NOMMEES, en texte
  + parametres numeriques) ; `progression_metrics` aux 3 niveaux -- invariant
  (CONTRAIGNANT : cout, seuil, bonus, condition de deblocage), target (contraignant +
  tolerance : duree cible d'un palier), observation (mesuree, non bloquante : duree
  reelle, nombre de clics) ; `proof_model` (comment chaque metrique/etape se verifie) ;
  `grey_blocks` (elements a construire, avec leur etat et ce qu'ils requierent) ;
  `artist_requirements` (contrat de retour vers l'Artiste, SANS station nouvelle --
  format Pierre obligatoire, exemple ci-dessous).
  Exemple contractuel OBLIGATOIRE (le format que chaque grey block LOCATION/ACTOR/
  ITEM/UI doit suivre) :
    unlock: {id: garden, requires: [placed_kittens >= 5]}
    player_need: "Je dois comprendre pourquoi je ne peux pas encore entrer."
    visual_requirement: {locked_state: true, visible_reason: true,
      visible_requirement: "5 chatons places", preview: true}
    grey_block: {type: LOCATION, role: PROGRESSION_GATE, state: LOCKED}

  DEUX GRAPHES ADRESSABLES (Lot D, 2026-08-23, GO Pierre — sans bloc nouveau, deux
  LECTURES du meme materiau) : `gameplay_graph` = `loops.progression_loop` (les
  steps P01, P02... DANS L'ORDRE OU LE JOUEUR LES VIT — cet ordre EST la
  precedence jouee, cf. FUITE 2 fermee dans loop_spec.mjs) ; `progression_graph`
  = `grey_blocks` (requires -> unlock -> next_goal). Chaque noeud des deux
  graphes se lit par les memes sept facettes : why · requires · actor ·
  affordance · metric · target · proof, PLUS pour `progression_graph` : unlock ·
  next_goal.
  REGLE MAITRESSE (ratifiee Pierre, C.2) : UNLOCK != +X % ; UNLOCK = une
  POSSIBILITE PERCEPTIBLE (a voir et/ou a faire). Un grey_block dont
  `builder_contract` ne decrit AUCUN changement de scene ni AUCUNE interaction
  nouvelle est REFUSE. Validation deterministe MINIMALE (ce que
  `game_master_schema.mjs` verifie mecaniquement) : `builder_contract` non vide
  ET `player_meaning` non vide — le reste (le changement decrit est-il REEL,
  perceptible, pas cosmetique) est red-team/HumanGate, jamais un oracle
  automatique.

out_of_scope: >-
  Redire les 3 dimensions deja structurees par s2-worldscan (section 1). Calibrer CE
  jeu par des nombres inventes SANS `why` ni source -- toute valeur (cout, seuil,
  duree cible) doit s'ancrer sur le World Scan, la Story Bible, l'Art Bible ou une
  justification de design explicite, jamais une estimation presentee comme un fait.
  Ecrire du code. Ecrire ou materialiser `economy.json` -- c'est une PROJECTION
  DETERMINISTE derivee par l'executeur APRES ce contrat (cf. `_materialize_economy`),
  jamais un artefact que le Game Master ecrit lui-meme. Produire des matrices
  Construction/Meta (stations suivantes, hors perimetre).

permissions: >-
  read: repo + worldscan.json + knowledge_base. run: WebSearch, WebFetch.
  write: aucun. create: aucun. delete: aucun. L'agent ne pose AUCUN fichier ; il rend
  un bloc ```json``` terminal, l'executeur (run_real.py) materialise
  gm_worldscan.json dans le run_dir — meme patron que s2-worldscan, s4-archi, s5-wiremap.

gardeFou: >-
  Une dimension sans source citee est INTERDITE. Si une grandeur n'est pas observable
  dans les sources accessibles, la declarer `status: "NOT_MEASURED"` avec sa raison —
  jamais une valeur inventee, jamais une plage « plausible ». Un scan honnete portant
  4 dimensions mesurees et 4 NOT_MEASURED vaut infiniment mieux qu'un scan de 8
  dimensions dont la moitie est devinee : les matrices aval calibreront un jeu sur ces
  chiffres, et une valeur fabriquee ici devient une contrainte fausse en aval. (Lot A
  2026-08-23) `sources_consumed` ne liste QUE ce qui a REELLEMENT servi a produire ce
  scan — une adresse citee sans usage reel est une fausse preuve de consommation,
  exactement le meme gaming qu'une source fabriquee.

# --- 6. Reussite & oracle ---
success_criteria: >-
  Bloc ```json``` terminal valide, materialisable en gm_worldscan.json. >=2 jeux
  observes. Les 8 dimensions TOUTES presentes (aucune omise), chacune avec un `status`
  explicite. Chaque dimension `MEASURED` porte >=1 variable, et chaque variable porte
  `name`, `value`, `unit`, `source` non vides. Chaque `source` cite une URL ou un titre
  d'oeuvre verifiable. PLUS (Lot A 2026-08-23) : `sources_consumed` present, un dict a
  3 cles (worldscan/story_bible/art_bible), chaque liste non vide, chaque adresse
  RESOUT reellement dans l'artefact source (cf. output_contract) — une adresse citee
  sans usage reel est une fausse preuve, jamais acceptee. PLUS (Lot B 2026-08-23) : le
  bloc `game_master` present et valide au sens de `game_master_schema.validateGameMaster`
  -- 9 sorties toutes presentes, les 9 boucles (Lot C.4-code) portant chacune au moins
  une etape action/feedback/reward/progression/decision (dans cet ordre relatif),
  chaque etape avec `metric_ref`/`proof_ref` resolus, `produces` non vide, `consumes`/
  `unlocks` = noms de boucles existants, `produces` reference par le `consumes` d'au
  moins une AUTRE boucle (R2a), `transformation_perceptible` {text non vide, proof_ref
  resolu dont `how` != 'humangate' seul} (R2b), `metric_propre` EXCLUSIF (id de
  progression_metrics utilise par aucune autre boucle), >=1 metrique invariant et >=1
  target, chaque metrique invariant/target mesuree par >=1 preuve, chaque grey_block
  LOCATION/ACTOR/ITEM/UI couvert par >=1 artist_requirements.

tests_oracles: >-
  Oracle deterministe non-LLM : `forge.static_oracles.check_gm_worldscan(data)`.
  Verifie la presence des 8 dimensions, la coherence status/contenu (MEASURED => au
  moins une variable complete ; NOT_MEASURED => une raison non vide), et l'absence de
  placeholder. Ne juge JAMAIS la pertinence d'une valeur — seulement sa forme et sa
  tracabilite. PLUS (Lot A 2026-08-23) : `forge.run_real._validate_gm_worldscan`
  (garde-fou minimal a la materialisation, meme regime que le reste de cette table —
  non matérialisable = etape non OK) verifie que `sources_consumed` existe et que
  chaque adresse qu'il cite resout reellement dans worldscan.json / story_bible.json /
  art_bible.md du run. PLUS (Lot B 2026-08-23) : `forge.run_real._validate_game_master_block`
  delegue a `node forge/game_master_schema.mjs <tmp>.json --json` (schema
  ferme, refus NOMME par bloc/id) — meme regime de materialisation, non-conforme =
  etape non OK. `_materialize_economy` derive ensuite `economy.json` (projection
  deterministe, hors perimetre de ce contrat -- l'executeur l'ecrit, jamais l'agent).

# --- 7. Restitution ---
