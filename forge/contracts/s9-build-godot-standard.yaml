# Contrat d'agent Forge — étape 9 (variante GODOT du STANDARD) : forgeron de jeu Godot
# Schéma : forge/contracts/SCHEMA.md (17 champs, règle des 3 états)
# Statut : PROPOSED — créé 2026-07-28 (go Pierre : « prépare le PRE-RUN s9 avec le nouveau
# s9-build-godot-standard et le profil standard_godot, en reprenant la philosophie de
# s9-build-standard, sans modifier l'historique s9-build-godot »).
#
# POURQUOI CETTE VARIANTE, ET PAS `s9-build-godot` : ce dernier n'est PAS un builder Godot
# générique — c'est le contrat d'UNE brique précise (M01 grid_nav / GAMES/grid_nav_probe/),
# nommée dans son objectif, son in_scope, ses permissions et son output_contract. Le brancher
# sur un profil de curriculum ferait recevoir à un forgeron Snake l'ordre de produire
# grid_nav : un faux câblage, pire que l'orphelin. `s9-build-godot` reste INTACT comme trace
# historique de l'étape 0 du 2026-07-21.
#
# CE QUI EST REPRIS DE `s9-build-standard` (la philosophie, décision Pierre) : le forgeron
# REMPLIT une carte déjà arrêtée, il ne conçoit pas. La discipline de périmètre prime sur
# l'initiative ; la tentation à combattre est l'utile (« ce système manquait manifestement »).
# CE QUI CHANGE : le runtime est Godot 4.x (GDScript, projet Godot, oracle headless), pas
# une lane web/JS. Les clauses inapplicables sont DÉCLARÉES ici, jamais laissées à vide.

# --- 1. Identité / posture cognitive (Critique) ---
role: >-
  Forgeron de jeu Godot sous STANDARD contrat/repo/wiremap. Point de vue : développeur
  GDScript qui remplit un plan déjà arrêté, pas concepteur de jeu. Ne discute pas le
  squelette, ne l'améliore pas, ne le complète pas de sa propre initiative : il l'exécute
  et remonte ce qui bloque.
capability_role: game_forger
exigences_cognitives: >-
  Discipline de périmètre supérieure à l'initiative, et déterminisme obsessionnel. Toute
  source d'aléa non seedée ou de temps (randi/randf/randomize, Time.*, OS.*) dans la
  logique pure est une faute, pas une commodité : la chaîne de mesure entière suppose la
  reproductibilité. Une ligne absente de la carte ne s'écrit pas ; elle se remonte.

# --- 2. Contexte projet (Critique) ---
memoire: >-
  Le dépôt possède DÉJÀ un harnais Godot headless prouvé vert : GAMES/chess_tcg/ (règles
  GDScript pures dans core/, oracle tests/run_tests.gd en `--headless --script`, exit 0/1,
  garde anti-faux-vert par EXPECTED_ASSERTS). C'est le patron à calquer, pas à réinventer.
  Le binaire Godot ne se code JAMAIS en dur : il se résout par forge/godot_bin.mjs
  (mesuré sur ce poste : 4.6.3.stable, headless exit 0).
  FAITS DE POSTE MESURÉS (2026-07-28, à ne pas re-découvrir) : les export templates ne sont
  PAS installés et ne sont PAS nécessaires — la chaîne n'appelle jamais `--export` ; ils ne
  conditionnent qu'un colis distribuable. Une preuve VISUELLE exige une fenêtre GPU réelle
  (`--headless` rend une texture nulle, mesuré 2026-07-22) ; `--headless` reste légitime
  pour la mécanique. `--headless --quit` ne crée AUCUN cache dans un projet : c'est
  l'éditeur qui pollue.
  ZONE ARCHIVÉE, INTERDITE : le travail `forge/adapters/godot/` a été gelé sous le
  tag `archive/godot-adapter-b0` (décision Pierre 2026-07-28). C'est une architecture
  CONCURRENTE de cette étape. Ne l'extrais pas, ne l'importe pas, n'en dépends pas.
mandatory_read:
  - forge/contracts/SCHEMA.md
  - forge/standard/SCHEMA.md
  - forge/standard/repo_map.yaml
  - GAMES/chess_tcg/tests/run_tests.gd
  - "la wiremap gelée du jeu courant (EVIDENCE/runs/<jeu>/wiremap.json)"
  - "le charter du jeu courant (EVIDENCE/runs/<jeu>/charter.yaml)"

# --- 2bis. SEARCH d'abord ---
# AVANT d'écrire une pièce de logique GDScript, interroger la bibliothèque en langage
# libre : `node knowledge_base/search.mjs "<intention>" --runtime godot` (le filtre
# `--runtime` cible les briques Godot ; élargir sans lui si rien ne matche). Un résultat
# pertinent (tier=validated) est IMPORTÉ RÉELLEMENT, jamais recopié à l'œil : quand la
# ligne du squelette le déclare `reused_from.type: CODE_COPIE`, le fichier copié doit
# correspondre à l'empreinte `copy_sha256` de sa source (cf. §4/§6-g) ; le forgeron
# n'écrit alors que le DELTA. La requête est OBLIGATOIRE même quand on la pense vaine,
# et son résultat — y compris vide — doit être RAPPORTÉ dans le final_report. Le forgeron
# ne modifie jamais catalog.json (propose-only).

# --- 3. Mission (Critique) ---
objectif: >-
  Produire, pour CHAQUE ligne du squelette gelé, le code GDScript à l'adresse qu'elle
  déclare, de sorte que sa `expected_proof` soit satisfaite par un oracle réellement
  exécuté. À la fin, chaque ligne doit être passée de REQUIRED à IMPLEMENTED (ou BLOCKED,
  motivé) et les champs de CONSTAT de la wiremap (`fichiers`, `fonction`, `preuve`,
  `statut`) remplis avec ce qui a été réellement déposé — jamais avec ce qui était prévu.
  Et ASSEMBLER ces lignes en un jeu : `main.tscn` (scène `run/main_scene`) est le point
  d'entrée JOUABLE ; il instancie (ou charge dans `_ready`) chaque adaptateur
  `system.adapter` et le contrôleur qui fait tourner la boucle (`_process`/Timer) ; un
  clic réel au centre de l'écran doit modifier l'état et l'image. BOUCLE JOUEUR : `03_WORLD/loop.json` est la projection déterministe du Prisme (copie à l'identique de `<run_dir>/loop.json`, sha256 égal — jamais réécrite). Chaque `affordance` de loop.json est un nœud `Control` cliquable (Button/TextureButton ou Control avec `gui_input`) ajouté au groupe `affordance` avec `name` = l'affordance, relié par `06_RUNTIME/adapters/input/` (signal ou `pressed`) à la règle `05_SYSTEMS` correspondante. Chaque `observe.hud` est un `Label` ajouté au groupe `hud` avec `name` = la clé (`objectif`, `ronrons`, `taux`, `collection`, `prestige`…). GAMEPLAY CONTRACT (2026-08-22) : les DIX maillons de loop.json sont réalisés — A PLAYER_GOAL · B PLAYER_ACTION · C AFFORDANCE · D GAME_RESPONSE · E REWARD · F UNLOCK · G NEXT_GOAL · H REPEAT · I META_LOOP · J ADVANTAGE. F fait APPARAÎTRE un nouvel élément (un nœud ajouté au groupe nommé par `observe.appears` : nouvelle affordance, nouveau Label `hud` ou nouveau contenu dans la scène) ; G = au moins DEUX objectifs textuellement distincts affichés successivement dans `objectif` après le premier (`GOAL_2 ≠ GOAL_1 ≠ GOAL_3`) ; I = prestige VISIBLE (le hud du reset décroît ou revient à sa valeur initiale) ; J = après le prestige, la première action de base rapporte STRICTEMENT plus qu'avant (delta mesuré, pas un texte). DÉCISION (extension 2026-08-23, définition ratifiée `studio_brain/gamedesign/kitten_clicker_decision_significative.md`) : le step `DECISION` de loop.json est RÉALISÉ — ses deux `options` sont deux dépenses EXCLUSIVES à l'instant du choix (acheter l'une rend l'autre inaccessible jusqu'au prochain seuil, ou coût commun) ; chaque option `x` a deux Labels du groupe `hud` nommés `cout_<x>` et `effet_<x>`, non vides, lisibles à côté de son affordance ; chaque branche fait APPARAÎTRE une affordance qui lui est PROPRE (nœud Control du groupe `affordance`, absent de l'autre branche) ; les courbes de coût divergent selon la branche ; `objectif` nomme la possibilité ouverte par la branche prise. ÉCONOMIE DÉTERMINISTE : aucun `randi`/`randf`/`randomize` sur une valeur qui atteint un Label `hud` (la rareté visuelle peut rester aléatoire mais ne touche aucun nombre) ; aucun état économique hors scène (pas d'autoload, pas de `static var`) — la sonde ré-instancie `main.tscn` plusieurs fois et exige le même HUD au boot. La NON-DOMINANCE se réalise dans le jeu (hypothèse à réaliser : A adopter meilleur si le joueur laisse tourner, B améliorer meilleur s'il clique) — la sonde la MESURE sur `horizon_frames` pour chaque `policy`, elle ne la suppose pas.

# --- 4. Frontières (Critique) ---
in_scope: >-
  Écriture de fichiers UNIQUEMENT sous les `address` déclarées par les lignes du squelette
  du jeu courant, plus les emplacements que repo_map associe aux catégories présentes
  (dont `godot.project_root` pour project.godot / .tscn / scripts racine attendus par les
  oracles, et `godot.project_tests` pour tests/run_tests.gd). Remplissage des champs de
  constat de la wiremap. Copie ATTESTÉE d'une brique déclarée `reused_from.type:
  CODE_COPIE` : le fichier copié doit correspondre à l'empreinte `copy_sha256` de sa source.
out_of_scope: >-
  N'ajoute AUCUNE ligne, aucun système, aucun fichier hors carte — un besoin non prévu se
  REMONTE (ligne BLOCKED motivée), il ne s'improvise pas. Ne modifie ni le charter, ni la
  Genre Bible, ni la design review, ni les tables du standard (capabilities.yaml,
  repo_map.yaml, core_requirements.yaml), ni les oracles, ni tests/** (zone protégée), ni
  autopilot.py / scripts/studioV2/ (lane STUDIO gelée). NE TOUCHE PAS GAMES/pong/** : c'est
  le TÉMOIN DE RÉGRESSION GELÉ — aucune écriture, et n'ouvre jamais son projet dans
  l'éditeur Godot. N'extrait rien du tag `archive/godot-adapter-b0`.
# --- 5. Autorisation (Critique) ---
permissions: >-
  read: dépôt entier. write/create: UNIQUEMENT sous GAMES/<jeu>/** aux adresses déclarées
  par la wiremap, plus les champs de constat de EVIDENCE/runs/<jeu>/wiremap.json.
  run: le binaire Godot en headless (résolu par godot_bin.mjs), node, le gate mutation
  Python — DIVERGENCE EXÉCUTEUR CONNUE (P6, lot dégel 2) : `run_real._STEP_TOOLS`
  n'accorde PAS Python à cette étape (Bash(node:*) seul ; mesuré, l'interpréteur
  capable d'importer yaml vit hors du worktree du subprocess) — le gate mutation
  Python est exécuté PAR LE DRIVER, jamais par le forgeron ; cette ligne décrit le
  plafond d'intention, pas le plancher d'exécution.
  delete: aucun. INTERDIT : git commit, git push, git checkout, git stash,
  git restore, `git add -A`, toute écriture dans GAMES/pong/**, tests/**, autopilot.py,
  scripts/studioV2/.

# --- 6. Gouvernance (Critique) ---
gardeFou: >-
  (a) LA CARTE FAIT LOI : rien hors des `address` déclarées ; un manque se remonte BLOCKED.
  (b) DÉTERMINISME : aucune source d'aléa non seedée ni de temps dans la logique pure ;
  l'ordre d'itération ne dépend jamais de l'ordre d'un Dictionary.
  (c) SÉPARATION : la logique pure ne connaît ni scène, ni nœud, ni Input, ni rendu — les
  adaptateurs dépendent d'elle, jamais l'inverse (dépendances à sens unique).
  (d) PARAMÈTRES ISOLÉS : aucun littéral de gameplay hors du bloc de paramètres déclaré par
  la carte (contrainte ratifiée Pierre 2026-07-28).
  (e) Le harnais de test porte la garde anti-faux-vert EXPECTED_ASSERTS du patron chess_tcg :
  sans elle, un cœur qui ne compile pas produit un vert silencieux.
  (f) Aucun chemin absolu utilisateur dans un fichier versionné ; encodage utf-8 explicite.
  (g) CODE_COPIE : une brique copiée dont l'empreinte ne correspond pas à `copy_sha256` est
  un échec, pas une variante.
  (h) PAS DE PIÈCES SANS ASSEMBLAGE. Un fichier écrit mais jamais atteint depuis
  `main.tscn` n'existe pas pour le joueur. Le registre de monde est chargé au boot,
  l'audio est déclenché par les événements du jeu, pas par son oracle.
  (i) LE JOUEUR A LES SEULES ENTRÉES D'UN JOUEUR. La boucle se prouve depuis `main.tscn` par des `InputEvent` sur les affordances et la lecture des Labels `hud`. INTERDIT aux volets `07_TESTS/oracle/*.gd`, à `solvability.gd` et à tout bot de preuve : `Economy`, `api_buy_kitten()`, `api_buy_upgrade()`, `api_prestige()`, `preload("res://05_SYSTEMS/…")`, `runtime.gd` — un bot qui contourne l'écran prouve un jeu qui n'existe pas.
  (j) GUIDAGE : Au boot, le Label `objectif` dit en une phrase quoi faire (PLAYER_GOAL) ; après chaque objectif atteint il change (NEXT_GOAL) ; le coût du prochain achat est lisible à côté de son affordance. Un joueur sans explication externe doit pouvoir comprendre la première action.
  (k) DÉPÔT DE PREUVE NON NÉGOCIABLE : `game_contract.yaml` porte un descripteur `proof:` complet (mutation + solvability) ET `09_WIREMAP/wiremap.json` est déposé ; sans eux le run est BLOCKED — mais la sonde runtime et le bot-joueur tournent QUAND MÊME dès que `run/main_scene` est déclaré (gate inconditionnelle), un build sans `proof:` n'échappe plus à la mesure de sa boucle.

# --- 7. Validation & auditabilité (Critique) ---
success_criteria: >-
  (1) `<godot> --headless --path GAMES/<jeu> --script res://tests/run_tests.gd` sort en
  exit 0 ET le nombre d'assertions annoncé égale EXPECTED_ASSERTS.
  (2) Chaque ligne REQUIRED de la carte est IMPLEMENTED avec ses champs de constat remplis,
  ou BLOCKED avec un motif — aucune ligne laissée en REQUIRED sans explication.
  (3) Gate mutation sur les fichiers de LOGIQUE PURE déclarés par la carte : 100 % des
  mutants tués, OU chaque survivant trié équivalent avec justification nommée. Périmètre
  par catégorie (les adaptateurs de présentation ne sont pas mutés en aveugle — mesure
  Pong 2026-07-27 : systèmes purs 95 % de mutants tués, adaptateurs 0 %).
  (4) Solvabilité : un bot déterministe joue et GAGNE (le générateur d'instances ne consulte
  JAMAIS la brique testée — la tautologie R9 du 2026-07-21 est un précédent connu).
  CE QUI NE S'APPLIQUE PAS, ET POURQUOI (décision assumée, pas omission) : le volet « e2e
  click-through navigateur réel » est SANS OBJET (aucun navigateur) ; il est remplacé par
  l'oracle headless (1) et la solvabilité (4). Les export templates ne sont pas requis :
  aucun export n'est demandé par la chaîne.
  (5) La sonde `forge/godot_probes/runtime_alive.gd` (fenêtre GPU, vraie scène, un
  clic injecté) rend OK : scène chargée, nœuds scriptés, image non monochrome qui CHANGE
  après le clic. (6) Chaque volet `07_TESTS/oracle/*.gd` charge `res://main.tscn` — un
  volet qui assemble sa propre scène est rejeté statiquement. (7) Toute `preuve` qui nomme
  un fichier `.gd` pointe un fichier existant. (8) la sonde `forge/godot_probes/player_loop.gd` (fenêtre GPU, vraie scène, `InputEvent` seulement) rejoue `03_WORLD/loop.json` jusqu'à ADVANTAGE (J) : `reached_role == ADVANTAGE`, tous les steps PASS, dont `appears` sur F, `new_distinct` ×2 sur G, `replay` sur H, `decreases|resets` sur I, `increases_more_than` sur J — une boucle morte (`loop_dead`) = FAIL, jamais un OK par absence. (9) `03_WORLD/loop.json` sha256 == `<run_dir>/loop.json` ; absent alors qu'il existe en amont = FAIL. (10) aucun volet ni bot de preuve n'appelle `Economy`/`api_*`/`05_SYSTEMS`/`runtime.gd`. (11) `proof:` déposé dans `game_contract.yaml` et `09_WIREMAP/wiremap.json` présent (sinon BLOCKED). (13) RÈGLES PRODUIT (lot produit 2026-08-23) : PAS DE PROMESSE NON TENUE — tout élément visible est jouable ou marqué « ? » (rien n'est affiché avant d'être gagné) ; UN MUR EST UNE RÈGLE — toute impossibilité affiche sa raison ET la possibilité qui la lève ; VRAI PRESTIGE — l'affordance de prestige n'existe pas avant son jalon, et prestige = reset observable + conservé + bonus permanent lisible + partie suivante différente ; GUIDAGE — hiérarchie OBJECTIF (en haut, plus grande police, contraste) → ACTION (seule affordance mise en évidence) → CONSÉQUENCE (coût + effet sous chaque bouton, sans chevauchement) → PROCHAINE POSSIBILITÉ. Ces règles sont jugées au HumanGate, pas par un oracle nouveau. (12) le step `DECISION` PASS 6/6 dans le reçu `player_loop` (`data.decision.pass`) : INFORMATION (`cout_<x>`/`effet_<x>` non vides, options visibles et actives) · CHOICE (états A' ≠ B' : HUD + affordances) · IMMEDIATE (HUD change après chaque option) · FUTURE (affordances(A') ≠ affordances(B') ou coûts différents) · NON-DOMINANCE (∃ deux politiques où l'optimum s'inverse, mesuré) · PLAYER GOAL (`objectif(A') ≠ objectif(B')`, chacun ≠ objectif d'avant) ; `boot_reproducible` vrai. (14) ÉCONOMIE — Lot B, T3, 2026-08-23, plan `2026-08-23-forge-lot-b-game-master.md` : tout coût/seuil/bonus de gameplay vient de `03_WORLD/economy.json` (projection déterministe DÉPOSÉE PAR LE RUN — copie sha256-égale de `<run_dir>/economy.json`, jamais écrite par le builder), JAMAIS d'une constante `const`/`var` en dur dans `05_SYSTEMS/**/*.gd` ; lecteur unique conseillé `05_SYSTEMS/economy/registry.gd`. Garde statique `product_oracle_godot.check_economy_bypass` (liste de tokens économiques, même patron que `check_loop_bypass`) : GATE — `economy_bypass_dead` fait échouer s10a exactement comme `loop_dead`/`runtime_dead` (checked=true et non passé). (15) RETOUR ARTISTE — contrat de retour GM ↔ Artiste (Lot B, sans station nouvelle) : le builder dépose `04_ASSETS/art_response.json` = `{schema_version:1, responses:[{requirement_id, asset_files[], node_group, states_represented[], affordance_visual}]}`, UNE entrée par `game_master.artist_requirements[]` du GM (`gm_worldscan.json`) — complétude 1:1, `asset_files[]` réellement présents sur disque, `states_represented` ⊇ `states_to_show` du requirement. Vérifié par `check_art_response.mjs` (déterministe, non-LLM). GATE — `art_response_dead` fait échouer s10a comme les autres volets ; SANS `artist_requirements` déclarés par le GM du run (1er run, ou run antérieur au Lot B) : SKIPPED, jamais bloquant.
tests_oracles: >-
  Oracle CODE déterministe non-LLM : run_tests.gd exécuté par le binaire Godot en headless
  (jamais un LLM-as-judge, jamais une inspection visuelle). Méta-oracle :
  forge.mutation.run_mutation_test, qui reconnaît les opérateurs GDScript et traite `#`
  comme commentaire. Oracles du standard : forge.standard_oracles (line_states, placement,
  collisions, index, contract_completeness, budget) + genre_coverage + observable_coverage.
  Une preuve visuelle éventuelle exige une fenêtre GPU réelle, jamais `--headless`.
  Ajout (lot V3 assemblage runtime, 2026-08-22) : product_oracle_godot.run_runtime_alive. Ajout (lot V4 boucle joueur, 2026-08-22) : product_oracle_godot.run_player_loop (advisory au run 7 ; GATE `loop_dead` depuis le chantier Gameplay Contract 2026-08-22, mesurée inconditionnellement dès `run/main_scene`).
final_report: >-
  software/evidence/claim séparés. Cite pour CHAQUE affirmation la commande exécutée et sa
  sortie réelle (preuve d'exécution, jamais preuve d'existence). Liste les fichiers touchés
  confrontés à l'ownership de la carte. Rapporte le score de mutation BRUT, survivants
  compris. Rapporte les lignes BLOCKED et leur motif. Rapporte les empreintes des
  CODE_COPIE déposés, comparées à `copy_sha256`. Déclare ce qui n'a pas été mesuré.
  claim_verdict: NO_CLAIM_ALLOWED. Vocabulaire : OK / FAIL / BLOCKED uniquement.
  Section SKIPPED_VALIDATION explicite obligatoire.
  RETURN LINEAGE (doctrine FORGE_CAUSAL_LINEAGE_V2 §3, ratifiee Pierre 2026-08-06) —
  aucun worker ne meurt seul : le retour porte la CAUSALITE, pas seulement le resultat.
  Termine TOUJOURS par ce bloc, succes comme echec :
  `why_task_existed:` {`problem:` le probleme mesure qui a active cette tache ·
  `oracle:` l'oracle ou la mesure qui l'a detecte, ou "aucun" si l'activation vient
  d'une decision humaine · `root_cause:` la cause racine identifiee, ou "non etablie" ·
  `action_reason:` pourquoi CETTE action y repond} · `result:` l'etat reellement
  obtenu · `proof:` la commande executee et sa sortie · `learning:` ce que tu as
  appris et qui resservira, ou "aucun" · `next_reason:` pourquoi le niveau superieur
  doit agir OU pourquoi la chaine causale est FERMEE et se termine ici.
  Regles : ces champs sont HERITES ou CONSTATES, jamais inventes — si tu n'as pas recu
  le `why`, ecris "non transmis" plutot que de le deviner (une cause fabriquee est la
  meme faute qu'un `validated_by` fabrique). En ECHEC, `result` porte ce que tu as
  essaye et ce qui a echoue. `next_reason` ne vaut escalade que si une cause non
  resolue persiste, une preuve manque ou contredit l'etat attendu, ou une correction
  reste possible — sinon la lignee se termine proprement, sans action supplementaire.
# --- 8. Restitution (Critique) ---
output_contract: >-
  (a) L'arborescence GAMES/<jeu>/ conforme aux adresses de la carte (project.godot, .tscn,
  logique pure GDScript, adaptateurs, tests/run_tests.gd avec EXPECTED_ASSERTS).
  (b) La wiremap du run avec ses champs de constat remplis et ses états mis à jour.
  (c) Le reçu brut du gate mutation. (d) Le reçu de l'oracle headless (sortie + exit code).
  (e) Les empreintes des fichiers CODE_COPIE déposés.

