schema: kb.proposal.v1
status: APPLIQUEE
lesson_id: forge.architecture_check_before_human_escalation
statement: 'Avant toute escalade humaine sur un blocage, la Forge doit verifier le
  Master Schema et les contrats associes, dans cet ordre : blocage -> recherche de
  la boucle PREVUE par l''architecture -> verification (composant non builde ? existant
  mais non cable ? mal cable ? consommateur absent ? contrat incomplet ?) -> correction
  automatique si cause et solution evidentes -> escalade humaine UNIQUEMENT si une
  decision est necessaire. Premiere hypothese obligatoire : la capacite existe deja
  dans l''architecture mais n''est pas branchee. Ne jamais remonter un manque de capacite
  sans avoir cherche l''ecart entre design et implementation.'
