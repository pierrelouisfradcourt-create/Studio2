schema: kb.proposal.v1
status: APPLIQUEE
lesson_id: forge.reuse_tracking_oracle_dead_since_inception
statement: Deux volets d'oracle destines a mesurer la reutilisation de briques du
  catalogue (search_consulted, reuse_ratio_wired) ne sont jamais passes verts sur
  AUCUN run de la Forge observe, depuis le premier (pong_r2) jusqu'aux runs les plus
  recents (10 runs Snake, puis Breakout) -- toujours 'aucune recherche journalisee'
  et 'run-oracle.mjs absent'. Comme ces deux volets ne bloquent jamais le verdict
  final (des runs Snake OK/HUMANGATE_READY_WITH_OBJECTION les ont toujours en FAIL),
  ils fonctionnent en pratique comme du bruit permanent dans le rapport plutot que
  comme un signal. Un volet d'oracle qui echoue 100% du temps sur toute l'histoire
  mesuree et ne conditionne jamais une decision doit etre soit cable, soit retire
  du rapport -- le laisser en l'etat forme un signal rouge qu'on apprend a ignorer,
  ce qui degrade la confiance dans les VRAIS signaux rouges.
