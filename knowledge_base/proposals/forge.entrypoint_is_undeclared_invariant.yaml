lesson_id: forge.entrypoint_is_undeclared_invariant
statement: 'Un projet peut satisfaire toutes ses preuves Forge (assertions, mutation,
  solvabilite, verify_run AUTHENTIQUE) et etre impossible a lancer : les index et
  cartes de projet prouvent la coherence de ce qui est DECLARE, jamais l''exhaustivite
  de ce qui est NECESSAIRE. Un point d''entree (scene principale, bootstrap, entrypoint
  runtime) doit etre un invariant structurel explicite du contrat, verifie en ABSENCE
  comme en presence -- sinon un oracle vert ne peut pas voir manquer ce que personne
  n''a declare.'
