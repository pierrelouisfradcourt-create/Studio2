statement: 'Le mode de panne dominant d''une premiere campagne sur un nouveau runtime
  (ici : premiere cible Godot apres un regime uniquement web/JS) n''est pas un bug
  isole mais une famille : un instrument de la chaine de preuve SUPPOSE une topologie
  (web) au lieu de LIRE celle declaree par le projet. Chaque instrument corrige un
  a un finit par re-tomber sur la meme cause. Avant d''ajouter un correctif ponctuel
  a un oracle qui echoue sur un nouveau type de jeu, verifier s''il lit la topologie
  declaree ou s''il presuppose celle du jeu precedent.'
