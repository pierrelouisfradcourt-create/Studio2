schema: kb.proposal.v1
status: APPLIQUEE
lesson_id: forge.run_status_not_liveness_proof
statement: 'Un champ run_status: RUNNING dans un state.json n''est pas une preuve
  de vie du run : quand un run long est lance depuis le shell d''un sous-agent orchestrateur
  plutot que depuis la session de supervision, la mort de ce sous-agent tue son process
  d''arriere-plan sans mettre a jour l''etat. Le step-timeout ne peut pas se declencher
  car il vit dans le process mort. Avant de croire un RUNNING, verifier qu''un process
  existe reellement et l''age du dernier updated_ts.'
