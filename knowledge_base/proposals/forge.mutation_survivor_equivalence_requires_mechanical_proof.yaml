schema: kb.proposal.v1
status: APPLIQUEE
lesson_id: forge.mutation_survivor_equivalence_requires_mechanical_proof
statement: Quand un producteur (builder) trie lui-meme un mutant survivant comme 'equivalent'
  (le mutant ne change pas le comportement observable), cette affirmation n'est PAS
  une preuve mecanique tant qu'aucun oracle independant ne l'a verifiee -- elle reste
  une auto-evaluation du meme agent qui a ecrit le code. Le studio a correctement
  traite ce cas comme une objection HumanGate plutot qu'un vert silencieux, mais le
  mecanisme de triage ne distingue pas aujourd'hui un survivant verifie d'un survivant
  simplement affirme.
