status: APPLIQUEE
lesson_id: forge.test_green_via_wrong_causal_path
statement: Un test peut rester vert non pas parce que la propriete testee est vraie,
  mais parce que ses assertions sont satisfaites par un chemin de code different de
  celui qu'il pretend verifier. Un test de non-tunneling qui verifie vx<0, x<=limite
  et score=0 peut passer parce qu'un point marque par erreur a recentre la balle (nouveau
  service), pas parce que la balle a ete correctement renvoyee -- le test devient
  une preuve de vert, pas une preuve de correction. Toujours tracer le CHEMIN qui
  satisfait chaque assertion, pas seulement leur valeur finale.
