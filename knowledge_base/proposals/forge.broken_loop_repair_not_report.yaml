statement: 'Une boucle cassee dont la cause racine est identifiee et la solution connue
  doit etre REPAREE immediatement, pas remontee comme observation. Le role de la Forge
  n''est pas de signaler les ecarts mais de reconnecter les boucles : diagnostic ->
  cause -> correction -> test -> preuve, exactement comme pour un bug. On repare le
  mecanisme generique, jamais le cas particulier en exception.'
