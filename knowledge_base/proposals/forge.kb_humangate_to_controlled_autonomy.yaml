statement: 'La HumanGate sur l''ingestion KB etait une securite de PHASE DE CONSTRUCTION,
  destinee a eviter de polluer la connaissance avant que les mecanismes de preuve
  existent. Une fois la KB cablee, les validations mecaniques en place, les propositions
  structurees et les preuves produites, elle doit evoluer vers une AUTONOMIE CONTROLEE
  : recherche, extraction, proposition, validation mecanique et ingestion automatiques
  sous conditions de preuve. La securite anti-derive reste obligatoire mais passe
  par des controles mecaniques, pas par un blocage humain permanent -- sinon la Forge
  ne monte jamais en competence.'
