schema: kb.proposal.v1
status: APPLIQUEE
lesson_id: forge.new_proof_needs_declared_executor
statement: Un test ecrit pendant un run n'existe dans la chaine qualite que si la
  commande d'oracle du projet le liste explicitement. Un builder peut produire de
  nouveaux fichiers de preuve, tous verts a la main, sans qu'aucun oracle amont ne
  les invoque -- le jeu passe alors ses oracles sans qu'aucune des preuves neuves
  ne tourne. Toute nouvelle preuve doit arriver avec son executeur nomme dans scripts/forge/oracles.json,
  sinon elle ne compte pas.
