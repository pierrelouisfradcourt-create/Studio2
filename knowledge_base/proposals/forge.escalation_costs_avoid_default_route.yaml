lesson_id: forge.escalation_costs_avoid_default_route
statement: 'Une escalade humaine a un cout reel : interruption du flux, consommation
  de contexte, perte de temps, dilution de la mission. L''humain n''est pas la route
  par defaut quand une correction est determinee. Avant de solliciter l''humain, verifier
  : est-ce une decision de conception ? un changement d''invariant ? un choix produit
  ? existe-t-il plusieurs solutions valides ? Si non aux quatre et que cause, correction
  et maitrise du risque sont acquises, la Forge applique. Chaque escalade doit etre
  justifiee par une NECESSITE DE DECISION, jamais par une incapacite a appliquer une
  solution deja trouvee.'
