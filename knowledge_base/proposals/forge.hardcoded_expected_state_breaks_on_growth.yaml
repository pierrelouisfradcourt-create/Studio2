lesson_id: forge.hardcoded_expected_state_breaks_on_growth
statement: 'Un test qui code en dur une liste d''etat attendu (noms de fichiers, chemin
  de dossier de run) au lieu de la deriver d''une source declarative rougit pour des
  raisons qui ne sont pas des defauts du produit : le jeu gagne legitimement un systeme,
  ou un run est archive et deplace. Le signal devient rouge alors que la realite est
  saine -- c''est la definition d''un faux signal. Deriver l''attendu de la source
  declarative (ex. categories de la wiremap) et comparer un etat donne a un etat donne
  (snapshot), jamais a une cible mouvante.'
