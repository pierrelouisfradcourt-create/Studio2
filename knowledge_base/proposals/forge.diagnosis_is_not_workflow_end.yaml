schema: kb.proposal.v1
status: APPLIQUEE
lesson_id: forge.diagnosis_is_not_workflow_end
statement: 'Un diagnostic n''est PAS une fin de workflow. Quand la Forge identifie
  la cause racine, le composant responsable et la correction evidente, elle applique
  la correction AVANT de demander une validation humaine. La sortie attendue est PROBLEM
  / CAUSE / ACTION / VALIDATION / ESCALADE-si-choix-humain-restant, jamais PROBLEM
  / CAUSE / QUESTION. Ne jamais transformer un bug d''implementation en decision humaine.
  Grille avant escalade : prevu au Master Schema ? deja contracte ? cause identifiee
  ? solution determinee ? risque acceptable ? Si oui aux cinq : reparer, tester, documenter.'
