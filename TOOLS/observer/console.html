// Aperçu court (2-3 lignes/éléments visibles) + "voir plus" dépliable pour
// les champs de contrat volumineux (listes longues, YAML/prose complets) --
// jamais tronqué en silence : le contenu complet reste toujours accessible
// dans le <details>, juste pas affiché d'emblée (charge cognitive du premier
// écran, cf. arbitrage Pierre).
function sFieldValTruncated(cell, maxItems, maxChars){
  maxItems = maxItems || 3;
  maxChars = maxChars || 220;
  if (cell === undefined || cell === null) return sFieldVal(cell);
  if (typeof cell !== "object" || cell.v === undefined) return sFieldVal(cell);
  if (isNO(cell.v)) return sFieldVal(cell);
  const v = cell.v;
  const src = cell.src ? " " + srcLink(cell.src) : "";
  if (Array.isArray(v)) {
    if (v.length <= maxItems) return sFieldVal(cell);
    return `${tags(v.slice(0, maxItems))}<details class="s3-fieldmore"><summary>+${v.length-maxItems} voir plus</summary><div style="margin-top:4px">${tags(v)}</div></details>${src}`;
  }
  if (typeof v === "string" && v.length > maxChars) {
    return `<details class="rawjson"><summary>${esc(v.slice(0, maxChars).trim())}… (voir plus)</summary><div class="wrap" style="margin-top:4px">${esc(v)}</div></details>${src}`;
  }
  return sFieldVal(cell);
}

// Lien « ce qui est réellement injecté au prompt » : rattache la dernière
// activation observée pour cet agent (enrichissement.derniere_activation,
// identifiée par run_id) à sa ligne dans s6_injection -- best-effort par
// run_id (aucune étape n'est portée par derniere_activation pour affiner).
function s3InjectionLink(r){
  const da = r.enrichissement && r.enrichissement.derniere_activation;
  if (!da || isNO(da.v)) {
    return `<div class="dim mono-small">Ce qui est réellement injecté au prompt — ${noAware(NOT_OBSERVABLE, "aucune activation observée pour cet agent dans ce projet")}</div>`;
  }
  const s6 = STATE.data && STATE.data.views && STATE.data.views.s6_injection;
  const lignes = (s6 && s6.lignes) || [];
  const idx = lignes.findIndex(l => l.run_id === da.run_id);
  if (idx < 0) {
    return `<div class="dim mono-small">Ce qui est réellement injecté au prompt — aucune activation Injection correspondante retrouvée pour <b>${esc(da.run_id||'?')}</b></div>`;
  }
  return `<button class="filterbtn" data-goto-tab="s6" data-goto-s6="${idx}">→ voir ce qui a réellement été injecté au prompt (${esc(da.run_id)})</button>`;
}

function s5CatCountLabel(cat){

function s5ConsCell(cons){

    ? declares.map(d => `<span class="tag" title="${esc(d.raw||'')}">${esc(d.contrat)}</span>`).join("")

// Quatre rôles d'un artefact, en langage clair -- NOT_OBSERVABLE reformulé
// (« personne ne le … ») avec le mot technique + la raison en bulle, jamais
// caché. `produit_par`/`consomme_par` sont des alias serveur de
// `producteur`/`consommateurs` (même calcul) -- on lit les deux noms de champ
// pour rester robuste si l'un des deux disparaît un jour côté serveur.
function s5ProduitLine(cell){
  cell = cell || {};
  if (isNO(cell.v)) {
    return `<div class="s5-role"><b>Qui le produit…</b> <span class="no" title="${esc('NOT_OBSERVABLE — ' + (cell.why||''))}">personne ne le produit de façon tracée</span></div>`;
  }
  const v = cell.v;
  const inner = (v && typeof v === "object")
    ? `${esc(v.etape || '?')} — run ${esc(v.run_id || '?')} (${fmtNum(v.n_ecritures)} écriture(s))`
    : esc(v);
  const src = cell.src ? " " + srcLink(cell.src) : "";
  return `<div class="s5-role"><b>Qui le produit…</b> ${inner}${src}</div>`;
}
// « Qui le modifie » réutilise la même cellule que produit_par : le champ
// serveur (file.write/file.edit rattachés au chemin) ne distingue pas
// création de modification -- reformuler la question sans dupliquer la
// donnée reste honnête, la cellule/why le dit explicitement (file.edit y
// est déjà nommé côté serveur).
function s5ModifieLine(cell){
  cell = cell || {};
  if (isNO(cell.v)) {
    return `<div class="s5-role"><b>Qui le modifie…</b> <span class="no" title="${esc('NOT_OBSERVABLE — ' + (cell.why||''))}">personne ne le modifie de façon tracée (aucun file.write/file.edit observé)</span></div>`;
  }
  const v = cell.v;
  const inner = (v && typeof v === "object")
    ? `${esc(v.etape || '?')} — run ${esc(v.run_id || '?')} (${fmtNum(v.n_ecritures)} écriture(s))`
    : esc(v);
  const src = cell.src ? " " + srcLink(cell.src) : "";
  return `<div class="s5-role"><b>Qui le modifie…</b> ${inner}${src}</div>`;
}
function s5ConsommeLine(cons){
  cons = cons || {};
  const declares = cons.declares || [];
  const observes = cons.observes || {};
  const nDecl = declares.length;
  const obsNO = isNO(observes.n);
  const nObsHtml = obsNO
    ? `<span class="no" title="aucune lecture file.read observée pour ce chemin">NOT_OBSERVABLE</span>`
    : String(observes.n || 0);
  let html = `<div class="s5-role"><b>Qui le lit…</b> <span class="dim mono-small">(déclaré : ${nDecl}, observé : ${nObsHtml})</span></div>`;

// Couleurs ratifiées (arbitrage Pierre) : vert = déclaré et bien injecté ·
// orange = déclaré mais absent du prompt reçu · bleu = injecté sans être
// déclaré par le contrat · gris = absent des deux.
function s6StatutBadge(statut){
  const map = {
    DECLARE_ET_INJECTE:    {cls:"st-success", ico:"✓"},
    DECLARE_NON_RETROUVE:  {cls:"st-blocked", ico:"⚠"},
    INJECTE_NON_DECLARE:   {cls:"st-running", ico:"i"},
    ABSENT_DES_DEUX:       {cls:"st-waiting", ico:"—"},
  };
  const m = map[statut] || {cls:"st-waiting", ico:"?"};
  return `<span class="badge ${m.cls}">${m.ico} ${esc(statut)}</span>`;
}
// Récapitulatif : champs déclarés par le contrat mais JAMAIS retrouvés dans le
// prompt reçu, de façon constante sur toutes les activations observées où ils
// sont déclarés — c'est la découverte de la vue, mise en avant en premier.
function s6ComputeRecap(lignes){
  const labels = {};
  const stats = {};
  (lignes||[]).forEach(l => {
    const matriceByKey = {};
    (l.matrice||[]).forEach(el => { matriceByKey[el.element] = el; });
    (l.maillons||[]).forEach(m => {
      labels[m.cle] = m.label;
      if (!stats[m.cle]) stats[m.cle] = {declaredCount:0, everInjected:0, everConformeLayer:0};
      if (m.declare) {
        stats[m.cle].declaredCount++;
        if (m.statut === "DECLARE_ET_INJECTE") stats[m.cle].everInjected++;
        const el = matriceByKey[m.cle];
        // Amendement layer (ratifié Pierre 2026-08-02) : un champ de couche
        // dispatch (skill/plugin) ou documentation (delegation) jamais rendu
        // dans le prompt est NORMAL — son canal de preuve n'est pas le texte
        // du prompt. Ne pas le compter comme un drift ici non plus, sinon ce
        // bandeau reproduit exactement le mismatch que la matrice a résolu.
        if (el && (el.statut === "CONFORME_DISPATCH" || el.statut === "CONFORME_DOCUMENTAIRE")) {
          stats[m.cle].everConformeLayer++;
        }
      }
    });
  });
  const jamaisRendu = Object.keys(stats).filter(k =>
    stats[k].declaredCount > 0 && stats[k].everInjected === 0 && stats[k].everConformeLayer === 0);
  const conformeLayer = Object.keys(stats).filter(k =>
    stats[k].declaredCount > 0 && stats[k].everInjected === 0 && stats[k].everConformeLayer > 0);
  return {jamaisRendu, conformeLayer, labels};
}

// Taxonomie statut_v2 (ratifiée) : Declare -> Rendu prompt -> Recu agent ->
// Observe execution, un cran plus loin que `statut` (déclaré/injecté seuls).

          ${statutsV2Order.map(s => `<span>${s6StatutV2Badge(s)} <b>${fmtNum(parStatutV2[s]||0)}</b></span>`).join("")}
        </div>
        <div class="dim mono-small" style="margin-top:8px">Note datée 2026-08-02 : à cette mesure, DECLARED_NOT_INJECTED comptait ${fmtNum(parStatutV2.DECLARED_NOT_INJECTED||0)}. La taxonomie matrice qui l'a remplacée requalifie ces champs en ${fmtNum(parStatutMatrice.CONFORME_DISPATCH||0)} CONFORME_DISPATCH (couche dispatch, jamais son canal) + ${fmtNum(parStatutMatrice.CONFORME_DOCUMENTAIRE||0)} CONFORME_DOCUMENTAIRE (couche documentation, hors matrice d'exécution). L'historique de mesure n'est pas réécrit ci-dessus, il est daté.</div>
        ${dni.length ? `<div class="dim mono-small" style="margin-top:6px">déclarés par le contrat mais jamais injectés dans le prompt reçu (mesure historique), toutes activations confondues : ${dni.map(d => `${esc(d.label)} (${fmtNum(d.activations)})`).join(" · ")}</div>` : ""}
        ${recapV2.regle ? `<div class="dim mono-small" style="margin-top:6px">${esc(recapV2.regle)}</div>` : ""}
      </div>
    </details>` : "";

  const selector = `<select id="s6select" class="filterbtn" style="padding:4px 8px;max-width:100%">
    ${lignes.map((x,i) => `<option value="${i}" ${i===_s6selected?'selected':''}>${esc(x.run_id)} / ${esc(x.etape)}${x.attempt!=null?(' attempt '+x.attempt):''}</option>`).join("")}
  </select>`;

  const legend = `<div class="legend" style="margin-top:8px">
    <span>${s6StatutBadge("DECLARE_ET_INJECTE")} déclaré et bien injecté</span>
    <span>${s6StatutBadge("DECLARE_NON_RETROUVE")} déclaré mais absent du prompt</span>
    <span>${s6StatutBadge("INJECTE_NON_DECLARE")} injecté sans être déclaré</span>
    <span>${s6StatutBadge("ABSENT_DES_DEUX")} absent des deux</span>
  </div>`;

  const matriceByKey = {};
  (l.matrice||[]).forEach(el => { matriceByKey[el.element] = el; });
  const maillonsHtml = (l.maillons||[]).map(m => `
    <div class="s6-maillon">
      <div class="run-head"><b>${esc(m.label)}</b> ${s6StatutBadge(m.statut)}</div>
      <div class="dim mono-small" style="margin-top:3px">${m.declare
        ? (m.declare_src ? ('déclaré : ' + srcLink(m.declare_src)) : 'déclaré')
        : `<span title="${esc(m.declare_why||'')}">non déclaré par le contrat</span>`}</div>
      <div class="dim mono-small">${m.observe
        ? (m.observe_src ? ('retrouvé : ' + srcLink(m.observe_src, m.observe_section || 'src')) : 'retrouvé dans le prompt')
        : 'non retrouvé dans le prompt reçu'}</div>
      <div class="dim mono-small" style="margin-top:3px">consommé : ${s6ConsommationHtml(m)}</div>
      ${s6MatriceElementBox(matriceByKey[m.cle])}
    </div>
    <div class="s1-arrow">↓</div>
  `).join("");

  const meta = s6FindPromptMeta(l);
  const promptEnvoyeHtml = `<div class="s6-maillon" style="border-color:var(--accent)">
    <div class="run-head"><b>= Prompt envoyé</b>${meta ? (' ' + matchBadge(meta.verification)) : ''}</div>
    <div class="dim mono-small" style="margin-top:3px">${meta ? (fmtNum(meta.chars_normalized) + ' car. normalisés') : '<span class="dim">taille non recoupée</span>'}${l.source ? (' ' + srcLink(l.source, 'provenance')) : ''}</div>
  </div>`;

  // Suite de chaîne : ce que ce prompt déclenche en aval, jusqu'au retour
  // (cassé) vers la Knowledge Base — le cycle de vie complet d'un prompt.
  const suiteHtml = `
    <div class="s1-arrow">↓</div>
    ${s6ReponseBox(l)}
    <div class="s1-arrow">↓</div>
    ${s6ValidationBox(l)}
    <div class="s1-arrow">↓</div>
    <div class="s6-maillon"><div class="run-head"><b>= Observer</b> <span class="dim mono-small">(ce cockpit — auto-référence assumée)</span></div></div>
    ${pedagogyBox("bloc:Observer")}
    <div class="s1-arrow">↓</div>
    ${pedagogyBox("bloc:retour KB", {borderColor:"var(--fail)", badge:"⛔ CASSÉ, PROUVÉ"})}
  `;

  return `${pilotHeader("s6", s6)}
    <div class="dim mono-small" style="margin-bottom:8px">${esc(s6.chaine||"")} → Réponse → Validation → Observer → Knowledge</div>
    ${recapHtml}
    ${recapMatriceHtml}
    ${recapV2Html}
    <div style="margin:10px 0">${selector}</div>
    ${legend}
    <div class="s6-chain">${maillonsHtml}${promptEnvoyeHtml}${suiteHtml}</div>
  `;
}

/* ---- S8 : PLANNING — "Que construit-on ensuite ?" (nouvel onglet) ----
 * Forme réelle produite par observer/system_planning.py::view_planning :
 *   {question, resume,
 *    jeux_en_cours:{cartes:[{projet,etat_lisible,dernier_run,decision,quand,
 *                             src,etat_lisible_why?,quand_why?}], par_etat, regle},
 *    registre:{v: NOT_OBSERVABLE | [tache...], why, taches, rejets},
 *    backlog_derive:{chantiers:[{id,source,objectif,raison,priorite_suggeree,
 *                                 preuve_de_fin,owner,n_occurrences,run_ids,related?}],
 *                     n_depuis_drift,n_depuis_lecons,n_avec_related,note_related},
 *    proposition_yaml:{chemin, note, contenu_preview, why?}}
 * Trois zones, jamais un tableau de 50 lignes : cartes jeux (EN ATTENTE DE
 * PIERRE en premier), cartes backlog (une phrase, priorité par couleur),
 * encart registre (proposition non ratifiée -> chemin en texte, jamais
 * cliquable : lab/reports/observer/ est hors du périmètre lisible d'Observer
 * lui-même, testé au runtime -- 403 blindness_violation).
 */
function s8EtatBadge(etat){
  if (isNO(etat)) return `<span class="no">⛔ NOT_OBSERVABLE</span>`;
  if (etat === "EN ATTENTE DE PIERRE") return `<span class="badge" style="background:#3a2408;color:#ffb35c;border:1px solid #ffb35c">⏳ EN ATTENTE DE PIERRE</span>`;
  if (etat === "BLOQUÉ") return `<span class="badge st-blocked">⛔ BLOQUÉ</span>`;
  if (etat === "TERMINÉ-ARCHIVÉ") return `<span class="badge st-success">✓ TERMINÉ-ARCHIVÉ</span>`;
  return esc(etat);
}
function clip(s, n){
  s = String(s == null ? "" : s);
  return s.length > n ? s.slice(0, n).trim() + "…" : s;
}
function renderS8Jeux(jeux){
  const cartes = (jeux && jeux.cartes || []).slice();
  const rank = {"EN ATTENTE DE PIERRE": 0, "BLOQUÉ": 1, "TERMINÉ-ARCHIVÉ": 3};
  cartes.sort((a, b) => (rank[a.etat_lisible] ?? (isNO(a.etat_lisible) ? 2 : 2)) - (rank[b.etat_lisible] ?? (isNO(b.etat_lisible) ? 2 : 2)));
  if (!cartes.length) return emptyState("aucun jeu observé");
  return `<div class="grid cols-auto">${cartes.map(c => `
    <div class="card ${c.etat_lisible==='EN ATTENTE DE PIERRE' ? 's8-card-attente' : ''}">
      <div class="run-head"><b>${esc(c.projet)}</b></div>
      <div style="margin-top:4px">${s8EtatBadge(c.etat_lisible)}</div>
      <div class="dim mono-small" style="margin-top:6px">${esc(c.dernier_run||'')}</div>
      <div style="margin-top:4px">${verdictBadge(c.decision)}</div>
      <div class="dim mono-small" style="margin-top:4px">${isNO(c.quand) ? noAware(c.quand, c.quand_why) : esc(c.quand)}</div>
      ${c.src ? `<div style="margin-top:6px">${srcLink(c.src, "voir")}</div>` : ""}
    </div>`).join("")}</div>`;
}
function s8PrioBorder(p){
  if (p === 1) return "border-color:var(--sev-high)";
  if (p === 2) return "border-color:var(--sev-medium)";
  if (isNO(p)) return "border-color:var(--no)";
  return "";
}
function s8PrioBadge(p){
  if (isNO(p)) return `<span class="no" title="aucune règle de priorisation définie pour ce type de chantier (NOT_OBSERVABLE)">priorité ?</span>`;
  const cls = p === 1 ? "sev-high" : p === 2 ? "sev-medium" : "sev-info";
  return `<span class="badge ${cls}">P${esc(p)}</span>`;
}
function renderS8Backlog(backlog){
  const chantiers = (backlog && backlog.chantiers) || [];
  if (!chantiers.length) return emptyState("aucun chantier dérivé (aucun drift CORRIGER, aucune leçon validée)");
  return `<div class="grid cols-auto">${chantiers.map(c => `
    <div class="card" style="${s8PrioBorder(c.priorite_suggeree)}">
      <div class="run-head">${s8PrioBadge(c.priorite_suggeree)}<span class="tag">${esc(c.source)}</span></div>
      <div style="margin-top:5px">${esc(c.objectif)}</div>
      <div class="dim mono-small" style="margin-top:5px" title="${esc(c.raison||'')}">${esc(clip(c.raison, 140))}</div>
      ${c.related && c.related.length ? `<div class="dim mono-small" style="margin-top:5px">lié à : ${tags(c.related.map(r=>r.id))}</div>` : ""}
    </div>`).join("")}</div>`;
}
// lab/reports/observer/ n'est pas une racine lisible d'Observer (testé au
// runtime : /api/source y répond 403 blindness_violation) -- le chemin de la
// proposition n'est donc JAMAIS cliquable, affiché en texte, raccourci pour
// lisibilité (chemin complet en title).
function s8DisplayPath(p){
  const norm = String(p || "").replace(/\\/g, "/");
  const marker = "lab/reports/observer/";
  const idx = norm.toLowerCase().indexOf(marker);
  return idx >= 0 ? norm.slice(idx) : norm;
}
function renderS8Registre(registre, backlog, proposition){
  registre = registre || {v: NOT_OBSERVABLE};
  proposition = proposition || {};
  if (Array.isArray(registre.v)) {
    const rows = registre.v.map(t => `<tr>
        <td class="mono-small">${esc(t.id)}</td><td class="wrap">${esc(t.objectif)}</td>
        <td>${esc(t.priorite)}</td><td>${esc(t.etat)}</td>
      </tr>`).join("");
    return card(`<b>${registre.v.length} tâche(s) active(s) dans le registre ratifié</b>
      <div class="table-scroll" style="margin-top:8px"><table>
        <thead><tr><th>id</th><th>objectif</th><th>priorité</th><th>état</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`);
  }
  const n = ((backlog && backlog.chantiers) || []).length;
  const chemin = proposition.chemin;
  const pathHtml = isNO(chemin)
    ? noAware(chemin, proposition.why)
    : `<code class="mono-small" title="${esc(chemin)}">${esc(s8DisplayPath(chemin))}</code>`;
  return `<div class="card" style="border-color:var(--sev-medium)">
    <div><b>Aucun registre ratifié n'existe.</b> Observer a préparé une proposition (${n} tâche(s)) → ${pathHtml}</div>
    <div class="dim mono-small" style="margin-top:6px">la promotion vers le registre est un geste Pierre, jamais automatique — ce chemin n'est pas cliquable ici : lab/reports/observer/ est hors du périmètre lisible d'Observer lui-même (garde de cécité)</div>
  </div>`;
}
function renderS8(s8){
  if (!s8) return emptyState();
  const jeux = s8.jeux_en_cours || {cartes:[]};
  const backlog = s8.backlog_derive || {chantiers:[]};
  const registre = s8.registre || {v: NOT_OBSERVABLE};
  const proposition = s8.proposition_yaml || {};
  return `${pilotHeader("s8", s8)}
    <h2 class="vtitle" style="margin-top:14px">Jeux<span class="sub">${(jeux.cartes||[]).length} projet(s) — dernier run de chacun</span></h2>
    ${renderS8Jeux(jeux)}
    <h2 class="vtitle" style="margin-top:18px">Backlog dérivé<span class="sub">${(backlog.chantiers||[]).length} chantier(s) candidat(s) — issus des écarts (drift) et des leçons validées</span></h2>
    ${renderS8Backlog(backlog)}
    <h2 class="vtitle" style="margin-top:18px">Registre</h2>
    ${renderS8Registre(registre, backlog, proposition)}
  `;
}

/* ---- S9 : PRODUCTION (graphe) — "Que produit-on, et où ça bloque ?"
 * Forme réelle produite par observer/system_production.py::view_production :
 *   {question, resume, chaine_ratifiee:[niveaux...],
 *    registre_planning:{v,src?,why?},
 *    graphes:{<projet>: {type:"riche"|"reduit"|NOT_OBSERVABLE, noeuds:[
 *        {id,niveau,etat:{v,src?,why?},proprietaire:{v,...},
 *         preuve_attendue:{v,...},dependances:[],
 *         risques:[{type,severity,run_id,detail,source}], objectif?,
 *         dernier_run?,...}], aretes:[{from,to,type}], why?, why_reduit?}},
 *    bloquants:{<projet>:[noeud_id...]} | {"_":"aucun..."}, note_derivation}
 * Rendu demandé : simple, par jeu, chaîne de nœuds avec états, bloquants en
 * rouge — pas de SVG (listes imbriquées suffisent). ---- */
const S9_NIVEAU_LABELS = {
  jeu: "Jeu", core_loop: "Core loop", systeme: "Système", artefacts: "Artefacts",
  tests: "Tests", validation: "Validation", amont: "Amont (registre planning)",
};
const S9_NIVEAU_ORDER = ["jeu","core_loop","systeme","artefacts","tests","validation","amont"];
function s9CellHtml(cell){
  if (!cell) return '<span class="dim">—</span>';
  if (isNO(cell.v)) return noAware(cell.v, cell.why);
  const v = cell.v;
  const inner = (typeof v === "object" && v !== null) ? esc(JSON.stringify(v)) : esc(v);
  const src = cell.src ? " " + srcLink(cell.src) : "";
  return inner + src;
}
function s9NodeHtml(n, bloques){
  const bloque = (bloques||[]).some(b => b === n.id || String(b).startsWith(n.id + " "));
  const hasHighRisk = (n.risques||[]).some(r => r.severity === "high");
  const risquesHtml = (n.risques && n.risques.length)
    ? `<details class="rawjson" style="margin-top:6px"><summary>${n.risques.length} risque(s)${hasHighRisk ? ' <span class="badge sev-high">high</span>' : ''}</summary>
        <div style="margin-top:4px">${n.risques.map(r => `<div class="driftno-detail" style="margin-bottom:4px">${sevBadge2(r.severity)} <b>${esc(r.type)}</b> — ${esc(r.detail)}${r.run_id ? ` <span class="dim mono-small">${esc(r.run_id)}</span>` : ""}</div>`).join("")}</div>
      </details>`
    : "";
  return `<div class="card" style="padding:8px${bloque ? ";border-color:var(--fail)" : ""}">
    <div class="run-head"><span class="tag">${esc(S9_NIVEAU_LABELS[n.niveau] || n.niveau)}</span>${bloque ? ' <span class="badge st-blocked">⛔ bloquant</span>' : ""}</div>
    <div style="margin-top:4px"><b class="mono-small">${esc(n.id)}</b></div>
    ${n.objectif ? `<div class="dim mono-small" style="margin-top:3px">${esc(clip(n.objectif, 160))}</div>` : ""}
    ${n.dernier_run ? `<div class="dim mono-small" style="margin-top:3px">${s9CellHtml(n.dernier_run)}</div>` : ""}
    <div class="kv" style="margin-top:6px;grid-template-columns:110px 1fr">
      <span class="k">état</span><span>${s9CellHtml(n.etat)}</span>
      <span class="k">propriétaire</span><span>${s9CellHtml(n.proprietaire)}</span>
      <span class="k">preuve attendue</span><span>${s9CellHtml(n.preuve_attendue)}</span>
    </div>
    ${risquesHtml}
  </div>
  <div class="s1-arrow">↓</div>`;
}
function s9GraphHtml(projet, g, bloquants){
  const bloques = bloquants[projet] || [];
  if (!g || !g.noeuds || !g.noeuds.length) {
    const why = (g && (g.why || g.why_reduit)) || "aucun noeud pour ce projet";
    return `<h2 class="vtitle" style="margin-top:16px">${esc(projet)}</h2>${card(noAware(NOT_OBSERVABLE, why))}`;
  }
  const noeuds = g.noeuds.slice().sort((a,b) => {
    const ia = S9_NIVEAU_ORDER.indexOf(a.niveau), ib = S9_NIVEAU_ORDER.indexOf(b.niveau);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });
  const chaineHtml = noeuds.map(n => s9NodeHtml(n, bloques)).join("");
  const whyReduit = g.type === "reduit" && g.why_reduit
    ? `<div class="dim mono-small" style="margin-top:6px">${esc(g.why_reduit)}</div>` : "";
  return `<h2 class="vtitle" style="margin-top:16px">${esc(projet)}<span class="sub">${esc(g.type||NOT_OBSERVABLE)} — ${noeuds.length} noeud(s)</span></h2>
    ${whyReduit}
    <div class="s6-chain">${chaineHtml}</div>`;
}
function renderS9(s9){
  if (!s9) return emptyState();
  const title = pilotHeader("s9", s9);
  const bloquants = s9.bloquants || {};
  const bloquantsList = Object.entries(bloquants).filter(([k]) => k !== "_");
  const bloquantsHtml = bloquantsList.length
    ? card(`<b style="color:var(--fail)">⛔ ${bloquantsList.reduce((n,[,v])=>n+v.length,0)} point(s) de blocage ou risque high</b>
        ${bloquantsList.map(([p,ids]) => `<div class="dim mono-small" style="margin-top:4px"><b>${esc(p)}</b> : ${ids.map(esc).join(", ")}</div>`).join("")}`)
    : card(`<span class="dim">${esc(bloquants._ || "aucun blocage localisé")}</span>`);
  const registreHtml = s9.registre_planning
    ? `<div class="dim mono-small" style="margin-top:8px">registre planning (lecture seule) : ${s9CellHtml(s9.registre_planning)}</div>` : "";
  const graphes = s9.graphes || {};
  const projets = Object.keys(graphes).sort();
  const graphesHtml = projets.length
    ? projets.map(p => s9GraphHtml(p, graphes[p], bloquants)).join("")
    : emptyState("aucun graphe de production observé");
  return `${title}${bloquantsHtml}${registreHtml}${graphesHtml}
    <div class="dim mono-small" style="margin-top:14px">${esc(s9.note_derivation||"")}</div>`;
}

/* ---- S10 : DÉCISIONS (evidence) — "Quelles décisions fondent le système,
 * et lesquelles sont sans trace de résultat ?" Forme réelle produite par
 * observer/evidence.py::view_evidence : {schema, total, par_source,
 * par_confiance, par_statut, sans_resultat:{n,ids,note}, unknown_par_champ,
 * non_normalisables:[{source_family,id,raison}], question,
 * reponse:{fondent_avec_resultat_trace:[ids], sans_trace_de_resultat:[ids]},
 * resume, registre:{path,lignes,note,why?}}. La vue ne sert PAS le détail
 * complet des 7 champs canoniques par décision : le registre normalisé est
 * écrit sous lab/reports/observer/ (même garde de cécité que s8/s5 — hors
 * périmètre lisible d'Observer lui-même, jamais cliquable ici) ; seuls les
 * identifiants et les agrégats sont servis côté console. ---- */
function s10CounterTable(dict, label){
  const entries = Object.entries(dict||{});
  if (!entries.length) return '<span class="dim">—</span>';
  return `<div class="table-scroll"><table><thead><tr><th>${esc(label)}</th><th>n</th></tr></thead><tbody>
    ${entries.sort((a,b)=>b[1]-a[1]).map(([k,v]) => `<tr><td>${esc(k)}</td><td>${fmtNum(v)}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function renderS10(s10){
  if (!s10) return emptyState();
  const title = pilotHeader("s10", s10);
  const sansResultat = s10.sans_resultat || {n:0, ids:[]};
  const chocHtml = `<div class="card" style="border-color:var(--sev-high)">
    <b style="color:var(--sev-high)">⚠ ${fmtNum(sansResultat.n)} décision(s) sur ${fmtNum(s10.total)} sans trace de résultat</b>
    <div class="dim mono-small" style="margin-top:4px">${esc(sansResultat.note||"")}</div>
    ${(sansResultat.ids && sansResultat.ids.length) ? `<details class="rawjson" style="margin-top:6px"><summary>${sansResultat.ids.length} identifiant(s)</summary><div style="margin-top:4px">${tags(sansResultat.ids, 300)}</div></details>` : ""}
  </div>`;

  const fondent = (s10.reponse && s10.reponse.fondent_avec_resultat_trace) || [];
  const fondentHtml = `<details class="rawjson" style="margin-top:8px"><summary>${fondent.length} décision(s) fondées avec résultat tracé</summary><div style="margin-top:4px">${tags(fondent, 300)}</div></details>`;

  const countsHtml = `<div class="grid cols-auto" style="margin-top:12px">
    <div class="card">${s10CounterTable(s10.par_source, "source")}</div>
    <div class="card">${s10CounterTable(s10.par_confiance, "confiance")}</div>
    <div class="card">${s10CounterTable(s10.par_statut, "statut")}</div>
    <div class="card">${s10CounterTable(s10.unknown_par_champ, "champ UNKNOWN")}</div>
  </div>`;

  const nn = s10.non_normalisables || [];
  const nnHtml = nn.length ? `<details class="rawjson" style="margin-top:10px"><summary>${nn.length} non normalisable(s)</summary>
      <div class="table-scroll" style="margin-top:6px"><table><thead><tr><th>source</th><th>id</th><th>raison</th></tr></thead>
      <tbody>${nn.map(x => `<tr><td class="mono-small">${esc(x.source_family)}</td><td class="mono-small wrap">${esc(x.id||"")}</td><td class="wrap dim mono-small">${esc(x.raison)}</td></tr>`).join("")}</tbody></table></div>
    </details>` : "";

  const reg = s10.registre || {};
  const regPath = isNO(reg.path) ? noAware(reg.path, reg.why) : `<code class="mono-small" title="${esc(reg.path)}">${esc(s8DisplayPath(reg.path))}</code>`;
  const regHtml = `<div class="dim mono-small" style="margin-top:12px">registre normalisé (${fmtNum(reg.lignes)} ligne(s), non cliquable — hors périmètre lisible d'Observer) : ${regPath}<div style="margin-top:2px">${esc(reg.note||"")}</div></div>`;

  return `${title}${chocHtml}${fondentHtml}${countsHtml}${nnHtml}${regHtml}`;
}

/* ---- RK : 🗺️ ROADMAP — fusion visuelle Roadmap(s2) + Planning(s8) en
   kanban 4 domaines (Jeux / Forge / Studio / Infrastructure) × 4 états
   (À faire / En cours / Bloqué / Terminé), arbitrage Pierre 2026-08-02.
   Cartes MESURÉES (Fleet via s8_planning) en couleur normale ; cartes
   DOCTRINE (s2_roadmap, proof SELF_DECLARED) grisées, pointillées. Le
   rapprochement domaine/état est grossier (données réelles : les chantiers
   de backlog_derive n'ont pas de champ domaine explicite, seulement un
   owner DOCTRINE/REGISTRE/HARNAIS -- tous des marqueurs Forge, vérifié sur
   les 12 chantiers observés) : mention gardée en pied de tableau. ---- */

const RK_STATES = ["afaire", "encours", "bloque", "termine"];
const RK_STATE_LABELS = {afaire:"À faire", encours:"En cours", bloque:"Bloqué", termine:"Terminé"};

function rkStateFromEtatLisible(etat){
  if (isNO(etat)) return null;
  if (etat === "EN ATTENTE DE PIERRE") return "afaire";
  if (etat === "BLOQUÉ") return "bloque";
  if (etat === "TERMINÉ-ARCHIVÉ") return "termine";
  if (/EN COURS/i.test(String(etat))) return "encours";
  return null;
}
function rkStateFromDoctrine(statut){
  if (!statut) return null;
  const s = String(statut);
  if (/FAIT/i.test(s) || /TESTED/i.test(s)) return "termine";
  if (/EN COURS/i.test(s)) return "encours";
  if (/CIBLE/i.test(s)) return "afaire";
  return null;
}
function rkPush(cols, domaine, bucket, html){
  cols[domaine][bucket || "inconnu"].push(html);
}
function rkCardMeasured(c){
  const bucket = rkStateFromEtatLisible(c.etat_lisible);
  const html = `<div class="card" style="padding:8px">
    <div class="run-head"><b>${esc(c.projet)}</b></div>
    <div style="margin-top:3px">${s8EtatBadge(c.etat_lisible)}</div>
    <div class="dim mono-small" style="margin-top:3px">${esc(c.dernier_run||'')}</div>
    <div style="margin-top:3px">${verdictBadge(c.decision)}</div>
    ${c.src ? `<div style="margin-top:4px">${srcLink(c.src,"voir")}</div>` : ""}
  </div>`;
  return {bucket, html};
}
function rkCardBacklog(ch){
  const html = `<div class="card" style="padding:8px;${s8PrioBorder(ch.priorite_suggeree)}">
    <div class="run-head">${s8PrioBadge(ch.priorite_suggeree)}<span class="tag">${esc(ch.source)}</span></div>
    <div style="margin-top:4px">${esc(ch.objectif)}</div>
    ${(ch.related && ch.related.length) ? `<div class="dim mono-small" style="margin-top:4px">lié à : ${tags(ch.related.map(r=>r.id))}</div>` : ""}
  </div>`;
  return {bucket:"afaire", html};
}
function rkCardDoctrine(label, statutText, sourceLabel){
  const bucket = rkStateFromDoctrine(statutText);
  const html = `<div class="card rk-doctrine" style="padding:8px">
    <span class="badge st-waiting" title="extrait best-effort d'un document HTML manuel — pas une mesure mécanique">SELF_DECLARED</span>
    <div class="run-head" style="margin-top:4px"><b>${esc(label)}</b></div>
    <div class="dim mono-small" style="margin-top:3px">${esc(statutText||'')} — ${esc(sourceLabel||'')}</div>
  </div>`;
  return {bucket, html};
}
function rkDoctrineNoteHtml(rows, nameField, cellField){
  const entries = (rows||[]).map(r => ({nom:(r[nameField]&&r[nameField].v)||"?", cell:r[cellField]}));
  if (!entries.length) return "";
  const body = entries.map(e => {
    const c = e.cell;
    let valHtml;
    if (!c) valHtml = '<span class="dim">—</span>';
    else if (isNO(c.v)) valHtml = noAware(c.v, c.why);
    else if (Array.isArray(c.v)) valHtml = `${c.v.length} mention(s) doctrine trouvée(s)`;
    else valHtml = esc(c.v);
    return `<div class="mono-small" style="margin-bottom:4px"><b>${esc(e.nom)}</b> — ${valHtml}</div>`;
  }).join("");
  return `<details class="rawjson" style="margin-top:6px"><summary>doctrine — mentions sans état associé (${entries.length})</summary><div style="margin-top:4px">${body}</div></details>`;
}

function renderRK(){
  const views = STATE.data && STATE.data.views;
  if (!views) return emptyState();
  const s8 = views.s8_planning || {};
  const s2 = views.s2_roadmap || {};

  const cols = {};
  ["Jeux","Forge","Studio","Infrastructure"].forEach(d => {
    cols[d] = {};
    RK_STATES.concat("inconnu").forEach(s => cols[d][s] = []);
  });

  // Jeux — mesuré (Fleet, via s8_planning.jeux_en_cours)
  ((s8.jeux_en_cours && s8.jeux_en_cours.cartes) || []).forEach(c => {
    const {bucket, html} = rkCardMeasured(c);
    rkPush(cols, "Jeux", bucket, html);
  });
  // Jeux — doctrine grisée (s2_roadmap.jeux, proof SELF_DECLARED)
  ((s2.jeux && s2.jeux.lignes) || []).forEach(j => {
    const nom = (j.jeu && j.jeu.v) || "?";
    const cur = j.doctrine_curriculum && j.doctrine_curriculum.v;
    const pil = j.doctrine_pilotage && j.doctrine_pilotage.v;
    if (cur && typeof cur === "object" && cur.statut_doctrine) {
      const {bucket, html} = rkCardDoctrine(nom, cur.statut_doctrine, "doctrine curriculum");
      rkPush(cols, "Jeux", bucket, html);
    }
    if (pil && typeof pil === "object" && pil.statut_pilotage) {
      const {bucket, html} = rkCardDoctrine(nom, pil.statut_pilotage, "doctrine pilotage");
      rkPush(cols, "Jeux", bucket, html);
    }
  });

  // Forge — backlog dérivé : les 12 chantiers observés portent tous un owner
  // DOCTRINE/REGISTRE/HARNAIS/NOT_OBSERVABLE (marqueurs internes Forge,
  // aucun non-Forge identifié) -> tous placés ici, tous "à faire" (ce sont
  // des propositions, pas des tâches démarrées).
  const chantiers = (s8.backlog_derive && s8.backlog_derive.chantiers) || [];
  chantiers.forEach(ch => {
    const {bucket, html} = rkCardBacklog(ch);
    rkPush(cols, "Forge", bucket, html);
  });

  const forgeDoctrineHtml = rkDoctrineNoteHtml(s2.forge && s2.forge.lignes, "chantier", "doctrine");
  const infraDoctrineHtml = rkDoctrineNoteHtml(s2.infrastructure && s2.infrastructure.lignes, "composant", "doctrine");

  const domaines = ["Jeux","Forge","Studio","Infrastructure"];
  const board = domaines.map(d => {
    const lanes = RK_STATES.map(s => `<div class="rk-lane">
        <div class="rk-lane-title">${esc(RK_STATE_LABELS[s])} <span class="dim">(${cols[d][s].length})</span></div>
        ${cols[d][s].length ? cols[d][s].join("") : '<div class="dim mono-small" style="padding:4px 0">—</div>'}
      </div>`).join("");
    const inconnuLane = cols[d]["inconnu"].length ? `<div class="rk-lane">
        <div class="rk-lane-title">État <span class="no" style="font-size:9px;padding:0 4px">NOT_OBSERVABLE</span></div>
        ${cols[d]["inconnu"].join("")}
      </div>` : "";
    let extra = "";
    if (d === "Studio") {
      extra = `<div class="dim mono-small" style="padding:6px 0">rien de mesurable — aucun chantier backlog rattaché à un domaine hors Forge dans ce périmètre</div>`;
    }
    if (d === "Forge") extra += forgeDoctrineHtml;
    if (d === "Infrastructure") extra += infraDoctrineHtml;
    return `<div class="rk-col"><div class="rk-col-title">${esc(d)}</div>${lanes}${inconnuLane}${extra}</div>`;
  }).join("");

  return `${pilotHeader("rk", {resume: s8.resume})}
    <div class="legend">
      <span><span class="sw" style="background:var(--bg3);border:1px solid var(--border)"></span>mesuré (Fleet / backlog dérivé)</span>
      <span><span class="sw rk-doctrine" style="background:var(--bg3)"></span>doctrine SELF_DECLARED (grisé, pointillé)</span>
    </div>
    <div class="rk-board">${board}</div>
    <div class="dim mono-small" style="margin-top:10px">rapprochement domaine ↔ état grossier — les chantiers du backlog dérivé n'ont pas de champ domaine explicite (tous à owner interne Forge dans ce périmètre) ; voir 🏭 Forge et 🚨 Drift pour le détail vérifié</div>
  `;
}

 * ======================================================================= */
function matchBadge(status){
  if (!status) return "";
  const s = String(status).toUpperCase();
  if (s === "MATCH") return `<span class="match-ok">✓ MATCH</span>`;
  if (s === "MISMATCH") return `<span class="match-bad">✕ MISMATCH</span>`;
  if (s === "NO_DECLARATION") return `<span class="match-none">∅ NO_DECLARATION</span>`;
  return esc(status);
}

// Forme réelle d'une entrée produite par observer/prompt.py::collect_prompts
// puis servie telle quelle par live.py dans views.v3_prompts :
//   {run_id, etape, attempt, session_id, source:{path,line,fmt,field},
//    chars, chars_normalized, sha256_normalized,
//    declared: null | {final_prompt_sha256, final_prompt_chars, contract_sha256,
//                       premortem_sha256, payload_prompt_sha256, prompt_budget, source},
//    verification: "MATCH"|"MISMATCH"|"NO_DECLARATION",
//    sections: [{nom, debut, longueur, extrait}], texte, note?}
function renderV3(prompts){
  if (!prompts) return emptyState();

  // Forme de repli produite par build_views quand prompt.py n'a pas tourné /
  // n'a rien retourné : {statut: NOT_OBSERVABLE, pourquoi: "..."}. Ne jamais
  // la déguiser en tableau vide.
  if (!Array.isArray(prompts) && isNO(prompts.statut)) {
    return `<div class="card">${noAware(prompts.statut, prompts.pourquoi)}
      <div class="dim" style="margin-top:6px">${esc(prompts.pourquoi||"")}</div></div>`;
  }
  if (!Array.isArray(prompts)) {
    return card(noAware("NOT_OBSERVABLE", "forme de données inattendue reçue pour v3_prompts") + rawJson(prompts, "objet brut reçu"));
  }
  if (!prompts.length) return emptyState("aucune activation de prompt détectée dans les transcripts");

  return prompts.map((p) => {
    const sections = Array.isArray(p.sections) ? p.sections : [];
    const sectionsHtml = sections.length
      ? sections.map(s => `<details class="rawjson" style="display:inline-block;margin:2px 4px 2px 0">
          <summary>${esc(s.nom||"?")} (${fmtNum(s.longueur)} car.)</summary>
          <pre>${esc(s.extrait||"")}</pre>
        </details>`).join("")
      : '<span class="dim">aucune section détectée par motif d\'en-tête</span>';

    const declared = p.declared;
    const declaredHtml = declared
      ? `<div class="kv">
          <span class="k">final_prompt_sha256 (déclaré)</span><span class="mono-small">${esc(declared.final_prompt_sha256||"—")}</span>
          <span class="k">final_prompt_chars (déclaré)</span><span>${fmtNum(declared.final_prompt_chars)}</span>
          <span class="k">contract_sha256</span><span class="mono-small">${esc(declared.contract_sha256||"—")}</span>
          <span class="k">activation</span><span>${declared.activation != null ? esc(declared.activation) : '<span class="dim">—</span>'}</span>
          <span class="k">source de la déclaration</span><span>${srcLink(declared.source,"src")}</span>
        </div>`
      : `<div class="dim">${noAware("NOT_OBSERVABLE", "aucune déclaration de la Forge (context/*.manifest.jsonl) n'a pu être rattachée à cette activation")}</div>`;

    return card(`
      <div class="run-head">
        <span class="rid">${esc(p.run_id||"?")} / ${esc(p.etape||"?")}</span>
        ${p.attempt != null ? `<span class="tag">attempt ${esc(p.attempt)}</span>` : ""}
        <span style="font-size:13px">${matchBadge(p.verification)}</span>
        ${p.session_id ? `<span class="dim mono-small">${esc(p.session_id)}</span>` : ""}
        ${srcLink(p.source, "provenance du prompt reçu")}
      </div>
      ${p.note ? `<div class="dim" style="margin-bottom:6px">note : ${esc(p.note)}</div>` : ""}
      <div class="kv" style="margin-bottom:8px">
        <span class="k">taille</span><span>${fmtNum(p.chars)} car. (${fmtNum(p.chars_normalized)} normalisés)</span>
        <span class="k">sha256 normalisé (mesuré)</span><span class="mono-small">${esc(p.sha256_normalized||"—")}</span>
      </div>
      <div class="dim" style="margin:6px 0 2px">déclaration Forge confrontée :</div>
      ${declaredHtml}
      <div class="dim" style="margin:10px 0 4px">sections détectées :</div>
      <div>${sectionsHtml}</div>
      ${p.texte ? `<details class="rawjson" style="margin-top:8px"><summary>texte intégral reçu par l'agent (${p.texte.length} caractères)</summary><pre>${esc(p.texte)}</pre></details>`
                : `<div class="dim" style="margin-top:8px">texte intégral non fourni par cette activation</div>`}
      ${rawJson(p, "activation brute (rien de tronqué)")}
    `);
  }).join("");
}

/* ======================================================================= *
 * Vue 6 — Graphe d'artefacts (SVG maison, disposition en colonnes)
 * ======================================================================= */
let _v6cache = null;

function renderV6(v6){
  if (!v6 || !Array.isArray(v6.noeuds) || !v6.noeuds.length) return emptyState();
  _v6cache = v6;
  return `
    <div class="filterbar">
      <input type="text" id="v6filter" placeholder="filtrer par nom / chemin…">
      <span class="dim">${v6.noeuds.length} nœuds · ${v6.aretes.length} arêtes</span>
    </div>
    <div class="legend">
      <span><span class="sw" style="background:#1c7fd6"></span>agent</span>
      <span><span class="sw" style="background:#d68a1c"></span>artefact</span>
      <span>— produit</span>
      <span>┄┄ consomme</span>
    </div>
    <div class="graph-wrap" id="v6wrap"></div>
    <div class="dim mono-small" style="margin-top:6px">${esc(v6.note||"")}</div>
  `;
}

function drawV6(filterText){
  const v6 = _v6cache;
  const wrap = document.getElementById("v6wrap");
  if (!wrap) return;
  const filter = (filterText||"").toLowerCase();

  const agents = v6.noeuds.filter(n => n.type === "agent");
  const artefacts = v6.noeuds.filter(n => n.type === "artefact");
  const rowH = 22, padTop = 20, colXAgent = 220, colXArt = 640, width = 900;
  const height = padTop*2 + Math.max(agents.length, artefacts.length) * rowH;

  const posOf = {};
  agents.forEach((n,i) => posOf[n.id] = {x:colXAgent, y:padTop + i*rowH});
  artefacts.forEach((n,i) => posOf[n.id] = {x:colXArt, y:padTop + i*rowH});

  function match(id){ return !filter || id.toLowerCase().includes(filter); }

  let svg = `<svg class="graph" width="${width}" height="${Math.max(height,200)}" xmlns="http://www.w3.org/2000/svg">`;

  v6.aretes.forEach(e => {
    const a = posOf[e.de], b = posOf[e.vers];
    if (!a || !b) return;
    const dim = filter && !(match(e.de) || match(e.vers));
    const dash = e.relation === "consomme" ? ' stroke-dasharray="4,3"' : "";
    const color = e.relation === "consomme" ? "#7c8896" : "#3a6ea5";
    svg += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${color}" stroke-width="1" opacity="${dim?0.08:0.55}"${dash}><title>${esc(e.relation)} (${e.n||1}) — ${esc(e.ts||'')}</title></line>`;
  });

  function nodeCircle(n, x, y){
    const dim = filter && !match(n.id);
    const fillClass = n.type === "agent" ? "node-agent-fill" : "node-artefact-fill";
    const stroke = n.type === "agent" ? "#1c7fd6" : "#d68a1c";
    return `<g opacity="${dim?0.15:1}">
      <circle cx="${x}" cy="${y}" r="4" class="${fillClass}" stroke="${stroke}" stroke-width="1.4"><title>${esc(n.id)}</title></circle>
    </g>`;
  }

  agents.forEach(n => { const p = posOf[n.id]; svg += nodeCircle(n, p.x, p.y); });
  artefacts.forEach(n => { const p = posOf[n.id]; svg += nodeCircle(n, p.x, p.y); });

  agents.forEach(n => {
    const p = posOf[n.id];
    const dim = filter && !match(n.id);
    const label = shortPath(n.id).slice(0,28);
    svg += `<text x="${p.x-8}" y="${p.y+3}" font-size="10" fill="#cdd6e0" text-anchor="end" opacity="${dim?0.15:1}"><title>${esc(n.id)}</title>${esc(label)}</text>`;
  });
  artefacts.forEach(n => {
    const p = posOf[n.id];
    const dim = filter && !match(n.id);
    const label = shortPath(n.id).slice(0,42);
    svg += `<text x="${p.x+8}" y="${p.y+3}" font-size="10" fill="#e0c9a6" opacity="${dim?0.15:1}"><title>${esc(n.id)}</title>${esc(label)}</text>`;
  });

  svg += `</svg>`;
  wrap.innerHTML = svg;
}

/* ======================================================================= *
 * Vue 7 — État Forge
 * ======================================================================= */
function renderV7(runs){
  if (!Array.isArray(runs) || !runs.length) return emptyState();
  return runs.map(run => {
    const rows = (run.etapes||[]).map(e => `
      <tr>
        <td>${esc(e.etape)}</td>
        <td>${stEtatBadge(e.etat)}</td>
        <td>${isNO(e.statut_brut)?noAware(e.statut_brut):esc(e.statut_brut)}</td>
        <td>${e.activations}</td>
        <td>${e.dispatches_prepares}</td>
        <td>${e.incidents}</td>
        <td>${srcLink(e.src,"src")}</td>
      </tr>`).join("");
    return card(`
      <div class="run-head">
        <span class="rid">${esc(run.run_id)}</span>
        ${stEtatBadge(run.etat_run)}
        <span>décision: ${isNO(run.decision)?noAware(run.decision):esc(run.decision)}</span>
      </div>
      ${rows ? `<div class="table-scroll"><table>
        <thead><tr><th>étape</th><th>état</th><th>statut brut</th><th>activations</th><th>dispatches préparés</th><th>incidents</th><th>src</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>` : emptyState("aucune étape observée pour ce run")}
    `);
  }).join("");
}

/* ======================================================================= *
 * Vue 8 — Temps réel
 * ======================================================================= */
function renderV8(){
  const header = `
    <div class="run-head">
      <span class="pulse" id="livePulse"></span>
      <span>version santé: <b id="v8ver">${STATE.health ? STATE.health.version : "—"}</b></span>
      <span class="dim">${STATE.events.length} événement(s) en mémoire (fenêtre glissante) · total serveur: ${STATE.eventsTotal ?? "—"}</span>
    </div>`;
  if (!STATE.events.length) return header + emptyState("aucun événement reçu pour l'instant");
  const rows = STATE.events.map(e => {
    const payloadPreview = e.payload ? Object.entries(e.payload).slice(0,4).map(([k,v])=>`${k}=${typeof v==='object'?JSON.stringify(v).slice(0,40):String(v).slice(0,40)}`).join(" ") : "";
    return `<div class="evrow">
      <span class="ts">${fmtTs(e.ts_iso)}</span>
      <span class="k">${esc(e.kind)}</span>
      <span class="dim">${esc(e.run_id||"—")} / ${esc(e.etape||"—")}</span>
      <span class="dim" style="flex:1;overflow:hidden;text-overflow:ellipsis">${esc(payloadPreview)}</span>
      ${srcLink(e.source, "src")}
    </div>`;
  }).join("");
  return header + `<div class="card" style="padding:0">${rows}</div>`;
}

/* ======================================================================= *
 * Vue 10 — Santé globale
 * ======================================================================= */
function tile(label, value, pourquoi, small){
  const v = isNO(value)
    ? `<span class="no" title="${esc(pourquoi||'')}">⛔ NOT_OBSERVABLE</span>`
    : esc(value === null || value === undefined ? "—" : value);
  return `<div class="stat-tile"><div class="label">${esc(label)}</div><div class="value${small?' no':''}">${v}</div></div>`;
}

function renderV10(v10){
  if (!v10) return emptyState();
  let html = `<div class="grid cols-auto">`;
  html += tile("sessions attribuées", v10.sessions_attribuees);
  html += tile("runs (total)", v10.runs ? v10.runs.total : undefined);
  html += tile("runs (tentatives)", v10.runs ? v10.runs.tentatives : undefined);
  html += tile("coût déclaré (USD)", v10.cout_declare_usd);
  html += tile("coût réel (USD)", v10.cout_reel_usd, v10.cout_reel_pourquoi, true);
  html += tile("durée totale (s)", v10.duree_totale_s);
  html += tile("échecs", v10.echecs);
  html += tile("retries", v10.retries);
  html += tile("human gates (prêt)", v10.human_gates);
  html += tile("human gates ratifiées", v10.human_gates_ratifies, v10.human_gates_pourquoi, true);
  html += tile("drift total", v10.drift ? v10.drift.total : undefined);
  html += tile("drift sévérité haute", v10.drift ? v10.drift.high : undefined);
  html += `</div>`;
  html += card(`<div class="dim" style="margin-bottom:4px">tokens mesurés (transcripts)</div>${chips(v10.tokens_mesures)}`);
  if (v10.faits) html += card(`<div class="dim" style="margin-bottom:4px">faits par statut</div>${chips(v10.faits)}`);
  return html;
}

/* ======================================================================= *
 * Assemblage global — rendu paresseux par onglet
 *
 * Un rafraîchissement serveur (nouvelle version détectée) ne reconstruit
 * QUE l'onglet actuellement visible ; les douze autres sont marqués "dirty"
 * et reconstruits à la demande, au moment où l'opérateur clique dessus
 * (switchTab). Ça évite de détruire/recréer le DOM des onglets non regardés
 * toutes les 3s, et donc de faire bouger sous la souris un élément (lien de
 * provenance, ligne de tableau) qu'un opérateur est en train de viser.
 * ======================================================================= */
function markAllDirty(){
  TABS.forEach(t => STATE.viewsDirty.add(t.id));
}

function renderViewById(id){
  const el = document.getElementById("view-" + id);
  if (!el) return;
  const views = STATE.data ? STATE.data.views : null;
  const waiting = () => emptyState("en attente de /api/state");
  switch (id) {
    case "s0": el.innerHTML = views ? renderS0(views.s0_accueil) : waiting(); break;
    case "rk": el.innerHTML = views ? renderRK() : waiting(); break;
    case "c1": el.innerHTML = views ? renderC1(views.c1_campagnes) : waiting(); break;
    case "c2":
      el.innerHTML = views ? renderC2(views.c2_drift) : waiting();
      if (views && _c2cache) drawC2Table();
      break;
    case "c3": el.innerHTML = views ? renderC3(views.c3_sante) : waiting(); break;
    case "c4": el.innerHTML = views ? renderC4(views.c4_humangate) : waiting(); break;
    case "c5": el.innerHTML = views ? renderC5(views.c5_docloop) : waiting(); break;
    case "c6": el.innerHTML = views ? renderC6(views.c6_aicontrol) : waiting(); break;
    case "c7": el.innerHTML = views ? renderC7(views.c7_forgemap) : waiting(); break;
    case "c8": el.innerHTML = views ? renderC8(views.c8_fleet) : waiting(); break;
    case "s1": el.innerHTML = views ? renderS1(views.s1_workflow) : waiting(); break;
    case "s2": el.innerHTML = views ? renderS2(views.s2_roadmap) : waiting(); break;
    case "s3": el.innerHTML = views ? renderS3(views.s3_agents) : waiting(); break;
    case "s4":
      el.innerHTML = views ? renderS4(views.s4_prompt) : waiting();
      if (views) {
        const s4sel = document.getElementById("s4select");
        if (s4sel) s4sel.addEventListener("change", (e) => { _s4selected = parseInt(e.target.value, 10) || 0; renderViewById("s4"); });
      }
      break;
    case "s5": el.innerHTML = views ? renderS5(views.s5_artefacts) : waiting(); break;
    case "s6":
      el.innerHTML = views ? renderS6(views.s6_injection) : waiting();
      if (views) {
        const s6sel = document.getElementById("s6select");
        if (s6sel) s6sel.addEventListener("change", (e) => { _s6selected = parseInt(e.target.value, 10) || 0; renderViewById("s6"); });
      }
      break;
    case "s7": el.innerHTML = views ? renderS7(views.s7_flow) : waiting(); break;
    case "s8": el.innerHTML = views ? renderS8(views.s8_planning) : waiting(); break;
    case "s9": el.innerHTML = views ? renderS9(views.s9_production) : waiting(); break;
    case "s10": el.innerHTML = views ? renderS10(views.s10_evidence) : waiting(); break;
    case "v1": el.innerHTML = views ? renderV1(views.v1_pipeline) : waiting(); break;
    case "v2": el.innerHTML = views ? renderV2(views.v2_agents) : waiting(); break;
    case "v3": el.innerHTML = views ? renderV3(views.v3_prompts) : waiting(); break;
    case "v4": el.innerHTML = views ? renderV4(views.v4_tools) : waiting(); break;
    case "v5": el.innerHTML = views ? renderV5(views.v5_file_flow) : waiting(); break;
    case "v6":
      el.innerHTML = views ? renderV6(views.v6_artifacts) : waiting();
      if (views && _v6cache) {
        const f = document.getElementById("v6filter");
        drawV6(f ? f.value : "");
        if (f) f.addEventListener("input", (e) => drawV6(e.target.value));
      }
      break;
    case "v7": el.innerHTML = views ? renderV7(views.v7_forge_state) : waiting(); break;
    case "v8": el.innerHTML = renderV8(); break;
    case "v10": el.innerHTML = views ? renderV10(views.v10_health) : waiting(); break;
    default: return;
  }
  STATE.viewsDirty.delete(id);
}

function renderActiveView(){
  withScrollPreserved(() => renderViewById(STATE.activeTab));
}

function updateTabCounts(){
  if (!STATE.data) return;
  const v = STATE.data.views;
  const c4 = v.c4_humangate || {};
  const c5 = v.c5_docloop || {};
  const c7 = v.c7_forgemap || {};
  const c8 = v.c8_fleet || {};
  const counts = {
    s0: "",
    rk: ((v.s8_planning && v.s8_planning.jeux_en_cours && v.s8_planning.jeux_en_cours.cartes || []).length)
      + ((v.s8_planning && v.s8_planning.backlog_derive && v.s8_planning.backlog_derive.chantiers || []).length),
    c1: (v.c1_campagnes && v.c1_campagnes.lignes || []).length,
    c2: (v.c2_drift && v.c2_drift.lignes || []).length,
    c3: (v.c3_sante && v.c3_sante.lignes || []).length,
    c4: (c4.en_attente || []).length,
    c5: (c5.lecons || []).length,
    c6: "",
    c7: (c7.missions || []).length,
    c8: (c8.lignes || []).length,
    s1: (v.s1_workflow && v.s1_workflow.blocs || []).length,
    s2: (v.s2_roadmap && v.s2_roadmap.jeux && v.s2_roadmap.jeux.lignes || []).length,
    s3: (v.s3_agents && v.s3_agents.lignes || []).length,
    s4: (v.s4_prompt && v.s4_prompt.activations || []).length,
    s5: Object.keys((v.s5_artefacts && v.s5_artefacts.categories) || {}).length,
    s6: (v.s6_injection && v.s6_injection.lignes || []).length,
    s7: (v.s7_flow && v.s7_flow.etapes || []).length,
    s8: (v.s8_planning && v.s8_planning.jeux_en_cours && v.s8_planning.jeux_en_cours.cartes || []).length,
    s9: Object.keys((v.s9_production && v.s9_production.graphes) || {}).length,
    s10: (v.s10_evidence && v.s10_evidence.total) || 0,
    v1: (v.v1_pipeline||[]).length,
    v2: (v.v2_agents||[]).length,
    v3: Array.isArray(v.v3_prompts) ? v.v3_prompts.length : (isNO(v.v3_prompts && v.v3_prompts.statut) ? 0 : "?"),
    v4: (v.v4_tools||[]).length,
    v5: (v.v5_file_flow && v.v5_file_flow.par_agent || []).length,
    v6: (v.v6_artifacts && v.v6_artifacts.noeuds || []).length,
    v7: (v.v7_forge_state||[]).length,
    v8: STATE.events.length,
    v10: "",
  };
  document.querySelectorAll("#tabsPilot button, #tabsAudit button").forEach(b => {
    const c = counts[b.dataset.tab];
    const span = b.querySelector(".tabcount");
    const text = (c !== "" && c !== undefined) ? ` ${c}` : "";
    if (span) span.textContent = text;
  });
}

/* ======================================================================= *
 * Réseau — /api/health, /api/state, /api/events
 * ======================================================================= */
function setConn(ok, text){
  STATE.connected = ok;
  document.getElementById("connDot").className = "status-dot " + (ok ? "on" : "off");
  document.getElementById("connText").textContent = text;
}

async function fetchJson(url){
  const resp = await fetch(url, {cache:"no-store"});
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  return resp.json();
}

async function loadState(){
  const data = await fetchJson("/api/state");
  STATE.data = data;
  document.getElementById("hProject").textContent = data.project || "—";
  // Le bandeau n'est pas un onglet : il est toujours visible, donc toujours
  // reconstruit dès qu'une nouvelle version serveur arrive (pas de rendu
  // paresseux pour lui — c'est le signal du matin).
  renderBandeau();
  // Nouvelle donnée serveur : tous les onglets sont potentiellement périmés,
  // mais seul celui affiché à l'écran est reconstruit tout de suite.
  markAllDirty();
  renderActiveView();
  updateTabCounts();
}

async function loadEventsBatch(){
  const data = await fetchJson(`/api/events?since=${STATE.eventsSince}&limit=200`);
  STATE.eventsTotal = data.total;
  if (data.events && data.events.length) {
    // le plus récent en tête
    STATE.events = data.events.slice().reverse().concat(STATE.events).slice(0, 500);
    STATE.eventsSince = data.next_since;
  }
}

// Reflète les champs réels de /api/health (live.py::ObserverService.health) :
// status ok|error, version, derniere_analyse (ISO, côté SERVEUR — pas l'heure
// de ce fetch client), duree_analyse_s, sources_surveillees,
// changements_detectes, derniere_erreur.
function renderHealthBar(health){
  document.getElementById("hVersion").textContent = health.version;
  document.getElementById("hLastFetch").textContent = health.derniere_analyse ? fmtTs(health.derniere_analyse) : "—";
  document.getElementById("hAnalyseDur").textContent = health.duree_analyse_s != null ? health.duree_analyse_s + "s" : "—";
  document.getElementById("hSources").textContent = health.sources_surveillees ?? "—";
  document.getElementById("hChanges").textContent = health.changements_detectes ?? "—";
  const errWrap = document.getElementById("hErrWrap");
  const errEl = document.getElementById("hErr");
  if (health.status === "error") {
    errWrap.style.display = "";
    errEl.textContent = "⛔ dernière analyse en échec";
    errEl.title = health.derniere_erreur || "";
  } else {
    errWrap.style.display = "none";
  }
}

async function pollTick(){
  let health;
  try {
    health = await fetchJson("/api/health");
    setConn(true, "connecté");
  } catch (e) {
    setConn(false, "serveur injoignable — nouvelle tentative dans 3 s");
    return;
  }
  STATE.health = health;
  renderHealthBar(health);

  const versionChanged = STATE.lastVersion !== null && STATE.lastVersion !== health.version;
  const firstLoad = STATE.lastVersion === null;
  STATE.lastVersion = health.version;

  try {
    if (firstLoad || versionChanged) {
      await loadState();
    }
    await loadEventsBatch();
    // Le flux d'événements (vue 8) change à chaque tick indépendamment de la
    // version serveur : on la marque périmée, et on ne la redessine tout de
    // suite que si elle est bien celle regardée en ce moment.
    STATE.viewsDirty.add("v8");
    if (STATE.activeTab === "v8") renderActiveView();
    updateTabCounts();
  } catch (e) {
    setConn(false, "erreur de lecture — " + e.message);
  }
}

/* ======================================================================= *
 * Init
 * ======================================================================= */
buildTabs();
switchTab(STATE.activeTab);
pollTick();
STATE.pollTimer = setInterval(pollTick, 3000);
</script>
