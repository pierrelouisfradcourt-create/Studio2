<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge Observer — Console</title>
<style>
:root{
  --bg:#0a0d10; --bg2:#10151a; --bg3:#161d24; --border:#26313b;
  --fg:#cdd6e0; --dim:#7c8896; --dim2:#57626e; --accent:#5aa7ff;
  --ok:#3fb950; --fail:#f85149; --blocked:#ff8a4a; --retry:#e3b341;
  --running:#58c4ff; --waiting:#9aa7b4; --humangate:#c792ff; --no:#8a6d3b;
  --dormant:#5a6472;
  --sev-high:#f85149; --sev-medium:#e3b341; --sev-info:#7c8896;
  --mono: "Cascadia Mono","Consolas","SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--mono);
  font-size:12.5px; line-height:1.45; overflow-x:hidden;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--accent)}
::-webkit-scrollbar{height:10px;width:10px}
::-webkit-scrollbar-thumb{background:#2a333c;border-radius:4px}
::-webkit-scrollbar-track{background:var(--bg2)}

/* ---- structure générale ---- */
#app{display:flex;flex-direction:column;height:100vh}
#topbar{
  display:flex;align-items:center;gap:14px;padding:6px 12px;
  background:var(--bg2);border-bottom:1px solid var(--border);flex:0 0 auto;
  flex-wrap:wrap;
}
#topbar .title{font-weight:700;letter-spacing:.5px;color:#fff}
#topbar .sep{color:var(--dim2)}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--dim2)}
.status-dot.on{background:var(--ok);box-shadow:0 0 5px var(--ok)}
.status-dot.off{background:var(--fail)}
#conn{color:var(--dim)}
#tabs{
  display:flex;gap:2px;padding:0 8px;background:var(--bg2);
  border-bottom:1px solid var(--border);overflow-x:auto;flex:0 0 auto;
}
#tabs button{
  padding:8px 12px;white-space:nowrap;border-bottom:2px solid transparent;
  color:var(--dim);font-size:12px;
}
#tabs button:hover{color:var(--fg)}
#tabs button.active{color:#fff;border-bottom-color:var(--accent);background:var(--bg3)}
#tabs button .n{color:var(--dim2);margin-left:4px}
#main{flex:1 1 auto;display:flex;min-height:0}
#views{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:14px;min-width:0}
.view{display:none}
.view.active{display:block}

/* ---- panneau source ---- */
#sourcePanel{
  width:0;flex:0 0 auto;background:var(--bg2);border-left:1px solid var(--border);
  overflow:hidden;transition:width .12s ease;display:flex;flex-direction:column;
}
#sourcePanel.open{width:min(560px,45vw)}
#sourcePanel .sp-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 10px;border-bottom:1px solid var(--border);background:var(--bg3);
}
#sourcePanel .sp-head .p{color:var(--dim);font-size:11px;word-break:break-all}
#sourcePanel .sp-body{padding:10px;overflow:auto;flex:1 1 auto}
#sourcePanel .sp-close{color:var(--dim);font-size:16px;padding:2px 8px}
#sourcePanel .sp-close:hover{color:var(--fail)}
.sp-forbidden{color:var(--sev-medium);border:1px dashed var(--sev-medium);padding:10px;border-radius:4px}
.code-line{display:flex;gap:10px;white-space:pre;font-size:12px}
.code-line .ln{color:var(--dim2);min-width:42px;text-align:right;user-select:none}
.code-line.hl{background:#2d3a1f;outline:1px solid var(--ok)}
.code-line.hl .ln{color:var(--ok);font-weight:700}

/* ---- primitives ---- */
h2.vtitle{margin:0 0 10px;color:#fff;font-size:14px;letter-spacing:.3px}
h2.vtitle .sub{color:var(--dim);font-weight:400;font-size:11.5px;margin-left:8px}
.empty{color:var(--dim);font-style:italic;padding:16px;border:1px dashed var(--border);border-radius:4px}
.table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:4px;max-width:100%}
table{border-collapse:collapse;width:100%;min-width:max-content}
th,td{padding:5px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;white-space:nowrap}
td.wrap,th.wrap{white-space:normal}
thead th{background:var(--bg3);color:var(--dim);font-weight:600;position:sticky;top:0;z-index:1}
tbody tr:hover{background:#121821}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:10px;margin-bottom:10px}
.grid{display:grid;gap:10px}
.grid.cols-auto{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.dim{color:var(--dim)}
.mono-small{font-size:11px}
.chip{
  display:inline-block;background:var(--bg3);border:1px solid var(--border);
  border-radius:10px;padding:1px 7px;margin:1px 3px 1px 0;font-size:11px;white-space:nowrap;
}
.chip b{color:#fff;font-weight:600}
.tag{
  display:inline-block;background:#182028;border:1px solid var(--border);border-radius:3px;
  padding:0 5px;margin:1px 3px 1px 0;font-size:11px;
}
.no{
  color:var(--no);font-weight:700;border:1px dashed var(--no);border-radius:3px;
  padding:0 5px;background:repeating-linear-gradient(45deg,#1a1408,#1a1408 4px,#211806 4px,#211806 8px);
  cursor:help;
}
.no .ico{margin-right:3px}
.srclink{color:var(--accent);text-decoration:underline dotted;font-size:11px}
.srclink:hover{color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:3px;font-weight:700;font-size:11px;border:1px solid transparent}
.badge.st-success{color:#04240f;background:var(--ok)}
.badge.st-failed{color:#2a0303;background:var(--fail)}
.badge.st-blocked{color:#2a1100;background:var(--blocked)}
.badge.st-retry{color:#2a2200;background:var(--retry)}
.badge.st-running{color:#001926;background:var(--running)}
.badge.st-waiting{color:#0b0e11;background:var(--waiting)}
.badge.st-humangate{color:#1c0a2e;background:var(--humangate)}
.badge.st-no{color:#fff;background:transparent;border-color:var(--no);color:var(--no)}
.badge.sev-high{color:#2a0303;background:var(--sev-high)}
.badge.sev-medium{color:#2a2200;background:var(--sev-medium)}
.badge.sev-info{color:#0b0e11;background:var(--sev-info)}
.match-ok{color:var(--ok);font-weight:700}
.match-bad{color:var(--fail);font-weight:700}
.match-none{color:var(--dim);font-weight:700}
details.rawjson summary{cursor:pointer;color:var(--dim);font-size:11px}
pre{
  background:#050708;border:1px solid var(--border);border-radius:4px;padding:8px;
  overflow:auto;max-height:420px;white-space:pre-wrap;word-break:break-word;font-size:11.5px;
}
.stage-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.stage-box{
  flex:0 0 auto;min-width:150px;border:1px solid var(--border);border-radius:5px;
  padding:8px;background:var(--bg2);
}
.stage-box.no{background:repeating-linear-gradient(45deg,#141414,#141414 5px,#191919 5px,#191919 10px);border-style:dashed}
.stage-box .lbl{font-weight:700;color:#fff;font-size:11.5px}
.stage-box .n{color:var(--dim);font-size:11px}
.run-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:8px}
.run-head .rid{color:#fff;font-weight:700}
.filterbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.filterbar input[type=text]{
  background:var(--bg3);border:1px solid var(--border);color:var(--fg);
  padding:4px 8px;border-radius:3px;font-family:inherit;font-size:12px;min-width:220px;
}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-bottom:8px}
.legend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
svg.graph{background:#050708;border:1px solid var(--border);border-radius:4px}
.graph-wrap{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:4px}
.node-agent-fill{fill:#0d2436}
.node-artefact-fill{fill:#241a0d}
.evrow{border-bottom:1px solid var(--border);padding:6px 4px;display:flex;gap:10px;font-size:11.5px}
.evrow:hover{background:#121821}
.evrow .k{color:#fff;font-weight:700;min-width:130px}
.evrow .ts{color:var(--dim2);min-width:180px}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.2s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:2px 10px;font-size:11.5px}
.kv .k{color:var(--dim)}
.stat-tile{background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:10px}
.stat-tile .label{color:var(--dim);font-size:11px;margin-bottom:4px}
.stat-tile .value{font-size:18px;color:#fff;font-weight:700}
.stat-tile .value.no{font-size:13px}
.truncnote{color:var(--sev-medium);font-size:11px;margin-top:4px}
tr.row-not-observable td{
  background:repeating-linear-gradient(45deg,#1a1408,#1a1408 4px,#211806 4px,#211806 8px);
  border-top:1px solid var(--no);border-bottom:1px solid var(--no);
}
tr.row-high td{background:#2a0f0f}
.driftno-detail{
  border:1px dashed var(--no);color:var(--no);padding:6px 8px;border-radius:4px;
  font-weight:600;white-space:normal;
}
.bullets{margin:0;padding-left:16px}
.bullets li{margin:1px 0}

/* ---- bandeau opérateur (fixe, pas un onglet) ---- */
#bandeau{
  display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--bg2);
  border-bottom:1px solid var(--border);flex:0 0 auto;
}
.bandeau-cell{
  flex:1 1 170px;min-width:150px;max-width:260px;text-align:left;
  background:var(--bg3);border:1px solid var(--border);border-radius:4px;
  padding:6px 10px;display:flex;flex-direction:column;gap:3px;overflow:hidden;
}
.bandeau-cell.bandeau-clickable{cursor:pointer}
.bandeau-cell.bandeau-clickable:hover{border-color:var(--accent);background:#132030}
.bandeau-label{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.bandeau-value{color:#fff;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.bandeau-sub{color:var(--dim);font-size:10.5px}

/* ---- filtres simples (boutons toggle) ---- */
.filterbtn{
  background:var(--bg3);border:1px solid var(--border);border-radius:10px;
  padding:2px 9px;color:var(--dim);font-size:11px;
}
.filterbtn:hover{color:var(--fg)}
.filterbtn.active{color:#fff;border-color:var(--accent);background:#132030}

/* ---- forge map : chaîne de boîtes ---- */
.fmap-row{display:flex;gap:4px;align-items:stretch;overflow-x:auto;padding-bottom:6px}
.fmap-arrow{align-self:center;color:var(--dim2);flex:0 0 auto;padding:0 2px}
.fmap-box{min-width:190px;max-width:230px}

/* ---- s1-arrow : réutilisé tel quel par la chaîne verticale S6 Injection
   (flèches ↓ entre maillons) -- nom hérité de l'ancien rendu S1 en boutons. ---- */
.s1-arrow{text-align:center;color:var(--dim2);font-size:15px;line-height:1.6}

/* ---- s3 Agents : liste maître + fiche détail ---- */
.s3-list{
  display:flex;flex-direction:column;gap:2px;min-width:230px;max-width:290px;flex:0 0 auto;
  max-height:74vh;overflow-y:auto;border:1px solid var(--border);border-radius:4px;padding:4px;
}
.s3-item{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:3px;border:1px solid transparent;background:none;color:inherit}
.s3-item:hover{background:#121821}
.s3-item.selected{background:#132030;border-color:var(--accent)}

/* ---- s5 Artefacts : catégorie → artefacts → détail ---- */
.s5-col{
  display:flex;flex-direction:column;gap:2px;min-width:220px;max-width:280px;flex:0 0 auto;
  max-height:64vh;overflow-y:auto;border:1px solid var(--border);border-radius:4px;padding:4px;
}
.s5-cat,.s5-art{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:3px;border:1px solid transparent;background:none;color:inherit;font-family:inherit}
.s5-cat:hover,.s5-art:hover{background:#121821}
.s5-cat.selected,.s5-art.selected{background:#132030;border-color:var(--accent)}

/* ---- s6 Injection : chaîne de maillons ---- */
.s6-chain{display:flex;flex-direction:column;max-width:640px}
.s6-maillon{border:1px solid var(--border);border-radius:5px;padding:8px 10px;background:var(--bg2);margin-bottom:2px}

/* ---- s7 Flow : colonnes d'étapes ---- */
.s7-col{flex:0 0 auto;min-width:210px;max-width:250px;border:1px solid var(--border);border-radius:5px;padding:8px;background:var(--bg2)}
.s7-col .lbl{font-weight:700;color:#fff;font-size:11.5px}

/* ---- barre de progression (s2 Roadmap) ---- */
.progbar{background:var(--bg3);border:1px solid var(--border);border-radius:3px;height:9px;overflow:hidden;min-width:100px}
.progbar > i{display:block;height:100%;background:var(--ok)}

/* ---- barre d'onglets à deux étages : PILOTAGE (par défaut) / AUDIT (repliable) ---- */
#tabsPilot{display:flex;gap:6px;padding:8px 8px 6px;background:var(--bg2);flex-wrap:wrap}
.tab-pilot{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  padding:7px 12px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg3);color:var(--dim);min-width:128px;text-align:left;
}
.tab-pilot:hover{border-color:var(--accent);color:var(--fg)}
.tab-pilot.active{background:#132030;border-color:var(--accent);color:#fff}
.tab-pilot .tab-label{font-weight:700;font-size:12.5px;color:inherit}
.tab-pilot .tab-q{font-size:10px;color:var(--dim);font-weight:400;white-space:normal}
.tab-pilot.active .tab-q{color:#9db8d8}
.tab-pilot .tabcount{color:var(--dim2);margin-left:4px;font-weight:400}
#tabsAuditWrap{background:var(--bg2);border-bottom:1px solid var(--border);padding:4px 8px 8px}
#auditToggle{
  color:var(--dim);font-size:11px;padding:4px 10px;border:1px solid var(--border);
  border-radius:10px;background:var(--bg3);
}
#auditToggle:hover{color:var(--fg)}
#auditToggle.open{color:#fff;border-color:var(--accent)}
#tabsAudit{display:none;gap:2px;flex-wrap:wrap;padding-top:8px}
#tabsAudit.open{display:flex}
.tab-audit{padding:6px 10px;border-radius:4px;color:var(--dim);font-size:11.5px;border-bottom:2px solid transparent}
.tab-audit:hover{color:var(--fg)}
.tab-audit.active{color:#fff;background:var(--bg3);border-bottom-color:var(--accent)}
.tab-audit .tabcount{color:var(--dim2);margin-left:3px}

/* ---- en-tête vulgarisé commun aux vues PILOTAGE : question + résumé serveur ---- */
.vresume{
  color:var(--fg);background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:3px;padding:6px 10px;margin:2px 0 12px;font-size:12px;
}

/* ---- s1 Workflow : graphe SVG (remplace la chaîne de boutons) ---- */
.s1-node{cursor:pointer}
.s1-node rect{transition:stroke-width .1s}
.s1-node:hover rect{stroke:var(--accent)}

/* ---- s5 Artefacts : détail à quatre rôles ---- */
.s5-role{margin:6px 0;font-size:12px}
.s5-role b{color:#fff;margin-right:4px;font-weight:700}

/* ---- s3 Agents : champs de contrat repliés au-delà d'un aperçu court ---- */
.s3-fieldmore summary{cursor:pointer;color:var(--accent);font-size:11px;display:inline}

/* ---- s8 Planning : cartes jeux / backlog ---- */
.s8-card-attente{border-color:var(--sev-medium)}

/* ---- s0 Accueil : zones-cartes, grande typo, zéro tableau ---- */
.s0-num{font-size:22px;color:#fff;font-weight:700}

/* ---- pédagogie : encart « ℹ️ Comprendre cette pièce » (réutilisé par
   🏭 Forge / 👥 Équipe / 📦 Artefacts / 🧠 Prompt Builder) ---- */
.pedbox{border-color:var(--accent)}
.pedbox .pedhead{text-transform:uppercase;letter-spacing:.4px}

/* ---- 👥 Équipe : avatar rond initiales, coloré par capability ---- */
.team-avatar{
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:34px;height:34px;border-radius:50%;color:#04101c;font-weight:700;font-size:12px;
}
.team-avatar.sm{width:22px;height:22px;font-size:9.5px}

/* ---- 🗺️ Roadmap : kanban 4 domaines × 4 états ---- */
.rk-board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.rk-col{flex:0 0 auto;min-width:250px;max-width:290px;border:1px solid var(--border);border-radius:5px;background:var(--bg2);padding:8px}
.rk-col-title{font-weight:700;color:#fff;font-size:13px;margin-bottom:8px}
.rk-lane{margin-bottom:10px}
.rk-lane-title{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;border-bottom:1px solid var(--border);padding-bottom:3px}
.rk-lane .card{margin-bottom:6px}
.rk-doctrine{opacity:.62;border-style:dashed}

/* ---- 🚨 Drift : lampe de salle de contrôle ---- */
.lamp-dot{display:inline-block;width:16px;height:16px;border-radius:50%;flex:0 0 auto}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <span class="title">FORGE OBSERVER — CONSOLE</span>
    <span class="sep">|</span>
    <span id="conn"><span class="status-dot off" id="connDot"></span><span id="connText">connexion...</span></span>
    <span class="sep">|</span>
    <span class="dim">projet: <span id="hProject">—</span></span>
    <span class="sep">|</span>
    <span class="dim">version: <span id="hVersion">—</span></span>
    <span class="sep">|</span>
    <span class="dim">dernière analyse (serveur): <span id="hLastFetch">—</span></span>
    <span class="sep">|</span>
    <span class="dim">durée analyse: <span id="hAnalyseDur">—</span></span>
    <span class="sep">|</span>
    <span class="dim">sources surveillées: <span id="hSources">—</span></span>
    <span class="sep">|</span>
    <span class="dim">changements détectés: <span id="hChanges">—</span></span>
    <span id="hErrWrap" style="display:none">
      <span class="sep">|</span>
      <span class="no" id="hErr" title=""></span>
    </span>
  </div>

  <div id="bandeau"></div>

  <div id="tabs">
    <div id="tabsPilot"></div>
    <div id="tabsAuditWrap">
      <button id="auditToggle">📊 Audit ▸</button>
      <div id="tabsAudit"></div>
    </div>
  </div>

  <div id="main">
    <div id="views">
      <section class="view" data-view="s0" id="view-s0"></section>
      <section class="view" data-view="rk" id="view-rk"></section>
      <section class="view" data-view="c1" id="view-c1"></section>
      <section class="view" data-view="c2" id="view-c2"></section>
      <section class="view" data-view="c3" id="view-c3"></section>
      <section class="view" data-view="c4" id="view-c4"></section>
      <section class="view" data-view="c5" id="view-c5"></section>
      <section class="view" data-view="c6" id="view-c6"></section>
      <section class="view" data-view="c7" id="view-c7"></section>
      <section class="view" data-view="c8" id="view-c8"></section>
      <section class="view" data-view="s1" id="view-s1"></section>
      <section class="view" data-view="s2" id="view-s2"></section>
      <section class="view" data-view="s3" id="view-s3"></section>
      <section class="view" data-view="s4" id="view-s4"></section>
      <section class="view" data-view="s5" id="view-s5"></section>
      <section class="view" data-view="s6" id="view-s6"></section>
      <section class="view" data-view="s7" id="view-s7"></section>
      <section class="view" data-view="s8" id="view-s8"></section>
      <section class="view" data-view="s9" id="view-s9"></section>
      <section class="view" data-view="s10" id="view-s10"></section>
      <section class="view" data-view="v1" id="view-v1"></section>
      <section class="view" data-view="v2" id="view-v2"></section>
      <section class="view" data-view="v3" id="view-v3"></section>
      <section class="view" data-view="v4" id="view-v4"></section>
      <section class="view" data-view="v5" id="view-v5"></section>
      <section class="view" data-view="v6" id="view-v6"></section>
      <section class="view" data-view="v7" id="view-v7"></section>
      <section class="view" data-view="v8" id="view-v8"></section>
      <section class="view" data-view="v10" id="view-v10"></section>
    </div>

    <aside id="sourcePanel">
      <div class="sp-head">
        <span class="p" id="spPath">—</span>
        <button class="sp-close" id="spClose" title="fermer">✕</button>
      </div>
      <div class="sp-body" id="spBody"></div>
    </aside>
  </div>
</div>

<script>
"use strict";

/* ======================================================================= *
 * Constantes & état
 * ======================================================================= */
const NOT_OBSERVABLE = "NOT_OBSERVABLE";
// Deux mondes (arbitrage Pierre 2026-08-02) : PILOTAGE = poste de pilotage

/* ======================================================================= *
 * Utilitaires généraux
 * ======================================================================= */
function esc(s){
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function isNO(v){ return v === NOT_OBSERVABLE; }

function shortPath(p){
  if (!p) return "";
  const norm = String(p).replace(/\\/g, "/");
  const parts = norm.split("/");
  return parts.length <= 2 ? norm : ".../" + parts.slice(-2).join("/");
}

function fmtNum(n){
  if (n === null || n === undefined) return "—";
  if (typeof n !== "number") return esc(n);
  return n.toLocaleString("fr-FR", {maximumFractionDigits:3});
}

function fmtTs(iso){
  if (!iso) return "—";
  return String(iso).replace("T"," ").replace(/\.\d+\+00:00$/,"Z").replace("+00:00","Z");
}

// Rend une valeur "brute" en tenant compte de NOT_OBSERVABLE — jamais 0/—/null.
function noAware(value, pourquoi){
  if (isNO(value)) {
    return `<span class="no" title="${esc(pourquoi || "aucune preuve localisée pour ce champ")}"><span class="ico">⛔</span>NOT_OBSERVABLE</span>`;
  }
  return null; // laisse l'appelant gérer le rendu normal
}

function emptyState(msg){
  return `<div class="empty">${esc(msg || "aucune donnée pour cette vue")}</div>`;
}

function chips(dict, max){
  if (!dict) return '<span class="dim">—</span>';
  if (isNO(dict)) return noAware(dict);
  const entries = Object.entries(dict);
  if (!entries.length) return '<span class="dim">—</span>';
  const shown = max ? entries.slice(0, max) : entries;
  let out = shown.map(([k,v]) => `<span class="chip">${esc(k)} <b>${esc(v)}</b></span>`).join("");
  if (max && entries.length > max) out += `<span class="dim mono-small"> +${entries.length-max}</span>`;
  return out;
}

function tags(list, max){
  if (isNO(list)) return noAware(list);
  if (!Array.isArray(list) || !list.length) return '<span class="dim">—</span>';
  const shown = max ? list.slice(0, max) : list;
  let out = shown.map(v => `<span class="tag">${esc(v)}</span>`).join("");
  if (max && list.length > max) out += `<span class="dim mono-small"> +${list.length-max} (non tronqué : voir JSON)</span>`;
  return out;
}

// Bouton cliquable vers une citation `src` ({path,line?,field?,scope?,event_id?}).
function srcLink(src, label){
  if (!src || !src.path) return '<span class="dim">—</span>';
  const l = label || (shortPath(src.path) + (src.line ? ":" + src.line : ""));
  const attrs = [
    `data-path="${esc(src.path)}"`,
    src.line != null ? `data-line="${esc(src.line)}"` : "",
    src.field ? `data-field="${esc(src.field)}"` : "",
    src.scope ? `data-scope="${esc(src.scope)}"` : "",
  ].join(" ");
  return `<button class="srclink" ${attrs} title="${esc(src.path)}${src.line?(':'+src.line):''}${src.field?(' — champ '+src.field):''}">${esc(l)}</button>`;
}

function srcList(list, max){
  if (!Array.isArray(list) || !list.length) return '<span class="dim">—</span>';
  const shown = max ? list.slice(0, max) : list;
  return shown.map(s => srcLink(s)).join(" · ");
}

/* ======================================================================= *
 * Pédagogie — « ℹ️ Comprendre cette pièce » (arbitrage Pierre 2026-08-02)
 *
 * Une seule source : STATE.data.views.pedagogy.pieces[id] ({bloc:*, agent:*,
 * artefact:*} — id EXACT produit par observer/pedagogy.py::build_pedagogy,
 * vérifié sur données réelles, PAS "role:*" comme un premier libellé aurait
 * pu le laisser penser). Chaque rubrique est une cellule {v, src?,
 * base_textuelle?, why?} — même contrat NOT_OBSERVABLE que le reste de la
 * console. Réutilisé par 🏭 Forge (bloc), 👥 Équipe (agent), 📦 Artefacts
 * (artefact) et 🧠 Prompt Builder (bloc:Observer / bloc:retour KB).
 * ======================================================================= */
function pedagogyCell(cell){
  if (!cell) return '<span class="dim">—</span>';
  if (isNO(cell.v)) return noAware(cell.v, cell.why);
  const src = cell.src ? " " + srcLink(cell.src) : "";
  const bulle = cell.base_textuelle ? ` <span class="dim mono-small" title="${esc(cell.base_textuelle)}">📖 base textuelle</span>` : "";
  return `<div>${esc(cell.v)}</div><div style="margin-top:3px">${src}${bulle}</div>`;
}

function pedagogyBox(pieceId, opts){
  opts = opts || {};
  const ped = STATE.data && STATE.data.views && STATE.data.views.pedagogy;
  const piece = ped && ped.pieces && ped.pieces[pieceId];
  const borderColor = opts.borderColor || "var(--accent)";
  if (!piece) {
    return `<div class="card pedbox" style="border-color:${borderColor}">
      <div class="dim mono-small pedhead">ℹ️ Comprendre cette pièce</div>
      <div style="margin-top:6px">${noAware(NOT_OBSERVABLE, "aucune carte pédagogique produite pour « " + pieceId + " » dans ce périmètre")}</div>
    </div>`;
  }
  const badge = opts.badge ? ` <span class="badge sev-high">${esc(opts.badge)}</span>` : "";
  return `<div class="card pedbox" style="border-color:${borderColor}">
    <div class="dim mono-small pedhead">ℹ️ Comprendre cette pièce — ${esc(piece.nom_humain)}${badge}</div>
    <div class="kv" style="margin-top:8px;grid-template-columns:130px 1fr">
      <span class="k">pourquoi</span><span>${pedagogyCell(piece.pourquoi)}</span>
      <span class="k">à quoi ça sert</span><span>${pedagogyCell(piece.a_quoi_sert)}</span>
      <span class="k">si ça casse</span><span>${pedagogyCell(piece.si_casse)}</span>
    </div>
    ${(piece.depend_de && piece.depend_de.length) ? `<div class="dim mono-small" style="margin-top:8px">dépend de : ${tags(piece.depend_de)}</div>` : ""}
    ${(piece.dependants && piece.dependants.length) ? `<div class="dim mono-small" style="margin-top:4px">pièces qui en dépendent : ${tags(piece.dependants)}</div>` : ""}
  </div>`;
}

/* ---- 👥 Équipe : avatar rond initiales, coloré par capability ---- */
const TEAM_PALETTE = ["#5aa7ff","#3fb950","#e3b341","#ff8a4a","#c792ff","#58c4ff","#f85149","#9aa7b4","#4fd6c6","#b79cff","#7aa0ff","#ffca6b","#9fb3cf","#ff8098"];
function hashStr(s){
  let h = 0;
  const str = String(s || "?");
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function initialsOf(name){
  const parts = String(name || "?").trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return "?";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}
function teamAvatar(nomHumain, capability, small){
  const initials = initialsOf(nomHumain);
  const color = TEAM_PALETTE[hashStr(capability || nomHumain) % TEAM_PALETTE.length];
  return `<span class="team-avatar${small ? " sm" : ""}" style="background:${color}" title="${esc(capability || "")}">${esc(initials)}</span>`;
}

// « Ce qu'il produit / qui le consomme » pour une fiche agent — dérivé du
// graphe pédagogique (piece.dependants), jamais rédigé. Les arêtes
// producteur (_PRODUCER_EDGES côté serveur) pointent toujours vers un
// piece_id "artefact:*" ; les arêtes de rôle de bloc pointent vers "bloc:*".
// Sans cette distinction dans les données servies, NOT_OBSERVABLE honnête.
function s3ProduitConsomme(role){
  const ped = STATE.data && STATE.data.views && STATE.data.views.pedagogy;
  const piece = ped && ped.pieces && ped.pieces["agent:" + role];
  if (!piece) {
    const no = noAware(NOT_OBSERVABLE, "aucune carte pédagogique pour ce rôle");
    return {produitHtml: no, consommeHtml: no};
  }
  const deps = piece.dependants || [];
  const produits = deps.filter(d => d.indexOf("artefact:") === 0);
  const blocs = deps.filter(d => d.indexOf("bloc:") === 0);
  return {
    produitHtml: produits.length ? tags(produits) : noAware(NOT_OBSERVABLE, "aucune arête productrice dérivée du graphe pour ce rôle (pedagogy.py::_PRODUCER_EDGES)"),
    consommeHtml: blocs.length ? tags(blocs) : noAware(NOT_OBSERVABLE, "ce rôle n'apparaît dans aucun des 9 blocs du pipeline standard"),
  };
}

// 📦 Artefacts : fraîcheur reformulée (jamais une date brute seule).
function freshnessLabel(mtimeIso){
  if (!mtimeIso) return noAware(NOT_OBSERVABLE, "aucune date de modification observée pour ce fichier");
  const t = new Date(mtimeIso).getTime();
  if (isNaN(t)) return esc(mtimeIso);
  const days = Math.floor((Date.now() - t) / 86400000);
  let label;
  if (days <= 0) label = "à jour · modifié aujourd'hui";
  else if (days === 1) label = "modifié il y a 1 jour";
  else label = "modifié il y a " + days + " jours";
  return `${esc(label)} <span class="dim mono-small">(${fmtTs(mtimeIso)})</span>`;
}

// `resume` serveur en ligne juste en dessous quand la vue en fournit un.
// Les vues sans `question` ratifiée (ex. Human Gate) n'affichent pas de sous-titre.
function pilotHeader(tabId, data){
  const tabDef = TABS.find(t => t.id === tabId) || {};
  const label = tabDef.label || tabId;
  const q = (data && data.question) || tabDef.question || "";
  const resume = data && data.resume;
  let html = `<h2 class="vtitle">${esc(label)}${q ? `<span class="sub">${esc(q)}</span>` : ""}</h2>`;
  if (resume) html += `<div class="vresume">${esc(resume)}</div>`;
  return html;
}

/* ======================================================================= *
 * Panneau latéral — provenance cliquable
 * ======================================================================= */
async function openSource(path, line, field, scope){
  const panel = document.getElementById("sourcePanel");
  const pathEl = document.getElementById("spPath");
  const body = document.getElementById("spBody");
  panel.classList.add("open");
  pathEl.textContent = path + (line ? (":" + line) : "") + (field ? ("  [champ: " + field + "]") : "");
  body.innerHTML = `<div class="dim">chargement…</div>`;

  const qs = new URLSearchParams({path});
  if (line) qs.set("line", line);
  qs.set("context", "8");

  let resp;
  try {
    resp = await fetch("/api/source?" + qs.toString());
  } catch (e) {
    body.innerHTML = `<div class="sp-forbidden">Serveur Observer injoignable pour cette source.</div>`;
    return;
  }

  if (resp.status === 403) {
    body.innerHTML = `<div class="sp-forbidden">⛔ source hors du périmètre de lecture d'Observer.<br>
      C'est un comportement attendu de la garde de cécité, pas un bug.</div>`;
    return;
  }
  if (resp.status === 404) {
    body.innerHTML = `<div class="sp-forbidden">Fichier introuvable sur disque à ce chemin (peut-être archivé/déplacé depuis l'observation).</div>`;
    return;
  }
  if (!resp.ok) {
    body.innerHTML = `<div class="sp-forbidden">Erreur ${resp.status} en ouvrant la source.</div>`;
    return;
  }
  const j = await resp.json();
  if (j.error) {
    body.innerHTML = `<div class="sp-forbidden">${esc(j.detail || j.error)}</div>`;
    return;
  }
  // Contrat réel de live.py::_serve_source — `lines` est une liste d'objets
  // {n, text} (numéro de ligne réel dans le fichier, pas un offset recalculé).
  let html = "";
  if (field) html += `<div class="dim mono-small" style="margin-bottom:6px">champ ciblé : <b>${esc(field)}</b></div>`;
  if (scope) html += `<div class="dim mono-small" style="margin-bottom:6px">portée : ${esc(scope)}</div>`;
  (j.lines || []).forEach((row) => {
    const ln = row.n;
    const hl = j.line != null && Number(ln) === Number(j.line);
    html += `<div class="code-line${hl?" hl":""}"><span class="ln">${ln}</span><span>${esc(row.text)}</span></div>`;
  });
  if (j.truncated) html += `<div class="truncnote">contenu tronqué (fenêtre bornée par le serveur ; fichier de ${fmtNum(j.total_lines)} lignes au total) — précisez une ligne pour cibler un extrait plus étroit</div>`;
  body.innerHTML = html || emptyState("fichier vide");
}

document.getElementById("spClose").addEventListener("click", () => {
  document.getElementById("sourcePanel").classList.remove("open");
});

document.getElementById("views").addEventListener("click", (ev) => {
  const srcBtn = ev.target.closest(".srclink");
  if (srcBtn) {
    openSource(srcBtn.dataset.path, srcBtn.dataset.line, srcBtn.dataset.field, srcBtn.dataset.scope);
    return;
  }
  // C2 Drift : filtres simples par famille / gravité (boutons toggle).
  const famBtn = ev.target.closest(".c2filter-fam");
  if (famBtn) {
    _c2filter.famille = famBtn.dataset.fam || null;
    renderViewById("c2");
    return;
  }
  const gravBtn = ev.target.closest(".c2filter-grav");
  if (gravBtn) {
    _c2filter.gravite = gravBtn.dataset.grav || null;
    renderViewById("c2");
    return;
  }
  // C2 Drift : statut de traitement cyclique (nouveau → vu → arbitré).
  const traitBtn = ev.target.closest(".c2traitement");
  if (traitBtn) {
    // Re-rendu complet (pas juste le badge du bouton) : la lampe de salle de
    // contrôle en tête de vue doit refléter le nouveau compte immédiatement.
    c2CycleTraitement(traitBtn.dataset.driftId);
    renderViewById("c2");
    return;
  }
  // C7 Forge Map : le nœud décisions renvoie vers HUMAN GATE. S3 Agents :
  // le lien "réellement injecté" renvoie vers Injection sur l'activation
  // correspondante (data-goto-s6 = index dans s6_injection.lignes).
  const gotoBtn = ev.target.closest("[data-goto-tab]");
  if (gotoBtn) {
    if (gotoBtn.dataset.gotoS6 !== undefined) _s6selected = parseInt(gotoBtn.dataset.gotoS6, 10) || 0;
    switchTab(gotoBtn.dataset.gotoTab);
    return;
  }
  // S1 Workflow : sélection d'un bloc de la chaîne -> panneau de détail.
  const s1Block = ev.target.closest(".s1-block");
  if (s1Block) {
    _s1selected = parseInt(s1Block.dataset.idx, 10);
    renderViewById("s1");
    return;
  }
  // S3 Agents : sélection d'un agent dans la liste maître -> fiche détail.
  const s3Item = ev.target.closest(".s3-item");
  if (s3Item) {
    _s3selected = parseInt(s3Item.dataset.idx, 10);
    renderViewById("s3");
    return;
  }
  // S5 Artefacts : navigation catégorie -> artefacts -> détail.
  const s5Cat = ev.target.closest(".s5-cat");
  if (s5Cat) {
    _s5cat = s5Cat.dataset.cat;
    _s5art = null;
    renderViewById("s5");
    return;
  }
  const s5Art = ev.target.closest(".s5-art");
  if (s5Art) {
    _s5art = parseInt(s5Art.dataset.art, 10);
    renderViewById("s5");
    return;
  }
});

  return `<button data-tab="${t.id}" class="tab-audit ${t.id===STATE.activeTab?'active':''}">${esc(t.label)}<span class="tabcount"></span></button>`;
}

function buildTabs(){
  const pilotEl = document.getElementById("tabsPilot");
  const auditEl = document.getElementById("tabsAudit");
  pilotEl.innerHTML = TABS.filter(t => t.group === "pilotage").map(tabPilotHtml).join("");
  auditEl.innerHTML = TABS.filter(t => t.group === "audit").map(tabAuditHtml).join("");
  document.querySelectorAll("#tabsPilot button, #tabsAudit button").forEach(b => {
    b.addEventListener("click", () => switchTab(b.dataset.tab));
  });
  document.getElementById("auditToggle").addEventListener("click", () => setAuditOpen(!STATE.auditOpen));
  setAuditOpen(STATE.auditOpen);
}

function setAuditOpen(open){
  STATE.auditOpen = open;
  const toggle = document.getElementById("auditToggle");
  const row = document.getElementById("tabsAudit");
  toggle.classList.toggle("open", open);
  toggle.textContent = open ? "📊 Audit ▾" : "📊 Audit ▸";
  row.classList.toggle("open", open);
}

// #views est l'unique conteneur défilant (les .view individuelles sont de simples
// blocs affichés/masqués) : la position de défilement à retenir est donc la
// sienne, par onglet.
const SCROLL_POS = {};

function switchTab(id){
  const viewsEl = document.getElementById("views");
  SCROLL_POS[STATE.activeTab] = viewsEl.scrollTop;
  STATE.activeTab = id;
  const tabDef = TABS.find(t => t.id === id);
  if (tabDef && tabDef.group === "audit" && !STATE.auditOpen) setAuditOpen(true);
  document.querySelectorAll("#tabsPilot button, #tabsAudit button").forEach(b => b.classList.toggle("active", b.dataset.tab === id));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.dataset.view === id));
  // Rendu paresseux : un onglet n'est reconstruit que quand il redevient visible
  // et qu'il a été marqué "dirty" par une nouvelle donnée serveur — jamais au
  // simple fait de cliquer dessus s'il est déjà à jour.
  if (STATE.viewsDirty.has(id)) renderViewById(id);
  viewsEl.scrollTop = SCROLL_POS[id] || 0;
}

/* Préserve la position de défilement de l'onglet actif pendant un re-render
 * déclenché par un rafraîchissement automatique (nouvelle version détectée). */
function withScrollPreserved(fn){
  const viewsEl = document.getElementById("views");
  const before = viewsEl.scrollTop;
  fn();
  viewsEl.scrollTop = before;
}

/* ======================================================================= *
 * Bandeau opérateur (C0) — pas un onglet : une bande fixe, toujours visible.
 * Sept cellules produites par observer/cockpit.py::view_bandeau, chacune
 * {v, src?, why?, note?}. C'est LE signal du matin : chaque cellule bascule
 * vers l'onglet de détail correspondant ; drift_high/incidents comparent
 * leurs ids à un localStorage "vu" côté client (Observer ne persiste rien).
 * ======================================================================= */
const BANDEAU_LABELS = {
  decisions_en_attente: "décisions en attente",
  run_en_cours: "run en cours",
  dernier_verdict: "dernier verdict",
  drift_high: "drift (gravité haute)",
  incidents: "incidents",
  cout_recent: "coût récent",
  prochaine_action: "prochaine action",
};
// decisions→HUMAN GATE, drift→Drift, incidents→État Forge, cout→Campagnes
// (mapping explicitement demandé) ; run_en_cours/dernier_verdict pointent
// vers les vues les plus pertinentes. prochaine_action → 🗺️ Roadmap (rk,
// fusion Roadmap+Planning) : la cellule serveur reste NOT_OBSERVABLE par
// construction tant que `views.py` ne branche pas le registre planning dans
// `build_cockpit` (hors périmètre de ce chantier — voir cockpit.py::
// build_cockpit docstring), mais un repli CLIENT (prochaineActionFallback,
// cf. bandeauCellHtml) calcule la même chose depuis
// state.views.s8_planning.registre.taches — cette cible s'applique aux deux.
const BANDEAU_TARGETS = {
  decisions_en_attente: "c4",
  run_en_cours: "v1",
  dernier_verdict: "c1",
  drift_high: "c2",
  incidents: "v7",
  cout_recent: "c1",
  prochaine_action: "rk",
};

function bandeauSeenKey(kind){ return "observer_bandeau_seen_" + kind; }
function bandeauLoadSeen(kind){
  try { return new Set(JSON.parse(localStorage.getItem(bandeauSeenKey(kind)) || "[]")); }
  catch (e) { return new Set(); }
}
function bandeauMarkSeen(kind, ids){
  const seen = bandeauLoadSeen(kind);
  (ids||[]).forEach(id => seen.add(id));
  try { localStorage.setItem(bandeauSeenKey(kind), JSON.stringify(Array.from(seen))); } catch (e) {}
}
function bandeauCountNouveaux(kind, ids){
  const seen = bandeauLoadSeen(kind);
  return (ids||[]).filter(id => !seen.has(id)).length;
}

// Repli CLIENT pour `prochaine_action` (mission Cockpit pédagogique,
// 2026-08-02). La cellule SERVEUR (c0_bandeau.prochaine_action, produite par
// observer/cockpit.py::_bandeau_prochaine_action) reste NOT_OBSERVABLE en
// pratique : `views.py::build_views` appelle `build_cockpit(result, events)`
// à DEUX arguments (le 3e, `planning_view`, existe côté serveur mais
// `views.py` est hors périmètre pour ce chantier — non branché). Le registre
// `studio_brain/planning/planning.yaml` EXISTE pourtant déjà et est servi
// tel quel côté client via `state.views.s8_planning.registre.taches` : on
// calcule donc ici, côté client, la même règle que le serveur (1re tâche
// EN_ATTENTE dont AUCUNE dépendance `depends_on` n'est bloquante — une
// dépendance non TERMINÉE, ou absente du registre, bloque). Repli honnête :
// si le registre n'a rien à offrir, retourne null et le bandeau garde
// NOT_OBSERVABLE avec sa raison serveur.
function prochaineActionFallback(){
  const s8 = STATE.data && STATE.data.views && STATE.data.views.s8_planning;
  const registre = s8 && s8.registre;
  const taches = (registre && Array.isArray(registre.taches)) ? registre.taches : [];
  if (!taches.length) return null;
  const parId = {};
  taches.forEach(t => { if (t && t.id) parId[t.id] = t; });
  const bloquee = (t) => (t.depends_on || []).some(dep => {
    const d = parId[dep];
    return !d || d.etat !== "TERMINE";
  });
  const candidats = taches.filter(t => t.etat === "EN_ATTENTE" && !bloquee(t));
  if (!candidats.length) return null;
  candidats.sort((a, b) => {
    const pa = typeof a.priorite === "number" ? a.priorite : Infinity;
    const pb = typeof b.priorite === "number" ? b.priorite : Infinity;
    if (pa !== pb) return pa - pb;
    return String(a.id).localeCompare(String(b.id));
  });
  const t = candidats[0];
  return {id: t.id, objectif: t.objectif, raison: t.raison};
}

function bandeauCellHtml(key, cell){
  const label = BANDEAU_LABELS[key] || key;
  const target = BANDEAU_TARGETS[key];
  let valueHtml, titleAttr = "";

  switch (key) {
    case "decisions_en_attente": {
      if (isNO(cell.v)) { valueHtml = noAware(cell.v, cell.why); break; }
      const n = Array.isArray(cell.v) ? cell.v.length : 0;
      valueHtml = `<b>${n}</b>`;
      break;
    }
    case "run_en_cours": {
      valueHtml = isNO(cell.v) ? noAware(cell.v, cell.why) : esc(cell.v);
      break;
    }
    case "dernier_verdict": {
      if (isNO(cell.v)) { valueHtml = noAware(cell.v, cell.why); break; }
      const v = cell.v || {};
      valueHtml = `${verdictBadge(v.decision)} <span class="dim mono-small">${esc(v.project||"")}</span>`;
      break;
    }
    case "drift_high":
    case "incidents": {
      if (isNO(cell.v)) { valueHtml = noAware(cell.v, cell.why); break; }
      const v = cell.v || {};
      const ids = v.ids || [];
      const total = v.total != null ? v.total : ids.length;
      const nouveaux = bandeauCountNouveaux(key, ids);
      valueHtml = `<b>${total}</b> <span class="bandeau-sub">(${nouveaux} nouveaux)</span>`;
      break;
    }
    case "cout_recent": {
      if (isNO(cell.v)) { valueHtml = noAware(cell.v, cell.why); break; }
      const v = cell.v || {};
      valueHtml = isNO(v.declare_usd)
        ? noAware(v.declare_usd, "la telemetrie ne porte pas de cout pour cette tentative")
        : `${fmtNum(v.declare_usd)} $ <span class="bandeau-sub">(${isNO(v.tokens_mesures)?"tok. "+NOT_OBSERVABLE:fmtNum(v.tokens_mesures)+" tok."})</span>`;
      titleAttr = v.avertissement || "";
      break;
    }
    case "prochaine_action": {
      if (!isNO(cell.v)) {
        // Cellule serveur remplie (le jour où views.py branchera planning_view) :
        // affichée telle quelle, sans repli.
        const v = cell.v || {};
        valueHtml = `<b>${esc(v.id||"?")}</b> <span class="dim mono-small">${esc(clip(v.objectif||"", 90))}</span>`;
        titleAttr = v.raison || "";
        break;
      }
      const repli = prochaineActionFallback();
      if (repli) {
        valueHtml = `<b>${esc(repli.id)}</b> <span class="dim mono-small">${esc(clip(repli.objectif||"", 90))}</span> <span class="bandeau-sub">(registre ratifié)</span>`;
        titleAttr = repli.raison || "";
      } else {
        valueHtml = noAware(cell.v, cell.why);
      }
      break;
    }
    default:
      valueHtml = isNO(cell.v) ? noAware(cell.v, cell.why) : esc(JSON.stringify(cell.v));
  }

  const clickable = target ? " bandeau-clickable" : "";
  return `<button class="bandeau-cell${clickable}" data-bkey="${esc(key)}"${titleAttr ? ` title="${esc(titleAttr)}"` : ""}>
    <span class="bandeau-label">${esc(label)}</span>
    <span class="bandeau-value">${valueHtml}</span>
  </button>`;
}

function renderBandeau(){
  const el = document.getElementById("bandeau");
  if (!el) return;
  const c0 = STATE.data && STATE.data.views && STATE.data.views.c0_bandeau;
  if (!c0) { el.innerHTML = `<div class="dim mono-small" style="padding:6px 10px">en attente de /api/state…</div>`; return; }
  const order = ["decisions_en_attente","run_en_cours","dernier_verdict","drift_high","incidents","cout_recent","prochaine_action"];
  el.innerHTML = order.map(k => bandeauCellHtml(k, c0[k] || {v: NOT_OBSERVABLE})).join("");
}

document.getElementById("bandeau").addEventListener("click", (ev) => {
  const btn = ev.target.closest(".bandeau-cell");
  if (!btn) return;
  const key = btn.dataset.bkey;
  const c0 = STATE.data && STATE.data.views && STATE.data.views.c0_bandeau;
  if ((key === "drift_high" || key === "incidents") && c0 && c0[key] && !isNO(c0[key].v)) {
    bandeauMarkSeen(key, (c0[key].v || {}).ids || []);
    renderBandeau();
  }
  const target = BANDEAU_TARGETS[key];
  if (target) switchTab(target);
});

/* ======================================================================= *
 * Cockpit opérateur — C1 Campagnes / C2 Drift / C3 Santé Observer
 *
 * Ces trois vues sont servies par observer/cockpit.py::build_cockpit et
 * consommées telles quelles : colonnes+lignes pour les tableaux, cellule =
 * {v, src?, why?}. Le contrat NOT_OBSERVABLE de la console (jamais 0/—/null,
 * toujours un mot + la raison en title) s'applique ici comme ailleurs.
 * ======================================================================= */

// Rend une cellule de tableau cockpit {v, src?, why?}. `colKey` permet un
// habillage spécifique (ex: badge de verdict) sans dupliquer la détection
// NOT_OBSERVABLE, qui reste commune à toutes les colonnes.
function campCell(cell, colKey){
  if (!cell || cell.v === undefined) return '<span class="dim">—</span>';
  let valHtml;
  if (isNO(cell.v)) {
    valHtml = noAware(cell.v, cell.why);
  } else if (colKey === "verdict" || colKey === "decision") {
    valHtml = verdictBadge(cell.v);
  } else if (typeof cell.v === "number") {
    valHtml = fmtNum(cell.v);
  } else {
    valHtml = esc(cell.v);
  }
  const src = cell.src ? " " + srcLink(cell.src) : "";
  return valHtml + src;
}

function verdictBadge(v){
  const s = String(v).toUpperCase();
  if (s.includes("BLOCKED")) return `<span class="badge st-blocked">⛔ ${esc(v)}</span>`;
  if (s.includes("OBJECTION")) return `<span class="badge st-retry">⚠ ${esc(v)}</span>`;
  if (s.includes("FAIL")) return `<span class="badge st-failed">✕ ${esc(v)}</span>`;
  if (s === "OK" || s.includes("READY") || s.includes("SUCCESS")) return `<span class="badge st-success">✓ ${esc(v)}</span>`;
  return esc(v);
}

// Tendance d'un delta de progression : icône + mot, jamais la couleur seule.
function tendanceBadge(t, why){
  if (isNO(t)) return `<span class="no"><span class="ico">⛔</span>NOT_OBSERVABLE</span>`;
  const map = {
    MIEUX:      {cls:"st-success", ico:"▲"},
    MOINS_BIEN: {cls:"st-failed",  ico:"▼"},
    STABLE:     {cls:"st-waiting", ico:"■"},
  };
  const m = map[t] || {cls:"st-waiting", ico:"•"};
  return `<span class="badge ${m.cls}" title="${esc(why||'')}">${m.ico} ${esc(t)}</span>`;
}

function fmtDeltaVal(v){
  if (v === null || v === undefined) return '<span class="dim">—</span>';
  if (isNO(v)) return noAware(v);
  if (typeof v === "number") return fmtNum(v);
  return esc(v);
}

/* ---- C1 : Campagnes ---- */
function renderC1(c1){
  if (!c1) return emptyState();
  const cols = c1.colonnes || [];
  const rows = c1.lignes || [];
  const title = `<h2 class="vtitle">Campagnes<span class="sub">qu'est-ce qui s'est passé ?</span></h2>`;
  if (!rows.length) return title + emptyState("aucune campagne observée");

  const thead = "<tr>" + cols.map(c => `<th>${esc(c.titre)}</th>`).join("") + "</tr>";
  const tbody = rows.map(row => {
    const tds = cols.map(c => {
      let titleAttr = "";
      if (c.cle === "outils_hors_contrat" && Array.isArray(row._detail_hors_contrat) && row._detail_hors_contrat.length) {
        titleAttr = ` title="${esc(row._detail_hors_contrat.join(', '))}"`;
      }
      return `<td${titleAttr}>${campCell(row[c.cle], c.cle)}</td>`;
    }).join("");
    return `<tr>${tds}</tr>`;
  }).join("");

  const table = `<div class="table-scroll"><table><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
  const note = c1.note_cout ? `<div class="dim mono-small" style="margin-top:8px">${esc(c1.note_cout)}</div>` : "";
  return title + table + note + renderProgression(c1.progression);
}

function renderProgression(progression){
  const title = `<h2 class="vtitle" style="margin-top:18px">Progression<span class="sub">qu'est-ce qui s'améliore entre deux tentatives ?</span></h2>`;
  if (!Array.isArray(progression) || !progression.length) {
    return title + emptyState("pas assez de tentatives consécutives pour mesurer une progression");
  }
  const blocks = progression.map(p => {
    const rows = (p.deltas || []).map(d => `
      <tr>
        <td>${esc(d.colonne)}</td>
        <td class="mono-small">${fmtDeltaVal(d.avant)}</td>
        <td class="mono-small">${fmtDeltaVal(d.apres)}</td>
        <td class="mono-small">${d.delta != null ? fmtNum(d.delta) : '<span class="dim">—</span>'}</td>
        <td>${tendanceBadge(d.tendance, d.why)}</td>
      </tr>`).join("");
    return card(`
      <div class="run-head"><span class="rid">${esc(p.de)}</span><span class="dim">→</span><span class="rid">${esc(p.vers)}</span></div>
      <div class="table-scroll"><table>
        <thead><tr><th>colonne</th><th>avant</th><th>après</th><th>delta</th><th>tendance</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    `);
  }).join("");
  return title + blocks;
}

/* ---- C2 : Drift (vue fusionnée unique — v9 n'existe plus côté serveur) ---- */

function bulletList(arr){
  return `<ul class="bullets">${arr.map(x => `<li>${esc(typeof x === "object" && x !== null ? JSON.stringify(x) : x)}</li>`).join("")}</ul>`;
}

// declaration/observation peuvent être une chaîne (dont NOT_OBSERVABLE), un
// nombre, une liste de valeurs simples, une liste d'objets, ou un objet.
// Jamais tronqué en silence : listes complexes/objets passent par le JSON
// dépliable déjà utilisé ailleurs dans la console (rawJson).
function driftVal(val){
  if (val === null || val === undefined) return '<span class="dim">—</span>';
  if (isNO(val)) return noAware(val);
  if (Array.isArray(val)) {
    if (!val.length) return '<span class="dim">[]</span>';
    const simple = val.every(x => typeof x !== "object" || x === null);
    return simple ? bulletList(val) : rawJson(val, `liste (${val.length} élément(s), rien de tronqué)`);
  }
  if (typeof val === "object") return rawJson(val, "objet (rien de tronqué)");
  if (typeof val === "number") return fmtNum(val);
  return esc(val);
}

function sevBadge2(sev){
  if (!sev || isNO(sev) || String(sev).trim() === "" || !/^(high|medium|info)$/.test(sev)) {
    return '<span class="dim">—</span>';
  }
  return sevBadge(sev);
}

// Statut de traitement (nouveau/vu/arbitré) — géré côté client par drift_id,
// jamais persisté par Observer (cf. cockpit.py::_drift_id, hash stable).
// Trois états cycliques au clic, persistés en localStorage (survit au reload).
const C2_TRAITEMENT_STATES = ["nouveau", "vu", "arbitre"];
const C2_TRAITEMENT_LABELS = {nouveau:"nouveau", vu:"vu", arbitre:"arbitré"};
function c2TraitementKey(driftId){ return "observer_drift_traitement_" + driftId; }
function c2GetTraitement(driftId){
  try { return localStorage.getItem(c2TraitementKey(driftId)) || "nouveau"; }
  catch (e) { return "nouveau"; }
}
function c2CycleTraitement(driftId){
  const cur = c2GetTraitement(driftId);
  const next = C2_TRAITEMENT_STATES[(C2_TRAITEMENT_STATES.indexOf(cur) + 1) % C2_TRAITEMENT_STATES.length];
  try { localStorage.setItem(c2TraitementKey(driftId), next); } catch (e) {}
  return next;
}
function c2TraitementBadge(state){
  const map = {
    nouveau: {cls:"st-retry", ico:"●"},
    vu: {cls:"st-waiting", ico:"◐"},
    arbitre: {cls:"st-success", ico:"✓"},
  };
  const m = map[state] || map.nouveau;
  return `<span class="badge ${m.cls}">${m.ico} ${esc(C2_TRAITEMENT_LABELS[state] || state)}</span>`;
}

let _c2cache = null;
// Filtres simples (boutons toggle) — état client, pas de framework.
const _c2filter = {famille: null, gravite: null};

// Lampe de salle de contrôle (arbitrage Pierre 2026-08-02) : ROUGE si ≥1
// high non traité (statut de traitement localStorage, cf. c2GetTraitement),
// ORANGE si ≥1 medium non traité, VERT sinon. Compte + phrase, jamais la
// couleur seule.
function c2LampState(rows){
  let high = 0, medium = 0, highUntraite = 0, mediumUntraite = 0;
  (rows||[]).forEach(r => {
    const t = c2GetTraitement(r.drift_id);
    if (r.gravite === "high") { high++; if (t !== "arbitre") highUntraite++; }
    else if (r.gravite === "medium") { medium++; if (t !== "arbitre") mediumUntraite++; }
  });
  if (highUntraite > 0) return {level:"ROUGE", color:"var(--fail)", phrase:`${high} problème(s) grave(s), ${high-highUntraite} traité(s)`};
  if (mediumUntraite > 0) return {level:"ORANGE", color:"var(--sev-medium)", phrase:`${medium} problème(s) moyen(s), ${medium-mediumUntraite} traité(s)`};
  return {level:"VERT", color:"var(--ok)", phrase: (high+medium) ? "tout le grave/moyen est traité" : "aucun drift grave ou moyen"};
}
function c2LampHtml(rows){
  const st = c2LampState(rows);
  return `<div class="card" style="display:flex;align-items:center;gap:10px;border-color:${st.color};margin-bottom:10px">
    <span class="lamp-dot" style="background:${st.color};box-shadow:0 0 8px ${st.color}"></span>
    <div>
      <div style="color:${st.color};font-weight:700">${st.level} — salle de contrôle</div>
      <div class="dim mono-small">${esc(st.phrase)}</div>
    </div>
  </div>`;
}

function renderC2(c2){
  if (!c2) return emptyState();
  _c2cache = c2;
  const lampHtml = c2LampHtml(c2.lignes || []);
  const title = lampHtml + pilotHeader("c2", c2) + `<div class="dim mono-small" style="margin-bottom:8px">vue unique, fusionnée — chaque ligne confronte une déclaration à ce qui a été observé</div>`;
  const rows = c2.lignes || [];
  const familles = c2.familles || {};
  const parGravite = c2.par_gravite || {};

  const header = card(`
    <div class="dim mono-small" style="margin-bottom:6px">${esc(c2.regle_owner || "")}</div>
    <div class="run-head">
      <span>total: <b>${rows.length}</b></span>
      ${Object.entries(familles).map(([f,n]) => `<span class="chip">${esc(f)} <b>${esc(n)}</b></span>`).join("")}
    </div>
    <div class="run-head" style="margin-top:6px">
      ${Object.entries(parGravite).map(([s,n]) => `<span>${sevBadge2(s)} ${esc(n)}</span>`).join(" ")}
    </div>
    <div class="run-head" style="margin-top:6px">
      ${(c2.chaine ? c2.chaine.split("->").map(s=>`<span class="tag">${esc(s.trim())}</span>`) : []).join(" → ")}
    </div>
  `);

  if (!rows.length) return title + header + emptyState("aucun drift détecté");

  const famList = Object.keys(familles).sort();
  const gravOrder = {high:0, medium:1, info:2};
  const gravList = Object.keys(parGravite)
    .filter(g => /^(high|medium|info)$/.test(g))
    .sort((a,b) => (gravOrder[a] ?? 9) - (gravOrder[b] ?? 9));

  const filterBar = `
    <div class="filterbar">
      <span class="dim">famille :</span>
      <button class="filterbtn c2filter-fam ${!_c2filter.famille ? 'active' : ''}" data-fam="">toutes (${rows.length})</button>
      ${famList.map(f => `<button class="filterbtn c2filter-fam ${_c2filter.famille===f ? 'active' : ''}" data-fam="${esc(f)}">${esc(f)} (${esc(familles[f])})</button>`).join("")}
      <span class="dim" style="margin-left:14px">gravité :</span>
      <button class="filterbtn c2filter-grav ${!_c2filter.gravite ? 'active' : ''}" data-grav="">toutes</button>
      ${gravList.map(g => `<button class="filterbtn c2filter-grav ${_c2filter.gravite===g ? 'active' : ''}" data-grav="${esc(g)}">${esc(g)} (${esc(parGravite[g])})</button>`).join("")}
    </div>`;

  return title + header + filterBar + `<div id="c2tablewrap"></div>`;
}

function c2RowMatches(r){
  if (_c2filter.famille && r.famille !== _c2filter.famille) return false;
  if (_c2filter.gravite && r.gravite !== _c2filter.gravite) return false;
  return true;
}

function drawC2Table(){
  const wrap = document.getElementById("c2tablewrap");
  if (!wrap || !_c2cache) return;
  const rows = (_c2cache.lignes || []).filter(c2RowMatches);
  if (!rows.length) { wrap.innerHTML = emptyState("aucune ligne pour ce filtre"); return; }

  const thead = `<tr>
    <th>écart (confrontation)</th><th>famille</th><th>gravité</th><th>preuve</th>
    <th>impact</th><th>propriétaire</th><th>action</th><th>statut de traitement</th>
  </tr>`;

  const body = rows.map(r => {
    const notObs = isNO(r.statut);
    const trCls = notObs ? "row-not-observable" : (r.gravite === "high" ? "row-high" : "");

    const ecartHtml = `
      <div><b>${esc(r.confrontation || "")}</b></div>
      <div class="mono-small" style="margin-top:3px">${driftVal(r.declaration)} <span class="dim">→</span> ${driftVal(r.observation)}</div>
      ${(r.run_id || r.etape) ? `<div class="mono-small dim" style="margin-top:2px">${esc(r.run_id || "")}${r.etape ? (" / " + esc(r.etape)) : ""}</div>` : ""}
      ${r.detail ? `<details class="rawjson" style="margin-top:3px"><summary>détail</summary><div class="wrap" style="margin-top:4px;max-width:360px">${esc(r.detail)}</div></details>` : ""}
    `;
    const familleHtml = isNO(r.famille) ? noAware(r.famille, r.famille_why) : esc(r.famille || "");
    const preuveHtml = r.provenance ? srcLink(r.provenance) : '<span class="dim">—</span>';
    const impactHtml = isNO(r.impact) ? noAware(r.impact, r.impact_why) : esc(r.impact || "");
    const ownerHtml = isNO(r.owner) ? noAware(r.owner, r.owner_why) : esc(r.owner || "");
    const actionHtml = isNO(r.action) ? noAware(r.action, r.action_why) : esc(r.action || "");
    const traitement = c2GetTraitement(r.drift_id);

    return `<tr class="${trCls}">
      <td class="wrap">${ecartHtml}</td>
      <td>${familleHtml}</td>
      <td>${sevBadge2(r.gravite)}</td>
      <td>${preuveHtml}</td>
      <td class="wrap">${impactHtml}</td>
      <td class="wrap">${ownerHtml}</td>
      <td>${actionHtml}</td>
      <td><button class="c2traitement" data-drift-id="${esc(r.drift_id)}" title="cliquer pour faire avancer : nouveau → vu → arbitré">${c2TraitementBadge(traitement)}</button></td>
    </tr>`;
  }).join("");

  wrap.innerHTML = `<div class="table-scroll"><table><thead>${thead}</thead><tbody>${body}</tbody></table></div>`;
}

/* ======================================================================= *
 * C4 — HUMAN GATE
 *
 * Forme réelle produite par observer/command.py::view_humangate :
 *   {en_attente:[{run_id,project,preuve_attendue}], enregistrees:[{date,titre,proof}],
 *    ecart:[{projet,verdicts_concernes,occurrences_registre,constat}] | [{constat:NOT_OBSERVABLE}],
 *    deferred:[{id,premiere_ligne,proof}]}
 * chaque feuille est une cellule {v, src?, why?}.
 * ======================================================================= */
function hgCellVal(cell){
  if (!cell) return '<span class="dim">—</span>';
  if (isNO(cell.v)) return noAware(cell.v, cell.why);
  if (Array.isArray(cell.v)) return bulletList(cell.v);
  if (typeof cell.v === "number") return fmtNum(cell.v);
  return esc(cell.v);
}
function hgCellWithSrc(cell){
  if (!cell) return '<span class="dim">—</span>';
  const src = cell.src ? " " + srcLink(cell.src) : "";
  return hgCellVal(cell) + src;
}

function renderC4(c4){
  if (!c4) return emptyState();
  const title = pilotHeader("c4", c4) + `<div class="dim mono-small" style="margin-bottom:8px">ce qui attend Pierre vs ce qui est enregistré dans le registre canonique</div>`;

  // 1. ÉCART — LA ligne de valeur, en premier et mise en évidence.
  const ecart = c4.ecart || [];
  let ecartHtml;
  if (!ecart.length) {
    ecartHtml = emptyState("aucun écart détecté entre verdicts et registre");
  } else {
    ecartHtml = ecart.map(e => {
      if (!e.projet) {
        // forme de repli : {constat: NOT_OBSERVABLE} quand decision-log.md est illisible
        return card(hgCellVal(e.constat));
      }
      return `<div class="card" style="border-color:var(--sev-high);background:#2a0f0f">
        <div class="run-head">
          <span class="badge sev-high">⚠ ÉCART</span>
          <span class="rid">${esc((e.projet && e.projet.v) || "?")}</span>
        </div>
        <div class="kv" style="margin-top:8px">
          <span class="k">verdicts concernés</span><span>${hgCellWithSrc(e.verdicts_concernes)}</span>
          <span class="k">occurrences au registre</span><span>${hgCellWithSrc(e.occurrences_registre)}</span>
          <span class="k">constat</span><span>${hgCellVal(e.constat)}</span>
        </div>
      </div>`;
    }).join("");
  }

  // 2. EN_ATTENTE
  const enAttente = c4.en_attente || [];
  const enAttenteHtml = enAttente.length
    ? `<div class="table-scroll"><table>
        <thead><tr><th>run</th><th>projet</th><th>preuve attendue</th></tr></thead>
        <tbody>${enAttente.map(r => `<tr>
          <td>${hgCellVal(r.run_id)}</td>
          <td>${hgCellVal(r.project)}</td>
          <td class="wrap">${hgCellWithSrc(r.preuve_attendue)}</td>
        </tr>`).join("")}</tbody>
      </table></div>`
    : emptyState("aucune décision en attente de gate");

  // 3. ENREGISTREES — badge SELF_DECLARED + note parsing prose.
  const enreg = c4.enregistrees || [];
  const enregHtml = enreg.length
    ? `<div class="table-scroll"><table>
        <thead><tr><th>date</th><th>titre</th><th>preuve</th></tr></thead>
        <tbody>${enreg.map(r => `<tr>
          <td class="mono-small">${hgCellVal(r.date)}</td>
          <td class="wrap">${hgCellWithSrc(r.titre)}</td>
          <td>${r.proof ? `<span class="badge st-waiting" title="${esc(r.proof.why||'')}">${esc(r.proof.v)}</span>` : '<span class="dim">—</span>'}</td>
        </tr>`).join("")}</tbody>
      </table></div>`
    : emptyState("registre décisions vide ou illisible");

  // 4. DEFERRED — replié.
  const deferred = c4.deferred || [];
  const deferredHtml = deferred.length
    ? `<details class="rawjson"><summary>${deferred.length} décision(s) différée(s) — DEFERRED.md</summary>
        <div class="table-scroll" style="margin-top:6px"><table>
          <thead><tr><th>id</th><th>première ligne</th><th>preuve</th></tr></thead>
          <tbody>${deferred.map(r => `<tr>
            <td class="mono-small">${hgCellVal(r.id)}</td>
            <td class="wrap">${hgCellWithSrc(r.premiere_ligne)}</td>
            <td>${r.proof ? `<span class="badge st-waiting" title="${esc(r.proof.why||'')}">${esc(r.proof.v)}</span>` : '<span class="dim">—</span>'}</td>
          </tr>`).join("")}</tbody>
        </table></div>
      </details>`
    : emptyState("aucune décision différée");

  return `${title}
    <h2 class="vtitle" style="margin-top:4px;color:var(--sev-high)">Écart<span class="sub">décisions ratifiées hors registre — ${ecart.length} projet(s)</span></h2>
    ${ecartHtml}
    <h2 class="vtitle" style="margin-top:18px">En attente<span class="sub">${enAttente.length} run(s) prêt(s) pour la gate</span></h2>
    ${enAttenteHtml}
    <h2 class="vtitle" style="margin-top:18px">Enregistrées<span class="sub">${enreg.length} entrée(s) — decision-log.md, parsing prose best-effort</span></h2>
    ${enregHtml}
    <h2 class="vtitle" style="margin-top:18px">Différées</h2>
    ${deferredHtml}
  `;
}

/* ======================================================================= *
 * C6 — AI CONTROL
 *
 * Forme réelle produite par observer/command.py::view_aicontrol :
 *   {au_demarrage:{...}, avant_action:{...}, apres_action:{...},
 *    score_observabilite:{observables,not_observable,liste:[{item,why}]}}
 * chaque feuille des trois sections est une cellule {v, src?, why?, note?, because?}.
 * ======================================================================= */
function aiControlCell(label, cell){
  if (!cell) return "";
  let valHtml;
  if (isNO(cell.v)) valHtml = noAware(cell.v, cell.why);
  else if (typeof cell.v === "object" && cell.v !== null) valHtml = rawJson(cell.v, "détail (rien de tronqué)");
  else valHtml = esc(cell.v);
  const extras = [];
  if (cell.because) extras.push(`<div class="dim mono-small" style="margin-top:4px">${esc(cell.because)}</div>`);
  if (cell.note) extras.push(`<div class="dim mono-small" style="margin-top:4px">${esc(cell.note)}</div>`);
  if (cell.src) extras.push(`<div style="margin-top:4px">${srcLink(cell.src)}</div>`);
  return `<div class="card">
    <div class="dim mono-small" style="margin-bottom:4px">${esc(label)}</div>
    <div>${valHtml}</div>
    ${extras.join("")}
  </div>`;
}

function renderC6(c6){
  if (!c6) return emptyState();
  const title = `<h2 class="vtitle">AI Control<span class="sub">trois rythmes : au démarrage · avant action · après action</span></h2>`;

  const so = c6.score_observabilite || {};
  const observables = so.observables || 0;
  const notObservable = so.not_observable || 0;
  const total = observables + notObservable;
  const scoreHtml = card(`
    <div style="font-size:20px;color:#fff;font-weight:700">
      ${observables} observables / ${notObservable} NOT_OBSERVABLE
    </div>
    <div class="dim" style="margin-top:2px">distance à l'autonomie — ${total} item(s) évalués au total</div>
    ${(so.liste||[]).length ? `<div style="margin-top:10px">${(so.liste||[]).map(x =>
      `<div class="driftno-detail" style="margin-bottom:4px"><b>${esc(x.item)}</b> — ${esc(x.why)}</div>`
    ).join("")}</div>` : ""}
  `);

  function section(label, obj){
    if (!obj) return "";
    return `<h2 class="vtitle" style="margin-top:18px">${esc(label)}</h2>
      <div class="grid cols-auto">${Object.entries(obj).map(([k,cell]) => aiControlCell(k, cell)).join("")}</div>`;
  }

  return title + scoreHtml
    + section("Au démarrage", c6.au_demarrage)
    + section("Avant action", c6.avant_action)
    + section("Après action", c6.apres_action);
}

/* ======================================================================= *
 * C7 — FORGE MAP
 *
 * Forme réelle produite par observer/command.py::view_forgemap :
 *   {projet:{v}, campagne:{nombre_runs,fenetre_globale}, missions:[{run_id,decision,fenetre}],
 *    agents:{sessions_attribuees_par_etape}, artifacts:{fichiers_ecrits,rapports_etape,captures},
 *    tests_preuves:{tests,mutation,solvabilite,verdict_hmac}, decisions:{renvoi,note}}
 * Chaîne Projet → Campagne → Missions → Agents → Artifacts → Tests/Preuves → Décisions,
 * en colonnes/boîtes CSS maison (pas de lib). Le nœud décisions renvoie vers HUMAN GATE.
 * ======================================================================= */
function fmapLine(label, cell){
  if (!cell) return "";
  const v = isNO(cell.v) ? noAware(cell.v, cell.why)
    : (typeof cell.v === "object" && cell.v !== null ? rawJson(cell.v, "voir détail (rien de tronqué)") : esc(cell.v));
  const src = cell.src ? " " + srcLink(cell.src) : "";
  return `<div class="mono-small" style="margin:3px 0"><span class="dim">${esc(label)} :</span> ${v}${src}</div>`;
}

function renderC7(c7){
  if (!c7) return emptyState();
  const title = `<h2 class="vtitle">Forge Map<span class="sub">Projet → Campagne → Missions → Agents → Artifacts → Tests/Preuves → Décisions</span></h2>`;

  const box = (label, inner) => `<div class="stage-box fmap-box">
    <div class="lbl">${esc(label)}</div>
    <div style="margin-top:4px">${inner}</div>
  </div>`;
  const arrow = `<span class="fmap-arrow">→</span>`;

  const projetBox = box("Projet", fmapLine("nom", c7.projet));

  const camp = c7.campagne || {};
  const campBox = box("Campagne", fmapLine("nombre_runs", camp.nombre_runs) + fmapLine("fenêtre_globale", camp.fenetre_globale));

  const missions = c7.missions || [];
  const missionsBox = box("Missions", missions.length
    ? missions.map(m => `<div style="margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border)">
        ${(m.decision && m.decision.src) ? srcLink(m.decision.src, (m.run_id && m.run_id.v) || "?") : esc((m.run_id && m.run_id.v) || "?")}
        <div style="margin-top:2px">${verdictBadge((m.decision && m.decision.v) || "?")}</div>
      </div>`).join("")
    : '<span class="dim">—</span>');

  const agentsBox = box("Agents", fmapLine("sessions_par_étape", c7.agents && c7.agents.sessions_attribuees_par_etape));

  const art = c7.artifacts || {};
  const artifactsBox = box("Artifacts",
    fmapLine("fichiers_écrits", art.fichiers_ecrits) +
    fmapLine("rapports_étape", art.rapports_etape) +
    fmapLine("captures", art.captures));

  const tp = c7.tests_preuves || {};
  const testsBox = box("Tests / Preuves",
    fmapLine("tests", tp.tests) +
    fmapLine("mutation", tp.mutation) +
    fmapLine("solvabilité", tp.solvabilite) +
    fmapLine("verdict_hmac", tp.verdict_hmac));

  const dec = c7.decisions || {};
  const decisionsBox = `<button class="stage-box fmap-box" data-goto-tab="c4" style="cursor:pointer;text-align:left;border-color:var(--humangate)">
    <div class="lbl" style="color:var(--humangate)">Décisions ⇒ HUMAN GATE</div>
    <div class="dim mono-small" style="margin-top:6px">${esc(dec.note || "voir la vue HUMAN GATE")}</div>
  </button>`;

  return title + `<div class="fmap-row">
    ${projetBox}${arrow}${campBox}${arrow}${missionsBox}${arrow}${agentsBox}${arrow}${artifactsBox}${arrow}${testsBox}${arrow}${decisionsBox}
  </div>`;
}

/* ======================================================================= *
 * C8 — FLEET
 *
 * Forme réelle produite par observer/fleet.py::view_fleet :
 *   {colonnes:[{cle,titre}], lignes:[{...cellules {v,src,why}... } | {v:"ERREUR",projet,why}],
 *    projets:[...], note_cout_balayage, duree_construction_s}
 * Tri par défaut conservé côté serveur (plus récent en haut).
 * ======================================================================= */
function renderC8(c8){
  if (!c8) return emptyState();
  const title = `<h2 class="vtitle">Fleet<span class="sub">tous les projets pilotés par le driver, tri par défaut (récent en haut)</span></h2>`;
  const cols = c8.colonnes || [];
  const rows = c8.lignes || [];
  if (!rows.length) return title + emptyState("aucun projet observé");

  const thead = "<tr>" + cols.map(c => `<th>${esc(c.titre)}</th>`).join("") + "</tr>";
  const tbody = rows.map(row => {
    if (row.v === "ERREUR") {
      return `<tr class="row-not-observable"><td colspan="${cols.length}">⛔ projet <b>${esc(row.projet)}</b> — ${esc(row.why || "")}</td></tr>`;
    }
    const tds = cols.map(c => `<td>${campCell(row[c.cle], c.cle)}</td>`).join("");
    return `<tr>${tds}</tr>`;
  }).join("");

  const projets = c8.projets || [];
  const note = `<div class="dim mono-small" style="margin-top:8px">${esc(c8.note_cout_balayage || "")}</div>

  return title + `<div class="table-scroll"><table><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>` + note;
}

/* ======================================================================= *
 * SECTION SYSTÈME — s1..s7
 *
 * Sept vues qui font du cockpit le Master Schema vivant (mandat Pierre,
 * 2026-08-02) : chaque vue correspond à un objet métier de la Forge
 * (workflow, roadmap, agents, prompt assemblé, artefacts, injection,
 * flux produit/consomme/valide/archive), jamais à une métrique d'exécution.
 * Mêmes contrats que les vues C/V existantes : cellule {v, src?, why?},
 * NOT_OBSERVABLE jamais 0/vide/tiret, src cliquable via /api/source.
 * ======================================================================= */

// Correspondance clé de vue serveur -> id d'onglet, pour les liens croisés
// ({liens:{vue_detail:"s5_artefacts"}, etc.) produits par les vues système.
const S_VIEWKEY_TO_TAB = {
  s1_workflow: "s1", s2_roadmap: "s2", s3_agents: "s3", s4_prompt: "s4",
  s5_artefacts: "s5", s6_injection: "s6", s7_flow: "s7", s8_planning: "s8",
  s9_production: "s9", s10_evidence: "s10",
};
function viewKeyToTab(vk){
  if (!vk) return null;
  const head = String(vk).split(".")[0];
  return S_VIEWKEY_TO_TAB[head] || null;

function s0LinkBtn(tabId, label){

// Décisions FUTURES du registre ratifié (studio_brain/planning/planning.yaml,
// servi via s8_planning.registre.taches) : toute tâche dont `decision_attendue`
// est renseigné et ne commence PAS par « aucune » (deux formulations réelles
// dans le registre : « aucune — ratifié... » et « aucune (côté Observer...) »,
// toutes deux « pas une décision future », cf. evidence.py::_harvest_planning_gates
// qui applique exactement la même règle côté serveur pour s10_evidence).
function s0DecisionsFutures(){
  const s8 = STATE.data && STATE.data.views && STATE.data.views.s8_planning;
  const registre = s8 && s8.registre;
  const taches = (registre && Array.isArray(registre.taches)) ? registre.taches : [];
  return taches.filter(t => {
    const d = String(t.decision_attendue || "").trim().toLowerCase();
    return d && !d.startsWith("aucune");
  });
}

// « Ce qui avance » : tâches EN_COURS du registre + dernier chantier à l'état
// TERMINE (le registre ne porte pas de date, donc « dernier » = dernière
// entrée TERMINE dans l'ordre du fichier — best-effort assumé, jamais une
// vraie chronologie ; NOT_OBSERVABLE honnête si aucune tâche n'est TERMINE).
function s0CeQuiAvance(){
  const s8 = STATE.data && STATE.data.views && STATE.data.views.s8_planning;
  const registre = s8 && s8.registre;
  const taches = (registre && Array.isArray(registre.taches)) ? registre.taches : [];
  return {
    enCours: taches.filter(t => t.etat === "EN_COURS"),
    termine: taches.filter(t => t.etat === "TERMINE"),
  };
}

/* ---- S1 : WORKFLOW — 🏭 Forge, graphe SVG permanent des 9 blocs ---- */

function s1EtatBadge(bloc){
  const etat = bloc.etat;
  if (isNO(etat)) {
    const why = (bloc.producteur && !isNO(bloc.producteur.v) ? null : (bloc.producteur && bloc.producteur.why))
      || (bloc.consommateur && bloc.consommateur.why)
      || "aucune trace observée pour ce bloc dans ce projet";
    return `<span class="no" title="${esc(why)}"><span class="ico">⛔</span>NOT_OBSERVABLE</span>`;
  }
  if (etat === "ACTIF") return `<span class="badge st-success">✓ ACTIF</span>`;
  if (etat === "DORMANT") return `<span class="badge st-retry">◐ DORMANT</span>`;
  return esc(etat);
}

// Résumé d'une ligne de statut courte à écrire DANS le bloc du graphe --
// jamais de valeur devinée : NOT_OBSERVABLE reste NOT_OBSERVABLE, en toutes
// lettres, avec sa raison en tooltip (le SVG ne peut pas montrer un `title`
// HTML riche, donc on le pose en <title> SVG natif sur le groupe).
function s1StatusLine(b){
  if (isNO(b.etat)) return "aucune trace observée";
  const age = b.activite && b.activite.age_jours != null ? ` · il y a ${fmtNum(b.activite.age_jours)} j` : "";
  if (b.etat === "ACTIF") return "actif" + age;
  if (b.etat === "DORMANT") return "dormant" + age;
  return String(b.etat);
}

// Construit le graphe SVG des 9 blocs (World Scan → ... → Lessons → retour
// KB), reliés par des flèches verticales, plus la flèche de bouclage
// retour-KB → Knowledge Base tracée à part (courbe sur le côté) : verte/pleine
// si son état est ACTIF, rouge en pointillés + libellé court si NOT_OBSERVABLE
// -- c'est la boucle cassée que ce graphe existe pour rendre visible.
function s1BuildGraph(blocs){
  const bw = 260, bh = 54, gapY = 32, x0 = 20, y0 = 20;
  const n = blocs.length;
  const centers = blocs.map((_, i) => ({x: x0, y: y0 + i * (bh + gapY)}));
  const totalH = y0 + n * bh + (n - 1) * gapY + 20;
  const loopX = x0 + bw + 80;
  const svgW = loopX + 260;

  const kbIdx = blocs.findIndex(b => b.bloc === "Knowledge Base");
  const kbC = centers[kbIdx >= 0 ? kbIdx : 1];
  const lastC = centers[n - 1];
  const lastBloc = blocs[n - 1];
  const broken = isNO(lastBloc.etat);

  const defs = `<defs>
    <pattern id="s1hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#2a0f0f"/><line x1="0" y1="0" x2="0" y2="8" stroke="#5c1a1a" stroke-width="4"/>
    </pattern>
    <marker id="s1arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57626e"/>
    </marker>
    <marker id="s1arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--fail)"/>
    </marker>
  </defs>`;

  let arrows = "";
  for (let i = 0; i < n - 1; i++) {
    const a = centers[i], c = centers[i + 1];
    const x = a.x + bw / 2;
    arrows += `<line x1="${x}" y1="${a.y + bh}" x2="${x}" y2="${c.y}" stroke="#57626e" stroke-width="1.6" marker-end="url(#s1arrow)"/>`;
  }

  const lastCy = lastC.y + bh / 2, kbCy = kbC.y + bh / 2;
  const loopColor = broken ? "var(--fail)" : "var(--ok)";
  const loopDash = broken ? ' stroke-dasharray="6,4"' : "";
  const loopMarker = broken ? "url(#s1arrowRed)" : "url(#s1arrow)";
  const loopPath = `M ${lastC.x + bw} ${lastCy} C ${loopX} ${lastCy}, ${loopX} ${kbCy}, ${kbC.x + bw} ${kbCy}`;
  const loopLabel = broken ? "rien ne revient dans la bibliothèque" : "boucle retour active";
  const loopLabelY = Math.min(lastCy, kbCy) + Math.abs(lastCy - kbCy) / 2;
  const loop = `<path d="${loopPath}" fill="none" stroke="${loopColor}" stroke-width="2"${loopDash} marker-end="${loopMarker}"/>
    <text x="${loopX + 8}" y="${loopLabelY}" font-size="10.5" font-weight="${broken?700:400}" fill="${broken ? 'var(--fail)' : 'var(--ok)'}">${esc(loopLabel)}</text>`;

  const blocks = blocs.map((b, i) => {
    const c = centers[i];
    const no = isNO(b.etat);
    const fill = no ? "url(#s1hatch)" : (b.etat === "ACTIF" ? "#0f2a18" : "#1b2027");
    const stroke = no ? "var(--fail)" : (b.etat === "ACTIF" ? "var(--ok)" : "var(--dormant)");
    const dash = no ? ' stroke-dasharray="5,3"' : "";
    const sel = _s1selected === i;
    const statusColor = no ? "var(--fail)" : (b.etat === "ACTIF" ? "#8fe3a8" : "#aeb8c2");
    return `<g class="s1-block s1-node" data-idx="${i}">
      <title>${esc(b.bloc)} — ${esc(s1StatusLine(b))}</title>
      <rect x="${c.x}" y="${c.y}" width="${bw}" height="${bh}" rx="7" fill="${fill}" stroke="${stroke}" stroke-width="${sel?3:1.4}"${dash}/>
      <text x="${c.x+12}" y="${c.y+23}" font-size="13" font-weight="700" fill="#fff">${esc(b.bloc)}</text>
      <text x="${c.x+12}" y="${c.y+41}" font-size="10.5" fill="${statusColor}">${esc(s1StatusLine(b))}</text>
    </g>`;
  }).join("");

  return `<svg class="graph" width="${svgW}" height="${Math.max(totalH,200)}" xmlns="http://www.w3.org/2000/svg">${defs}${arrows}${blocks}${loop}</svg>`;
}
// Rendu générique d'un champ {v, src?, why?} des vues système — jamais de
// 0/—/null pour NOT_OBSERVABLE, toujours le mot + la raison en title.
function sFieldVal(cell){
  if (cell === undefined) return `<span class="no"><span class="ico">⛔</span>NOT_OBSERVABLE<span class="dim mono-small"> (champ absent)</span></span>`;
  if (cell === null) return '<span class="dim">—</span>';
  if (typeof cell !== "object" || cell.v === undefined) {
    return isNO(cell) ? noAware(cell) : esc(cell);
  }
  if (isNO(cell.v)) return noAware(cell.v, cell.why);
  const v = cell.v;
  let inner;
  if (Array.isArray(v)) inner = v.length ? tags(v) : '<span class="dim">[]</span>';
  else if (typeof v === "object" && v !== null) inner = rawJson(v, "détail (rien de tronqué)");
  else if (typeof v === "number") inner = fmtNum(v);
  else inner = esc(v);
  const src = cell.src ? " " + srcLink(cell.src) : "";
  return inner + src;
}

function s2TracesCell(cell){

function s3EnrichTile(label, cell){
  if (!cell) return "";
