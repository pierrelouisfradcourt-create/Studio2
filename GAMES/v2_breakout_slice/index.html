<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casse-briques — v2_breakout_slice</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background: #0b0e11;
      color: #eceff1;
      font-family: Arial, Helvetica, sans-serif;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 16px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #gameCanvas {
      border: 2px solid #2196f3;
      background: #101418;
      display: block;
    }
    #help {
      margin-top: 12px;
      font-size: 14px;
      color: #90a4ae;
    }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.72);
      z-index: 10;
    }
    #overlay.hidden {
      display: none;
    }
    #overlayContent {
      text-align: center;
    }
    #overlayText {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 32px;
    }
    #restart {
      padding: 14px 28px;
      font-size: 18px;
      background: #2196f3;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #restart:hover {
      background: #1976d2;
    }
  </style>
</head>
<body>
  <h1>Casse-briques</h1>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <p id="objectif"></p>
  <p id="help">Flèches gauche / droite pour déplacer la raquette.</p>

  <div id="overlay" class="hidden">
    <div id="overlayContent">
      <div id="overlayText"></div>
      <button id="restart" type="button">Rejouer</button>
    </div>
  </div>

  <script type="module" src="./main.mjs"></script>
</body>
</html>
