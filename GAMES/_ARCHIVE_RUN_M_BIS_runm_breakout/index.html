<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breakout - RUN M</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    .container {
      text-align: center;
    }
    h1 {
      color: #fff;
      margin-bottom: 20px;
    }
    .game-wrapper {
      position: relative;
      margin: 0 auto;
    }
    #gameCanvas {
      border: 2px solid #0f0;
      display: block;
      background: #000;
    }
    .hud {
      color: #0f0;
      font-size: 18px;
      margin-top: 10px;
      display: flex;
      justify-content: space-around;
      padding: 10px;
      background: #222;
      border: 1px solid #0f0;
    }
    #objective {
      color: #ff0;
      font-weight: bold;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    #overlay.hidden {
      display: none;
    }
    #overlay h2 {
      color: #fff;
      font-size: 48px;
      margin-bottom: 20px;
    }
    #restart {
      padding: 10px 20px;
      font-size: 18px;
      background: #0f0;
      color: #000;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    #restart:hover {
      background: #0c0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Breakout - RUN M</h1>
    <div class="game-wrapper">
      <canvas id="gameCanvas" width="800" height="600"></canvas>
      <div id="overlay" class="hidden">
        <h2 id="endgameText">VICTOIRE !</h2>
        <button id="restart">Rejouer</button>
      </div>
    </div>
    <div class="hud">
      <div id="objective">Vider l'écran 1</div>
      <div id="score">Score: 0</div>
      <div id="lives">Vies: 3</div>
    </div>
  </div>

  <script type="module">
    import { initializeGame } from './main.mjs';
    window.initializeGame = initializeGame;
  </script>
</body>
</html>
