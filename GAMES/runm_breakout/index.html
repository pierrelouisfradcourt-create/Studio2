<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breakout — runm_breakout</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      font-family: monospace;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      margin: 0 0 20px 0;
    }
    #objective {
      margin-bottom: 10px;
      font-size: 14px;
      color: #aaa;
    }
    canvas {
      border: 2px solid #fff;
      display: block;
      margin: 0 auto;
      background: #222;
    }
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #overlay.hidden {
      display: none;
    }
    #overlay h2 {
      font-size: 48px;
      margin: 0 0 40px 0;
    }
    #restart {
      padding: 10px 30px;
      font-size: 18px;
      cursor: pointer;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 4px;
    }
    #restart:hover {
      background: #ccc;
    }
  </style>
</head>
<body>
  <h1>Breakout — runm_breakout</h1>
  <div id="objective"></div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <div id="overlay" class="hidden">
    <h2>VICTOIRE!</h2>
    <button id="restart">Rejouer</button>
  </div>

  <script type="module">
    import { initGame, resetGame } from './main.mjs';

    // Setup restart button
    document.getElementById('restart').addEventListener('click', () => {
      resetGame(1);
    });
  </script>
</body>
</html>
