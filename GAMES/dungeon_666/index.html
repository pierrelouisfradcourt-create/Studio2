<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dungeon 666</title>
<meta name="theme-color" content="#07040a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap">
<style>
  /* Une seule ambiance, sombre et assumée : la fosse. Jeton par rôle. */
  :root {
    --void: #07040a;
    --ink: #f3e9e4;
    --ink-dim: #a8949a;
    --ember: #ff5a1f;
    --gold: #ffd23c;
    --cyan: #2fc7ff;
    --blood: #c0304a;
    --panel: rgba(18, 9, 14, 0.94);
    --line: rgba(255, 210, 180, 0.16);
    --display: 'Cinzel', 'Trajan Pro', Georgia, serif;
    --body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--void);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    background: var(--void);
  }
  #safe {
    position: fixed;
    inset: 0;
    visibility: hidden;
    pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  #ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: grid;
    place-items: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .panel {
    pointer-events: auto;
    box-sizing: border-box;
    width: min(760px, 100%);
    max-height: 100%;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 18px 20px 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 140, 80, 0.08);
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: rise 0.18s ease-out;
    touch-action: pan-y;
  }
  @keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  .title-screen { background: transparent; border: 0; box-shadow: none; text-align: center; align-items: center; }
  .kicker { letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--ember); }
  .logo {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(40px, 9vw, 84px);
    letter-spacing: 0.06em;
    margin: 0;
    line-height: 1;
    color: var(--ink);
    text-shadow: 0 0 30px rgba(255, 90, 31, 0.55), 0 2px 0 #3a0a10;
    text-wrap: balance;
  }
  .logo.red { color: #ff6a5a; font-size: clamp(30px, 6vw, 56px); }
  h2 { font-family: var(--display); font-weight: 800; letter-spacing: 0.06em; margin: 0; font-size: 24px; text-wrap: balance; }
  .lede { margin: 0; color: var(--ink); line-height: 1.45; max-width: 60ch; }
  .lede.gold { color: var(--gold); font-weight: 700; }
  .dim { color: var(--ink-dim); }
  .help { max-width: 62ch; font-size: 14px; line-height: 1.5; color: var(--ink-dim); }
  .help p { margin: 6px 0; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .btn {
    font: 700 16px var(--body);
    color: var(--ink);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line);
    border-radius: 4px;
    min-height: 48px;
    padding: 10px 18px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn.primary { background: linear-gradient(180deg, #ff6a2a, #c2301a); border-color: #ff9a5a; color: #fff; box-shadow: 0 0 20px rgba(255, 90, 31, 0.35); }
  .btn.small { min-height: 40px; font-size: 14px; padding: 6px 12px; }
  .btn.ghost { background: transparent; color: var(--ink-dim); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn:focus-visible, .card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .cards.two { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .card {
    --accent: var(--ember);
    min-width: 0;
    text-align: left;
    font: inherit;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
    border-top: 3px solid var(--accent);
    border-radius: 4px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  button.card { cursor: pointer; touch-action: manipulation; }
  button.card:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.08); }
  .card.rarity-rare { box-shadow: inset 0 0 0 1px rgba(90, 140, 255, 0.5); }
  .card.rarity-epique { box-shadow: inset 0 0 0 1px rgba(255, 138, 30, 0.7), 0 0 18px rgba(255, 138, 30, 0.2); }
  .card-kicker { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
  .card.item .card-kicker { color: var(--ink-dim); }
  .card-title { font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1.15; }
  .card-sub { font-size: 12px; color: var(--ink-dim); }
  .card-text { font-size: 14px; line-height: 1.4; }
  .affixes { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.5; color: #a9c4ff; }
  .affixes .power { color: #ff9a3a; list-style: '★ '; }
  .death { text-align: center; align-items: center; }
  .tuning { width: min(560px, 100%); }
  .sliders { display: flex; flex-direction: column; gap: 8px; }
  .slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 13px; }
  .slider output { font-variant-numeric: tabular-nums; color: var(--gold); }
  .slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--ember); }
  .slider.changed span { color: var(--gold); }
  @media (prefers-reduced-motion: reduce) { .panel { animation: none; } }
  @media (max-height: 430px) {
    .panel { padding: 12px 14px; gap: 8px; }
    .card { padding: 8px 10px; }
    .card-title { font-size: 16px; }
    .btn { min-height: 44px; }
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Dungeon 666"></canvas>
<div id="safe"></div>
<div id="ui"></div>
<script type="module" src="./src/main.mjs"></script>
</body>
</html>
