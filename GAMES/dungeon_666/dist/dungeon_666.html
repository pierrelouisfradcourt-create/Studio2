/** Entier uniforme dans [a, b] (bornes incluses). */

      // Grain de pierre.
      for (let k = 0; k < 10; k++) {
        g.fillStyle = rnd() < 0.5 ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.025)';
        g.fillRect(x + rnd() * w, y + rnd() * w, 2 + rnd() * 3, 2 + rnd() * 3);
      }
      g.globalAlpha = 0.04;
      g.fillStyle = tint;
      g.fillRect(x, y, w, w);
      g.globalAlpha = 1;
    }
  }
  pat = ctx.createPattern(c, 'repeat');
  cache.tiles.set(tint, pat);
  return pat;
}

function glow(color, radius) {
  const key = `${color}|${radius}`;
  let c = cache.glows.get(key);
  if (c) return c;
  const s = radius * 2;
  c = makeCanvas(s, s);
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(radius, radius, 0, radius, radius, radius);
  grad.addColorStop(0, color);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, s, s);
  cache.glows.set(key, c);
  return c;
}

function drawGlow(ctx, x, y, radius, color, alpha) {
  ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(glow(color, 64), x - radius, y - radius, radius * 2, radius * 2);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

/** Décor procédural d'une salle (fissures, veines de lave), stable pour une salle donnée. */
function roomDeco(room, seed) {
  if (cache.decoRoom === room) return cache.deco;
  let s = seed >>> 0 || 1;
  const rnd = () => {
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    return s / 4294967296;
  };
  const cracks = [];
  for (let i = 0; i < 14; i++) {
    const pts = [[rnd() * room.w, rnd() * room.h]];
    let a = rnd() * TAU;
    for (let k = 0; k < 4; k++) {
      a += (rnd() - 0.5) * 1.4;
      const [x, y] = pts[pts.length - 1];
      pts.push([x + Math.cos(a) * (20 + rnd() * 40), y + Math.sin(a) * (20 + rnd() * 40)]);
    }
    cracks.push({ pts, lava: rnd() < 0.35 });
  }
  const pools = [];
  for (let i = 0; i < 4; i++) pools.push({ x: rnd() * room.w, y: rnd() * room.h, r: 30 + rnd() * 50 });
  cache.deco = { cracks, pools };
  cache.decoRoom = room;
  return cache.deco;
}

// ------------------------------------------------------------------ salle

function drawRoom(ctx, game, time) {
  const room = game.room;
  const tint = CIRCLE_TINTS[(game.info.circle - 1) % CIRCLE_TINTS.length];
  ctx.fillStyle = tilePattern(ctx, tint);
  ctx.fillRect(0, 0, room.w, room.h);
  const deco = roomDeco(room, game.run.floor * 7919 + game.seed);
  for (const pool of deco.pools) drawGlow(ctx, pool.x, pool.y, pool.r * 2, tint, 0.1 + 0.03 * Math.sin(time * 1.3 + pool.x));
  ctx.lineCap = 'round';
  for (const c of deco.cracks) {
    ctx.strokeStyle = c.lava ? tint : PAL.crack;
    ctx.globalAlpha = c.lava ? 0.35 + 0.15 * Math.sin(time * 2 + c.pts[0][0]) : 0.9;
    ctx.lineWidth = c.lava ? 2.5 : 3;
    ctx.beginPath();
    ctx.moveTo(c.pts[0][0], c.pts[0][1]);
    for (let i = 1; i < c.pts.length; i++) ctx.lineTo(c.pts[i][0], c.pts[i][1]);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  drawWalls(ctx, room, tint, time);
  for (const o of room.obstacles) drawPillar(ctx, o);
}

function drawWalls(ctx, room, tint, time) {
  const p = room.pad;
  const out = WALL_OVERDRAW;
  ctx.fillStyle = PAL.wall;
  ctx.fillRect(-out, -out, room.w + 2 * out, out + p);
  ctx.fillRect(-out, room.h - p, room.w + 2 * out, out + p);
  ctx.fillRect(-out, 0, out + p, room.h);
  ctx.fillRect(room.w - p, 0, out + p, room.h);
  ctx.strokeStyle = PAL.wallEdge;
  ctx.lineWidth = 3;
  ctx.strokeRect(p, p, room.w - 2 * p, room.h - 2 * p);
  // Ombre portée des murs vers l'intérieur.
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(p, p, room.w - 2 * p, 18);
  for (const d of room.doors) drawDoor(ctx, d, time);
}

function drawDoor(ctx, d, time) {
  const color = d.reward === 'boon' && d.family ? FAMILIES[d.family].color : REWARD_COLORS[d.reward] ?? '#ffffff';
  const cx = d.x + d.w / 2;
  // Arche : fond noir, voûte arrondie en haut.
  const archPath = () => {
    ctx.beginPath();
    ctx.moveTo(d.x, d.y + d.h);
    ctx.lineTo(d.x, d.y + d.w / 2 - 20);
    ctx.arc(cx, d.y + d.w / 2 - 20, d.w / 2, Math.PI, 0);
    ctx.lineTo(d.x + d.w, d.y + d.h);
    ctx.closePath();
  };
  ctx.fillStyle = '#0a0508';
  archPath();
  ctx.fill();
  if (d.open) {
    drawGlow(ctx, cx, d.h - 10, 90, color, 0.35 + 0.1 * Math.sin(time * 4));
    const g = ctx.createLinearGradient(0, d.y, 0, d.y + d.h);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, color);
    ctx.globalAlpha = 0.45 + 0.1 * Math.sin(time * 3);
    ctx.fillStyle = g;
    archPath();
    ctx.fill();
    ctx.globalAlpha = 1;
  } else {
    ctx.strokeStyle = '#3a2a30';
    ctx.lineWidth = 4;
    for (let x = d.x + 14; x < d.x + d.w; x += 18) {
      ctx.beginPath();
      ctx.moveTo(x, d.y);
      ctx.lineTo(x, d.y + d.h);
      ctx.stroke();
    }
  }
  ctx.strokeStyle = d.open ? color : PAL.wallEdge;
  ctx.lineWidth = 4;
  archPath();
  ctx.stroke();
  // Icône de récompense + libellé.
  const label = d.reward === 'boon' && d.family ? FAMILIES[d.family].name : REWARD_LABELS[d.reward];
  const iconColor = d.reward === 'boon' && d.family ? FAMILIES[d.family].color : color;
  drawRewardIcon(ctx, d.reward, cx, d.h + 26, 13, iconColor, time);
  ctx.font = `700 14px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,0,0,0.8)';
  ctx.strokeText(label, cx, d.h + 50);
  ctx.fillStyle = d.open ? iconColor : PAL.textDim;
  ctx.fillText(label, cx, d.h + 50);
}

function drawRewardIcon(ctx, reward, x, y, r, color, time) {
  ctx.save();
  ctx.translate(x, y + Math.sin(time * 3) * 2);
  ctx.fillStyle = color;
  ctx.strokeStyle = 'rgba(0,0,0,0.7)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  switch (reward) {
    case 'boon':
      ctx.arc(0, 0, r, 0, TAU);
      break;
    case 'loot':
    case 'elite':
      ctx.moveTo(0, -r);
      ctx.lineTo(r, 0);
      ctx.lineTo(0, r);
      ctx.lineTo(-r, 0);
      break;
    case 'gold':
      ctx.ellipse(0, 0, r, r * 0.8, 0, 0, TAU);
      break;
    case 'heal':
      ctx.rect(-r * 0.35, -r, r * 0.7, r * 2);
      ctx.rect(-r, -r * 0.35, r * 2, r * 0.7);
      break;
    case 'boss':
      ctx.arc(0, 0, r, 0, TAU);
      ctx.moveTo(-r, -r * 0.4);
      ctx.lineTo(-r * 0.6, -r * 1.4);
      ctx.lineTo(-r * 0.2, -r * 0.6);
      ctx.moveTo(r, -r * 0.4);
      ctx.lineTo(r * 0.6, -r * 1.4);
      ctx.lineTo(r * 0.2, -r * 0.6);
      break;
    default:
      ctx.rect(-r * 0.8, -r * 0.8, r * 1.6, r * 1.6);
  }
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function drawPillar(ctx, o) {
  const h = 14; // hauteur apparente (fausse 3D vue de dessus)
  ctx.fillStyle = PAL.shadow;
  ctx.fillRect(o.x0 + 6, o.y0 + 10, o.x1 - o.x0, o.y1 - o.y0);
  ctx.fillStyle = PAL.pillarSide;
  ctx.fillRect(o.x0, o.y0, o.x1 - o.x0, o.y1 - o.y0);
  ctx.fillStyle = PAL.pillarTop;
  ctx.fillRect(o.x0, o.y0 - h, o.x1 - o.x0, o.y1 - o.y0);
  ctx.strokeStyle = PAL.wallEdge;
  ctx.lineWidth = 2;
  ctx.strokeRect(o.x0, o.y0 - h, o.x1 - o.x0, o.y1 - o.y0);
}

// ------------------------------------------------------------------ télégraphes

function dangerAlpha(progress) {
  // Clignotement accéléré dans le dernier quart : « ça part ».
  if (progress < 0.75) return 1;
  return 0.75 + 0.25 * Math.sin(progress * 60);
}

function drawCone(ctx, x, y, angle, range, arc, progress) {
  ctx.fillStyle = PAL.dangerFill;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.arc(x, y, range, angle - arc / 2, angle + arc / 2);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = dangerAlpha(progress);
  ctx.fillStyle = PAL.dangerFillHot;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.arc(x, y, range * Math.min(1, progress), angle - arc / 2, angle + arc / 2);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = PAL.danger;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, y, range, angle - arc / 2, angle + arc / 2);
  ctx.stroke();
}

function drawLine(ctx, x, y, angle, length, width, progress) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.fillStyle = PAL.dangerFill;
  ctx.fillRect(0, -width / 2, length, width);
  ctx.globalAlpha = dangerAlpha(progress);
  ctx.fillStyle = PAL.dangerFillHot;
  ctx.fillRect(0, -width / 2, length * Math.min(1, progress), width);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = PAL.danger;
  ctx.lineWidth = 2;
  ctx.strokeRect(0, -width / 2, length, width);
  ctx.restore();
}

function drawCircleDanger(ctx, x, y, r, progress, inner = 0) {
  ctx.fillStyle = PAL.dangerFill;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  if (inner > 0) ctx.arc(x, y, inner, 0, TAU, true);
  ctx.fill();
  ctx.globalAlpha = dangerAlpha(progress);
  ctx.fillStyle = PAL.dangerFillHot;
  ctx.beginPath();
  ctx.arc(x, y, Math.max(0.1, r * Math.min(1, progress)), 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = PAL.danger;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.stroke();
}

function drawTelegraphs(ctx, game) {
  for (const h of game.hazards) {
    const pr = hazardProgress(h);
    if (!h.hitsPlayer) continue; // les explosions des bénédictions ne menacent pas le héros
    if (h.shape === 'circle') drawCircleDanger(ctx, h.x, h.y, h.r, pr);
    else if (h.shape === 'ring') drawCircleDanger(ctx, h.x, h.y, h.r, pr, h.inner);
    else drawLine(ctx, h.x, h.y, h.angle, h.length, h.width, pr);
  }
  for (const e of game.enemies) {
    const t = e.tele;
    if (!t || e.dead) continue;
    if (t.shape === 'cone') drawCone(ctx, e.x, e.y, t.angle, t.range, t.arc, t.progress);
    else if (t.shape === 'line') drawLine(ctx, e.x, e.y, t.angle, t.length, t.width, t.progress);
    else drawCircleDanger(ctx, e.x, e.y, t.r, t.progress);
  }
}

function drawSpawnWarns(ctx, game, time) {
  for (const s of game.spawns) {
    const k = 1 - s.t / s.warn;
    const r = 18 + 14 * k;
    ctx.strokeStyle = s.elite ? PAL.eliteArdent : '#c0304a';
    ctx.globalAlpha = 0.4 + 0.5 * k;
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.lineDashOffset = -time * 40;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(s.x, s.y, r * 0.55, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1;
    drawGlow(ctx, s.x, s.y, r * 2, '#ff2a4a', 0.25 * k);
  }
}

// ------------------------------------------------------------------ objets et butin

function drawPickups(ctx, game, time) {
  for (const pk of game.pickups) {
    if (pk.kind === 'gold') {
      ctx.save();
      ctx.translate(pk.x, pk.y);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = PAL.gold;
      ctx.fillRect(-4, -4, 8, 8);
      ctx.restore();
      if ((time * 4 + pk.id) % 3 < 0.2) drawGlow(ctx, pk.x, pk.y, 14, PAL.gold, 0.6);
    } else {
      drawGlow(ctx, pk.x, pk.y, 26, PAL.heal, 0.5);
      ctx.fillStyle = PAL.heal;
      ctx.fillRect(pk.x - 3, pk.y - 9, 6, 18);
      ctx.fillRect(pk.x - 9, pk.y - 3, 18, 6);
    }
  }
}

function drawInteract(ctx, game, time) {
  const it = game.room.interact;
  if (!it || it.used) return;
  const bob = Math.sin(time * 3) * 4;
  let color = '#ffffff';
  let label = '';
  if (it.kind === 'boon') {
    color = FAMILIES[it.family].color;
    label = `Bénédiction · ${FAMILIES[it.family].name}`;
    drawGlow(ctx, it.x, it.y + bob, 70, color, 0.55);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(it.x, it.y + bob, 15, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(it.x, it.y + bob, 22 + 3 * Math.sin(time * 5), 0, TAU);
    ctx.stroke();
  } else if (it.kind === 'loot') {
    const rar = ITEM_RARITIES.find((r) => r.id === it.item.rarity);
    color = rar.color;
    label = it.item.name;
    // Colonne de lumière façon Diablo, plus haute pour les raretés élevées.
    const idx = ITEM_RARITIES.indexOf(rar);
    const h = 60 + idx * 50;
    const grad = ctx.createLinearGradient(0, it.y - h, 0, it.y);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, color);
    ctx.globalAlpha = 0.35 + 0.1 * Math.sin(time * 4);
    ctx.fillStyle = grad;
    ctx.fillRect(it.x - 10, it.y - h, 20, h);
    ctx.globalAlpha = 1;
    drawGlow(ctx, it.x, it.y, 40, color, 0.5);
    drawItemGlyph(ctx, it.item.slot, it.x, it.y + bob * 0.5, color);
  } else if (it.kind === 'shop') {
    color = '#7fe8ff';
    label = 'Marchand des âmes';
    ctx.fillStyle = '#3a2430';
    ctx.fillRect(it.x - 46, it.y - 6, 92, 26);
    ctx.fillStyle = '#5a3a44';
    ctx.fillRect(it.x - 50, it.y - 12, 100, 8);
    ctx.fillStyle = '#18101a';
    ctx.beginPath();
    ctx.arc(it.x, it.y - 30, 16, 0, TAU);
    ctx.fill();
    ctx.fillStyle = color;
    ctx.fillRect(it.x - 6, it.y - 34, 3, 3);
    ctx.fillRect(it.x + 3, it.y - 34, 3, 3);
    drawGlow(ctx, it.x, it.y - 20, 50, color, 0.25);
  } else if (it.kind === 'event') {
    color = '#b98cff';
    label = 'Autel';
    ctx.fillStyle = '#2e2433';
    ctx.fillRect(it.x - 30, it.y - 14, 60, 28);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.strokeRect(it.x - 30, it.y - 14, 60, 28);
    drawGlow(ctx, it.x, it.y - 10, 60, color, 0.35 + 0.15 * Math.sin(time * 3));
  }
  ctx.font = `700 14px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,0,0,0.85)';
  ctx.strokeText(label, it.x, it.y + 40);
  ctx.fillStyle = color;
  ctx.fillText(label, it.x, it.y + 40);
}

function drawItemGlyph(ctx, slot, x, y, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.strokeStyle = '#120a0e';
  ctx.lineWidth = 2;
  ctx.beginPath();
  if (slot === 'arme') {
    ctx.rotate(-Math.PI / 4);
    ctx.rect(-3, -18, 6, 26);
    ctx.rect(-9, 6, 18, 4);
    ctx.rect(-2, 10, 4, 8);
  } else if (slot === 'armure') {
    ctx.moveTo(-14, -12);
    ctx.lineTo(14, -12);
    ctx.lineTo(10, 14);
    ctx.lineTo(-10, 14);
    ctx.closePath();
  } else {
    ctx.arc(0, 0, 10, 0, TAU);
    ctx.moveTo(4, 0);
    ctx.arc(0, 0, 4, 0, TAU, true);
  }
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

// ------------------------------------------------------------------ créatures

const ENEMY_BODY = { imp: PAL.imp, archer: PAL.archer, brute: PAL.brute, charger: PAL.charger, exploder: PAL.exploder, gardien: PAL.boss };

function drawShadow(ctx, x, y, r) {
  ctx.fillStyle = PAL.shadow;
  ctx.beginPath();
  ctx.ellipse(x, y + r * 0.55, r * 1.05, r * 0.5, 0, 0, TAU);
  ctx.fill();
}

function drawEnemy(ctx, e, game, time) {
  let scale = 1;
  let alpha = 1;
  if (e.spawnT > 0) {
    // Apparition « easeOutBack » : 0 -> 1,15 -> 1.
    const k = 1 - Math.max(0, e.spawnT) / 0.25;
    const s = 1.70158;
    scale = Math.max(0.05, 1 + (s + 1) * (k - 1) ** 3 + s * (k - 1) ** 2);
    alpha = 0.5 + 0.5 * k;
  }
  if (e.state === 'windup') scale *= 1 + 0.1 * Math.sin(e.stateTime * 30);
  const r = e.r * scale;
  const face = Math.atan2(game.player.y - e.y, game.player.x - e.x);
  drawShadow(ctx, e.x, e.y, r);
  if (e.eliteMod) {
    const ec = ELITE_COLORS[e.eliteMod];
    drawGlow(ctx, e.x, e.y, r * 2.6, ec, 0.45);
    ctx.strokeStyle = ec;
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 6]);
    ctx.lineDashOffset = -time * 30;
    ctx.beginPath();
    ctx.arc(e.x, e.y, r + 7, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  if (e.boss) drawGlow(ctx, e.x, e.y, r * 2.4, e.phase === 2 ? '#ff3a1a' : '#8a1a3a', 0.5 + 0.15 * Math.sin(time * 5));
  if (e.kind === 'exploder' && e.state === 'windup') drawGlow(ctx, e.x, e.y, r * 4, '#ff9c2a', 0.4 + 0.4 * Math.sin(e.stateTime * 40));
  ctx.globalAlpha = alpha;
  ctx.save();
  ctx.translate(e.x, e.y);
  if (e.flash > 0 && (e.hitDirX || e.hitDirY)) {
    // Touché : tremblement le long de l'axe du coup pendant le gel (principe de Sakurai),
    // puis écrasement dans l'axe (aire conservée).
    const a = Math.atan2(e.hitDirY, e.hitDirX);
    const jitter = game.hitstop > 0 ? (Math.floor(time * 60) % 2 === 0 ? 2 : -2) : 0;
    ctx.translate(Math.cos(a) * jitter, Math.sin(a) * jitter);
    if (!e.boss) {
      ctx.rotate(a);
      ctx.scale(0.8, 1.25);
      ctx.rotate(-a);
    }
  }
  const body = e.flash > 0 ? '#ffffff' : ENEMY_BODY[e.kind] ?? PAL.imp;
  KIND_DRAW[e.kind]?.(ctx, r, face, body, e, time);
  ctx.restore();
  ctx.globalAlpha = 1;
  if (e.chill > 0) {
    ctx.strokeStyle = '#8fd8ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(e.x, e.y, r + 3, 0, TAU);
    ctx.stroke();
  }
  if (e.burn > 0) drawGlow(ctx, e.x, e.y - r * 0.5, r * 1.6, PAL.lava, 0.45 + 0.2 * Math.sin(time * 20 + e.id));
  if (e.stun > 0) drawStun(ctx, e.x, e.y - r - 10, time);
  if (!e.boss && (e.hp < e.maxHp || e.eliteMod)) drawEnemyHp(ctx, e, r);
  if (e.eliteMod) {
    ctx.font = `800 11px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.fillStyle = ELITE_COLORS[e.eliteMod];
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.lineWidth = 3;
    const label = ELITE_NAMES[e.eliteMod].toUpperCase();
    ctx.strokeText(label, e.x, e.y - r - 22);
    ctx.fillText(label, e.x, e.y - r - 22);
  }
}

function outlineCircle(ctx, r, fill) {
  ctx.fillStyle = fill;
  ctx.strokeStyle = PAL.enemyOutline;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, TAU);
  ctx.fill();
  ctx.stroke();
}

function eyes(ctx, r, face, color = '#ffe14a', spread = 0.45, dist = 0.45) {
  ctx.fillStyle = color;
  for (const s of [-spread, spread]) {
    const a = face + s;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * r * dist, Math.sin(a) * r * dist, Math.max(1.5, r * 0.13), 0, TAU);
    ctx.fill();
  }
}

function horns(ctx, r, face, color, size = 0.6) {
  ctx.fillStyle = color;
  ctx.strokeStyle = PAL.enemyOutline;
  ctx.lineWidth = 2;
  for (const s of [-0.8, 0.8]) {
    const a = face + s;
    const bx = Math.cos(a) * r * 0.8;
    const by = Math.sin(a) * r * 0.8;
    ctx.beginPath();
    ctx.moveTo(bx + Math.cos(a + 1.6) * r * 0.25, by + Math.sin(a + 1.6) * r * 0.25);

// ---------------------------------------------------------------- recettes

function swing(v, p) {
  const ev = p.ev;
  const index = clamp(Math.round(finite(ev.index, 0)), 0, SWING_COMBO.length - 1);
  playLayers(v, ev.strike ? SWING_STRIKE : SWING_COMBO[index], p.pitch, p.gain);
}

function hit(v, p) {
  const ev = p.ev;
  const amount = finite(ev.amount, HIT_LIGHT_AMOUNT);
  const norm = clamp((amount - HIT_LIGHT_AMOUNT) / (HIT_HEAVY_AMOUNT - HIT_LIGHT_AMOUNT), 0, 1);
  const body = p.pitch * lerp(HIT_PITCH_RANGE[0], HIT_PITCH_RANGE[1], norm) * lookup(ENEMY_PITCH, ev.enemy, 1);
  const g = p.gain * lerp(HIT_GAIN_RANGE[0], HIT_GAIN_RANGE[1], norm);
  playLayers(v, HIT_BODY, body, g);
  if (p.heavy) playLayers(v, HIT_HEAVY, body, g);
  if (ev.crit) playLayers(v, HIT_CRIT, p.pitch, p.gain);
}

function burn(v, p) {
  playLayers(v, BURN, p.pitch, p.gain);
}

function kill(v, p) {
  playLayers(v, KILL_BASE, p.pitch * lookup(ENEMY_PITCH, p.ev.enemy, 1), p.gain);
  if (p.ev.elite) playLayers(v, KILL_ELITE, p.pitch, p.gain);
  if (p.ev.boss) playLayers(v, KILL_BOSS, p.pitch, p.gain);
}

function chain(v, p) {
  playLayers(v, CHAIN_BUZZ, p.pitch, p.gain);
  const rnd = v.eng.random;
  for (let i = 0; i < CHAIN_SPARKS; i++) {
    const spark = { ...CHAIN_SPARK, at: rnd() * CHAIN_SPARK_WINDOW, gain: lerp(CHAIN_SPARK_GAIN[0], CHAIN_SPARK_GAIN[1], rnd()) };
    playLayers(v, [spark], p.pitch, p.gain);
  }
}

function hurt(v, p) {
  const g = lerp(HURT_GAIN_RANGE[0], HURT_GAIN_RANGE[1], clamp(finite(p.ev.amount, 0) / HURT_REF_AMOUNT, 0, 1));
  playLayers(v, HURT, p.pitch, p.gain * g);
}

function enemyAttack(v, p) {
  playLayers(v, lookup(ENEMY_ATTACK, p.ev.enemy, ENEMY_ATTACK.default), p.pitch, p.gain);
}

/** Explosion (explode) ou zone qui frappe (hazardFire) : la taille règle hauteur et force. */
function boom(v, p) {
  const ev = p.ev;
  const style = lookup(HAZARD_STYLE, ev.kind, HAZARD_STYLE.exploder);
  const size = clamp(finite(ev.r, BOOM_REF_RADIUS) / BOOM_REF_RADIUS, BOOM_SIZE_RANGE[0], BOOM_SIZE_RANGE[1]);
  const k = (p.pitch * style.pitch) / Math.sqrt(size);
  const g = p.gain * style.gain * Math.sqrt(size);
  playLayers(v, BOOM, k, g);
  if (style.fire) playLayers(v, BOOM_FIRE, p.pitch, g);
}

function slam(v, p) {
  const boss = !!p.ev.boss;
  playLayers(v, SLAM, p.pitch * (boss ? SLAM_BOSS_PITCH : 1), p.gain * (boss ? SLAM_BOSS_GAIN : 1));
}

function spawnWarn(v, p) {
  const elite = !!p.ev.elite;
  playLayers(v, SPAWN_WARN, p.pitch * (elite ? SPAWN_ELITE_PITCH : 1), p.gain * (elite ? SPAWN_ELITE_GAIN : 1));
}

function dashNova(v, p) {
  playLayers(v, GADGET, p.pitch * DASH_NOVA_PITCH, p.gain * DASH_NOVA_GAIN);
}

function coin(v, p) {
  playLayers(v, COIN, p.pitch, p.gain);
  if (p.ev.type === 'buy') playLayers(v, COIN_BUY, p.pitch, p.gain);
}

function boonGain(v, p) {
  playLayers(v, lookup(BOON_CHORDS, p.ev.rarity, BOON_CHORDS.commun), p.pitch, p.gain);
  playLayers(v, BOON_SPARKLE, p.pitch, p.gain);
}

function equip(v, p) {
  playLayers(v, EQUIP, p.pitch, p.gain);
  const notes = EQUIP_SPARKLE_NOTES.slice(0, lookup(EQUIP_SPARKLES, p.ev.rarity, 0));
  const sparkles = notes.map((freq, i) => ({ ...EQUIP_SPARKLE, freq, at: EQUIP_SPARKLE_START + i * EQUIP_SPARKLE_STEP }));
  playLayers(v, sparkles, p.pitch, p.gain);
}

function roomClear(v, p) {
  const b = p.ev.boss ? ROOM_CLEAR_BOSS_BELL : ROOM_CLEAR_BELL;
  playLayers(v, bell(b.root, BELL_PARTIALS, 0, b.release, b.gain), p.pitch, p.gain);
  playLayers(v, ROOM_CLEAR_CHORD, p.pitch * (p.ev.boss ? b.root / ROOM_CLEAR_BELL.root : 1), p.gain);
}

function floorEnter(v, p) {

  }
  handleFxEvents(fx, camera, g.events, g);
  audio.handleEvents(g.events, g);
  for (const ev of g.events) {
    if (ev.type === 'roomClear') setSlowmo(ev.boss ? SLOWMO.bossKill : SLOWMO.roomClear);
    else if (ev.type === 'playerDeath') setSlowmo(SLOWMO.playerDeath);
    else if (ev.type === 'dodge') setSlowmo(SLOWMO.dodge);
    if (ev.type === 'checkpoint' || ev.type === 'equip' || ev.type === 'gameOver' || ev.type === 'floorEnter') persistMeta();
  }
  g.events.length = 0;
}

const SLOWMO_COOLDOWN = 3; // s réelles entre deux ralentis (sauf boss et mort)

function setSlowmo(s) {
  const urgent = s === SLOWMO.bossKill || s === SLOWMO.playerDeath;
  if (!urgent && time - app.slowmo.last < SLOWMO_COOLDOWN) return;
  if (s.scale <= app.slowmo.scale || app.slowmo.t <= 0) {
    app.slowmo.scale = s.scale;
    app.slowmo.t = s.dur;
    app.slowmo.last = time;
  }
}

// ------------------------------------------------------------------ écran

function readSafe() {
  const cs = getComputedStyle(safeProbe);
  return {
    top: parseFloat(cs.paddingTop) || 0,
    right: parseFloat(cs.paddingRight) || 0,
    bottom: parseFloat(cs.paddingBottom) || 0,
    left: parseFloat(cs.paddingLeft) || 0,
  };
}

function resize() {
  const w = Math.max(1, window.innerWidth);
  const h = Math.max(1, window.innerHeight);
  const dpr = Math.min(MAX_DPR, window.devicePixelRatio || 1) * app.quality;
  app.view = { w, h, dpr, safe: readSafe() };
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = `${w}px`;
  canvas.style.height = `${h}px`;
  fitCamera(camera, w, h);
  input.layout(w, h, app.view.safe);
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
document.addEventListener('visibilitychange', () => {
  if (document.hidden && app.screen === 'game' && app.game?.mode === 'play') app.paused = true;
});

// Bouton pause du HUD (tactile et souris).
canvas.addEventListener('pointerdown', (ev) => {
  if (app.screen !== 'game' || !app.game) return;
  const r = pauseButtonRect(app.view.w, app.view.safe);
  if (Math.hypot(ev.clientX - r.x, ev.clientY - r.y) < r.r) {
    app.paused = true;
    ev.stopImmediatePropagation();
  }
}, { capture: true });

async function requestWakeLock() {
  try {
    await navigator.wakeLock?.request('screen');
  } catch {
    // refusé ou indisponible : sans importance
  }
}

// ------------------------------------------------------------------ boucle

let last = performance.now();
let lastDt = 1 / 60;
let acc = 0;
let time = 0;
const fpsMeter = { frames: 0, t: 0, low: 0, fps: 60 };
const playerScreen = { x: 0, y: 0 };

function frame(now) {
  requestAnimationFrame(frame);
  const realDt = Math.min(0.1, (now - last) / 1000);
  last = now;
  lastDt = realDt;
  time += realDt;
  measureFps(realDt);
  const g = app.game;
  if (input.consumePause() && app.screen === 'game' && g && g.mode === 'play') app.paused = !app.paused;

  let simSteps = 0;
  if (app.screen === 'game' && g && !app.paused && g.mode === 'play') {
    app.slowmo.t -= realDt;
    const scale = app.slowmo.t > 0 ? app.slowmo.scale : 1;
    acc += realDt * scale;
    let steps = 0;
    while (acc >= DT && steps < MAX_STEPS_PER_FRAME) {
      worldToScreen(camera, app.view.w, app.view.h, g.player.x, g.player.y, playerScreen);
      const pilot = window.__d666.autopilot;
      stepGame(g, pilot ? pilot(g) : input.frame(playerScreen));
      acc -= DT;
      steps++;
      if (g.mode !== 'play') break;
    }
    if (steps === MAX_STEPS_PER_FRAME) acc = 0;
    simSteps = steps;
  } else {
    input.frame(null); // vide les fronts accumulés pendant un menu
    acc = 0;
    if (g && g.mode === 'choice' && window.__d666.autopilotChoice) {
      window.__d666.autopilotChoice(g);
      afterCommand();
    }
  }
  if (g) {
    flushEvents();
    if (g.mode === 'play' || g.mode === 'dead') {
      // En jeu, la caméra avance au rythme des pas de simulation (60 Hz) : sur un écran
      // 120 Hz, héros et décor bougent ensemble, sans tremblotement relatif.
      const camDt = g.mode === 'play' && !app.paused ? simSteps * DT : realDt;
      if (camDt > 0) updateCamera(camera, g, camDt);
      updateFx(fx, realDt, g);
    }
  }
  render();
  ui.sync(app.screen === 'game' ? g : null, app);
}

function measureFps(dt) {
  fpsMeter.frames++;
  fpsMeter.t += dt;
  if (fpsMeter.t < 0.5) return;
  fpsMeter.fps = fpsMeter.frames / fpsMeter.t;
  fpsMeter.frames = 0;
  fpsMeter.t = 0;
  // Qualité adaptative : si le téléphone peine, on réduit la définition et les particules.
  if (app.screen === 'game' && fpsMeter.fps < FPS_LOW) fpsMeter.low += 0.5;
  else fpsMeter.low = 0;
  if (fpsMeter.low >= FPS_WINDOW && app.quality > 0.6) {
    app.quality = Math.max(0.6, app.quality - 0.2);
    fx.quality = Math.max(0.4, fx.quality - 0.3);
    fpsMeter.low = 0;
    resize();
  }
}

function render() {
  const { w, h, dpr } = app.view;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#07040a';
  ctx.fillRect(0, 0, w, h);
  const g = app.game;
  if (!g || app.screen === 'title') {
    drawTitleBackdrop(w, h);
    return;
  }
  ctx.save();
  applyCamera(ctx, camera, w, h);
  drawWorld(ctx, g, fx, time, input.touchUI());
  ctx.restore();
  drawHud(ctx, g, fx, camera, input.touchUI(), app.view, time, lastDt);
}

function drawTitleBackdrop(w, h) {
  const grad = ctx.createRadialGradient(w / 2, h * 1.1, 10, w / 2, h * 1.1, Math.max(w, h));
  grad.addColorStop(0, 'rgba(255, 90, 31, 0.35)');
  grad.addColorStop(0.5, 'rgba(120, 20, 30, 0.15)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(255, 140, 60, 0.6)';
  for (let i = 0; i < 40; i++) {
    const x = ((i * 97.3 + time * (12 + (i % 5) * 6)) % (w + 40)) - 20;
    const y = h - ((time * (30 + (i % 7) * 9) + i * 53) % (h + 20));
    ctx.fillRect(x, y, 2, 2);
  }
}

// ------------------------------------------------------------------ outils de test (e2e)

// Observation conforme au PLAYABLE_CONTRACT du studio (forge/contracts/PLAYABLE_CONTRACT.md) :
// position du héros, score (démons abattus), fin de partie, niveau (étage).
Object.defineProperty(window, '__game', {
  configurable: true,
  get() {
    const g = app.game;
    if (!g) return null;
    return {
      player: { x: g.player.x, y: g.player.y, hp: g.player.hp, maxHp: g.player.maxHp, state: g.player.state },
      score: g.telemetry.kills,
      gold: g.run.gold,
      over: g.mode === 'dead' || g.mode === 'victory',
      level: g.run.floor,
      mode: g.mode,
      tick: g.tick,
    };
  },
});

// Raccourcis de TEST uniquement (e2e, playtest) : ils forcent un état, ils ne jouent pas.
window.__d666 = {
  get game() {
    return app.game;
  },
  get app() {
    return app;
  },
  start: (floor = 1) => startRun(floor),
  fps: () => fpsMeter.fps,
  // Pilote automatique (playtest/captures) : (game) => InputFrame ; null = joueur humain.
  autopilot: null,
  autopilotChoice: null,
  killAll() {
    const g = app.game;
    if (!g) return;
    g.room.waveIndex = g.room.waves.length - 1;
    g.spawns.length = 0;
    for (const e of g.enemies) e.dead = true;
  },
  hurt(amount) {
    const g = app.game;
    if (!g) return;
    g.player.iframes = 0;
    g.player.hp = Math.max(0, g.player.hp - amount);
    if (g.player.hp <= 0) {
      g.player.hp = 0;
      g.player.state = 'dead';
      g.player.stateTime = 0;
    }
  },
  teleport(x, y) {
    const g = app.game;
    if (!g) return;
    g.player.x = x;
    g.player.y = y;
  },
};
window.__game_debug = {
  hit: () => window.__d666.hurt(99999), // défaite forcée
  forceWin: () => window.__d666.killAll(), // salle (ou Gardien) vaincue d'office
  start: (floor = 1) => startRun(floor),
};

resize();
if (params.get('autostart') === '1') startRun(Number(params.get('floor') ?? 1), params.get('arena') === '1');
requestAnimationFrame(frame);

return {  };
})();
</script>
