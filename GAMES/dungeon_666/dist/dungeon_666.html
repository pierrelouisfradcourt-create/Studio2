// JAMAIS Math.random — c'est ce qui rend une partie rejouable à l'identique.

const GOLDEN = 0x6d2b79f5;
const U32 = 4294967296;

function createRng(seed) {
  return { s: seed >>> 0 };
}

function cloneRng(r) {
  return { s: r.s };
}

function nextU32(r) {
  r.s = (r.s + GOLDEN) >>> 0;

  return (t ^ (t >>> 14)) >>> 0;

/** Flottant uniforme dans [0, 1). */
function rand(r) {
  return nextU32(r) / U32;
}

/** Flottant uniforme dans [a, b). */
function randRange(r, a, b) {
  return a + (b - a) * rand(r);
}

/** Entier uniforme dans [a, b] (bornes incluses). */
function randInt(r, a, b) {

function chance(r, p) {

function pick(r, arr) {

      const p = { x: ev.x + Math.cos(ev.angle) * 20, y: ev.y + Math.sin(ev.angle) * 20 };
      burst(fx, p.x, p.y, ev.strike || ev.index > 0 ? 7 : 4, 260, 0.18, 2, PAL.lance, { dir: ev.angle, spread: 0.6, streak: 1, drag: 8 });
      kick(cam, -Math.cos(ev.angle), -Math.sin(ev.angle), 1);
      fx.swingT = 0.04;
      fx.swingAngle = ev.angle;
      return;
    }
    addEffect(fx, { type: 'slash', angle: ev.angle, arc: ev.arc, range: ev.range, index: ev.index, strike: ev.strike, life: 0.15, max: 0.15 });
    kick(cam, Math.cos(ev.angle), Math.sin(ev.angle), 1.5);
    fx.swingT = 0.05;
    fx.swingAngle = ev.angle;
  },
  dashEnd(fx) {
    fx.landT = 0.067;
  },
  hit(fx, cam, ev) {
    const color = ENEMY_COLORS[ev.enemy] ?? PAL.imp;
    const dir = Math.atan2(ev.dirY, ev.dirX);
    const heavy = ev.amount >= 20 || ev.crit;
    if (ev.kind === 'burn') {
      burst(fx, ev.x, ev.y, 2, 60, 0.4, 2.5, PAL.lava, { drag: 2 });
      addDamageText(fx, ev, '#ff9a5a', 11, 0.5);
      return;
    }
    burst(fx, ev.x, ev.y, heavy ? 12 : 7, heavy ? 520 : 380, 0.28, 2.2, PAL.slash, { dir, spread: 1.4, streak: 1, drag: 7 });
    burst(fx, ev.x, ev.y, heavy ? 9 : 5, 220, 0.45, 3.2, color, { dir, spread: 2.2, drag: 4 });
    addEffect(fx, { type: 'ring', x: ev.x, y: ev.y, r0: 6, r1: heavy ? 46 : 30, color: PAL.impactRing, width: heavy ? 4 : 2.5, life: 0.14, max: 0.14 });
    if (ev.crit) addText(fx, ev.x, ev.y - 18, `${ev.amount}!`, PAL.crit, 21, 0.85);
    else addDamageText(fx, ev, PAL.text, heavy ? 17 : 14, 0.6);
    const shake = ev.shake || (ev.kind === 'skill' ? 0.14 : ev.kind === 'gadget' ? 0.05 : ev.kind === 'super' ? 0.04 : 0.08);
    addTrauma(cam, ev.crit ? shake + 0.08 : shake, true);
    if (ev.kind === 'melee' || ev.kind === 'strike') kick(cam, ev.dirX, ev.dirY, heavy ? 5 : 3);
    else if (ev.kind === 'skill') kick(cam, ev.dirX, ev.dirY, 4);
    if (heavy && (ev.kind === 'melee' || ev.kind === 'strike')) zoomKick(cam, 0.025);
  },
  kill(fx, cam, ev) {
    const color = ENEMY_COLORS[ev.enemy] ?? PAL.imp;
    const big = ev.boss ? 3 : ev.elite ? 1.8 : 1;
    burst(fx, ev.x, ev.y, Math.round(18 * big), 360 * big, 0.6, 3.5, color, { drag: 3.5 });
    burst(fx, ev.x, ev.y, Math.round(10 * big), 140, 1.1, 5, '#3a2a2e', { drag: 2 });
    burst(fx, ev.x, ev.y, Math.round(6 * big), 260, 0.5, 2, PAL.lava, { drag: 3, streak: 1 });
    addEffect(fx, { type: 'ring', x: ev.x, y: ev.y, r0: 10, r1: 70 * big, color, width: 5, life: 0.25, max: 0.25 });
    // Pose de mort : la silhouette blanchit puis se rétracte (pas de disparition sèche).
    addEffect(fx, { type: 'death', x: ev.x, y: ev.y, r: ev.r ?? 14, color, life: 0.22 * big, max: 0.22 * big });
    addTrauma(cam, ev.boss ? 1 : ev.elite ? 0.5 : 0.1, !ev.boss && !ev.elite);
    if (ev.boss) zoomKick(cam, 0.12);
    else if (ev.elite) zoomKick(cam, 0.04);
  },
  dash(fx, cam, ev) {
    burst(fx, ev.x, ev.y, 8, 160, 0.35, 4, '#5a4a52', { dir: Math.atan2(-ev.dirY, -ev.dirX), spread: 1.6, drag: 5 });
    addEffect(fx, { type: 'ring', x: ev.x, y: ev.y, r0: 8, r1: 34, color: PAL.heroCape, width: 2, life: 0.16, max: 0.16 });
  },
  dodge(fx, cam, ev) {
    addText(fx, ev.x, ev.y - 30, 'ESQUIVE', PAL.heroCape, 15, 0.7);
    burst(fx, ev.x, ev.y, 10, 200, 0.4, 2, PAL.heroCape, { streak: 1, drag: 6 });
  },
  playerHurt(fx, cam, ev) {
    addText(fx, ev.x, ev.y - 24, `-${ev.amount}`, PAL.heroHurt, 19, 0.8);
    burst(fx, ev.x, ev.y, 12, 260, 0.45, 3, PAL.heroHurt, { drag: 4 });
    fx.hurtFlash = 1;
    addTrauma(cam, 0.6);
    const dx = ev.x - ev.srcX;
    const dy = ev.y - ev.srcY;
    const l = Math.hypot(dx, dy) || 1;
    kick(cam, dx / l, dy / l, 7);
  },
  playerDeath(fx, cam, ev) {
    burst(fx, ev.x, ev.y, 40, 380, 1.2, 4, PAL.heroCape, { drag: 2 });
    addTrauma(cam, 1);
    zoomKick(cam, 0.12);
  },
  hazardFire(fx, cam, ev) {
    if (ev.shape === 'line') {
      addEffect(fx, { type: 'streak', x: ev.x, y: ev.y, angle: ev.angle, length: ev.length, width: ev.width, life: 0.25, max: 0.25, color: PAL.danger });
    } else {
      addEffect(fx, { type: 'shock', x: ev.x, y: ev.y, r: ev.r, life: 0.32, max: 0.32, color: ev.kind === 'sinBlast' ? '#ff8ae0' : '#ff6a3a' });
      if (ev.kind === 'bossSlam') zoomKick(cam, 0.02);
      burst(fx, ev.x, ev.y, 16, ev.r * 3, 0.5, 4, '#4a3036', { drag: 4 });
      burst(fx, ev.x, ev.y, 10, ev.r * 4, 0.35, 2.5, PAL.lava, { drag: 5, streak: 1 });
    }
    addTrauma(cam, ev.kind === 'sinBlast' ? 0.06 : 0.28);
  },
  explode(fx, cam, ev) {
    if (ev.hero) {
      // Bombe, piège, atterrissage du Bond, pot du Brasier : onde froide du héros.
      const st = HERO_BLAST[ev.kind] ?? HERO_BLAST.bombe;
      addEffect(fx, { type: 'shock', x: ev.x, y: ev.y, r: ev.r, life: 0.3, max: 0.3, color: st.color, edge: '#e8fbff' });
      burst(fx, ev.x, ev.y, 18, ev.r * 3.5, 0.45, 3, st.color, { drag: 5, streak: 1 });
      burst(fx, ev.x, ev.y, 10, ev.r * 2, 0.6, 4, '#4a5a64', { drag: 4 });
      addTrauma(cam, st.trauma);
      if (st.zoom) zoomKick(cam, st.zoom);
      return;
    }
    burst(fx, ev.x, ev.y, 26, 420, 0.6, 4, PAL.exploder, { drag: 3.5 });
  },
  hook(fx, cam, ev) {
    addEffect(fx, { type: 'bolt', x0: ev.x0, y0: ev.y0, x1: ev.x1, y1: ev.y1, life: 0.2, max: 0.2, seed: Math.random() * 1000, color: '#cfe9f5' });
    addText(fx, ev.x1, ev.y1 - 30, ev.boss ? 'ACCROCHÉ' : 'HARPONNÉ', '#cfe9f5', 13, 0.6);
    addTrauma(cam, 0.15);
  },
  kitPulse(fx, cam, ev) {
    addEffect(fx, { type: 'ring', x: ev.x, y: ev.y, r0: 12, r1: ev.r, color: '#bff8ff', width: 3, life: 0.3, max: 0.3 });
  },
  deflect(fx, cam, ev) {
    burst(fx, ev.x, ev.y, 6, 260, 0.25, 2, '#ffffff', { streak: 1, drag: 8 });
    addEffect(fx, { type: 'ring', x: ev.x, y: ev.y, r0: 4, r1: 22, color: '#ffffff', width: 2, life: 0.12, max: 0.12 });
  },
  skill(fx, cam, ev, game) {
    const p = game.player;
    if (ev.skill === 'bond') {
      // Envol du Bond : poussière au décollage.
      burst(fx, ev.x, ev.y, 14, 200, 0.4, 3.5, '#5a4a52', { drag: 5 });
      addEffect(fx, { type: 'ring', x: ev.x, y: ev.y, r0: 10, r1: 50, color: PAL.heroCape, width: 3, life: 0.2, max: 0.2 });
      addTrauma(cam, 0.12);
      return;
    }
    const spread = ev.skill === 'volee' ? 1.4 : 0.9;
    burst(fx, p.x + Math.cos(ev.angle) * 22, p.y + Math.sin(ev.angle) * 22, 10, 300, 0.25, 2.5, PAL.lance, { dir: ev.angle, spread, streak: 1, drag: 6 });
    addTrauma(cam, 0.1);
  },
  gadget(fx, cam, ev) {
    if (ev.gadget === 'cri') {
      // Cri du bourreau : onde large et froide, sans souffle de cendres (il ne repousse pas).
      addEffect(fx, { type: 'ring', x: ev.x, y: ev.y, r0: 20, r1: ev.r, color: PAL.heroCape, width: 6, life: 0.35, max: 0.35 });
      addEffect(fx, { type: 'ring', x: ev.x, y: ev.y, r0: 10, r1: ev.r * 0.7, color: '#e8fbff', width: 3, life: 0.25, max: 0.25 });
      addTrauma(cam, 0.35);
      zoomKick(cam, 0.02);
      return;
    }
    if (ev.gadget && ev.gadget !== 'nova') {
      // Bombe lancée, piège ou totem posé : petit anneau froid (l'effet vient à l'impact).
      addEffect(fx, { type: 'ring', x: ev.x, y: ev.y, r0: 8, r1: 40, color: PAL.heroCape, width: 2.5, life: 0.2, max: 0.2 });
      burst(fx, ev.x, ev.y, 6, 140, 0.3, 2.5, PAL.lance, { drag: 6 });
      return;
    }
    addEffect(fx, { type: 'nova', x: ev.x, y: ev.y, r: ev.r, life: 0.35, max: 0.35, color: '#ffb36a' });
    burst(fx, ev.x, ev.y, 30, ev.r * 4, 0.5, 3.5, '#8a7a80', { drag: 5 });
    addTrauma(cam, 0.4);
    zoomKick(cam, 0.03);
  },
  super(fx, cam, ev) {
    // Onde de départ : la Nuée a une grande portée de tir, mais son départ reste autour du héros.
    const r = ev.super === 'nuee' ? SUPER_START_RING : ev.r * 1.3;
    addEffect(fx, { type: 'nova', x: ev.x, y: ev.y, r, life: 0.4, max: 0.4, color: PAL.superBar });
    addTrauma(cam, 0.5);
    fx.flash = 0.5;
  },
  superTick(fx, cam, ev) {
    if (ev.super === 'sentence') {
      // Exécution : immense taillade dorée (le 3e coup fait le tour complet).
      addEffect(fx, { type: 'slash', angle: ev.angle, arc: ev.arc, range: ev.r, index: ev.step === 2 ? 1 : 0, strike: true, life: 0.22, max: 0.22, color: PAL.superBar });
      burst(fx, ev.x + Math.cos(ev.angle) * ev.r * 0.6, ev.y + Math.sin(ev.angle) * ev.r * 0.6, 14, 420, 0.35, 3, PAL.superBar, { dir: ev.angle, spread: Math.min(TAU, ev.arc), streak: 1, drag: 6 });
      addTrauma(cam, ev.arc >= TAU - 1e-3 ? 0.7 : 0.4);
      zoomKick(cam, ev.arc >= TAU - 1e-3 ? 0.06 : 0.025);
      return;
    }
    if (ev.super === 'nuee') {
      burst(fx, ev.x + Math.cos(ev.angle) * 18, ev.y + Math.sin(ev.angle) * 18, 3, 240, 0.15, 2, PAL.superBar, { dir: ev.angle, spread: 0.5, streak: 1, drag: 8 });
      return;
    }
    addEffect(fx, { type: 'swirl', x: ev.x, y: ev.y, r: ev.r, life: 0.16, max: 0.16, a0: Math.random() * TAU });
    burst(fx, ev.x, ev.y, 4, ev.r * 3, 0.3, 2.5, PAL.superBar, { drag: 6, streak: 1 });
  },
  dashNova(fx, cam, ev) {
    addEffect(fx, { type: 'ring', x: ev.x, y: ev.y, r0: 10, r1: ev.r, color: '#ff8a4a', width: 4, life: 0.22, max: 0.22 });
  },
  chain(fx, cam, ev) {
    addEffect(fx, { type: 'bolt', x0: ev.x0, y0: ev.y0, x1: ev.x1, y1: ev.y1, life: 0.16, max: 0.16, seed: Math.random() * 1000 });
  },
  pickup(fx, cam, ev) {
    if (ev.kind === 'gold') addText(fx, ev.x, ev.y - 8, `+${ev.amount}`, PAL.gold, 12, 0.5);
    burst(fx, ev.x, ev.y, 4, 90, 0.3, 2, ev.kind === 'gold' ? PAL.gold : PAL.heal, { drag: 6 });
  },
  gold(fx, cam, ev) {
    addText(fx, ev.x, ev.y - 20, `+${ev.amount} or`, PAL.gold, 12, 0.6);
  },
  heal(fx, cam, ev) {
    fx.healAcc += ev.amount;
  },
  wallSlam(fx, cam, ev) {
    burst(fx, ev.x, ev.y, 14, 300, 0.4, 3.5, '#8a7a80', { drag: 5 });
    addText(fx, ev.x, ev.y - 30, 'IMPACT', '#ffb36a', 14, 0.6);
    addTrauma(cam, 0.25);
  },
  chargerWall(fx, cam, ev) {
    burst(fx, ev.x, ev.y, 20, 340, 0.5, 4, '#8a7a80', { drag: 4 });
    addText(fx, ev.x, ev.y - 34, 'SONNÉ', '#ffe14a', 15, 0.9);
    addTrauma(cam, ev.boss ? 0.6 : 0.35);
  },
  spawn(fx, cam, ev) {
    burst(fx, ev.x, ev.y, ev.boss ? 40 : 10, ev.boss ? 300 : 120, 0.6, 4, '#2a1420', { drag: 3 });
  },
  floorEnter(fx, cam, ev) {
    const where = ev.isBoss ? 'Gardien de la section' : `${ev.circleName} · section ${ev.section}`;
    setBanner(fx, `ÉTAGE ${ev.floor}`, where, ev.isBoss ? PAL.danger : PAL.text, 1.2, true);
  },
  roomClear(fx, cam, ev) {
    setBanner(fx, ev.boss ? 'GARDIEN VAINCU' : 'SALLE NETTOYÉE', ev.boss ? 'Un checkpoint s\'éveille' : '', ev.boss ? PAL.gold : PAL.text, 1.6);
  },
  bossPhase(fx, cam) {
    setBanner(fx, 'LE GARDIEN S\'ENRAGE', '', PAL.danger, 1.4);
    addTrauma(cam, 0.7);
    fx.flash = 0.6;
  },
  checkpoint(fx, cam, ev) {
    fx.checkpointFloor = ev.floor;
  },
  boonGain(fx) {
    fx.flash = 0.35;
  },
  immune(fx, cam, ev) {
    if (fx.texts.some((t) => t.text === 'INVULNÉRABLE' && t.life > 0.4)) return;
    addText(fx, ev.x, ev.y - 50, 'INVULNÉRABLE', '#c9c9d6', 13, 0.6);
  },
};

function updateFx(fx, dt, game) {
  // Particules.
  let w = 0;
  for (let i = 0; i < P.n; i++) {
    const life = P.life[i] - dt;
    if (life <= 0) continue;
    const k = Math.exp(-P.drag[i] * dt);
    P.vx[i] *= k;
    P.vy[i] *= k;
    P.x[w] = P.x[i] + P.vx[i] * dt;
    P.y[w] = P.y[i] + P.vy[i] * dt;
    P.vx[w] = P.vx[i];
    P.vy[w] = P.vy[i];
    P.life[w] = life;
    P.max[w] = P.max[i];
    P.size[w] = P.size[i];
    P.drag[w] = P.drag[i];
    P.streak[w] = P.streak[i];
    P.color[w] = P.color[i];
    w++;
  }
  P.n = w;
  for (const t of fx.texts) {
    t.life -= dt;
    t.y += t.vy * dt;
    t.vy *= Math.exp(-3 * dt);
  }
  fx.texts = fx.texts.filter((t) => t.life > 0);
  for (const e of fx.effects) e.life -= dt;
  fx.effects = fx.effects.filter((e) => e.life > 0);
  if (fx.banner) {
    if (fx.banner.untilFight && game?.enemies.some((e) => !e.dead && !(e.spawnT > 0))) fx.banner.life = Math.min(fx.banner.life, BANNER_CUT);
    fx.banner.life -= dt;
    if (fx.banner.life <= 0) fx.banner = null;
  }
  fx.hurtFlash = Math.max(0, fx.hurtFlash - dt * 2.5);
  fx.landT = Math.max(0, fx.landT - dt);
  fx.swingT = Math.max(0, fx.swingT - dt);
  fx.flash = Math.max(0, fx.flash - dt * 2);
  // Soins regroupés : un seul chiffre vert au lieu d'une pluie de « +1 ».
  fx.healT -= dt;
  if (fx.healAcc >= 1 && fx.healT <= 0) {
    const p = game.player;
    addText(fx, p.x, p.y - 30, `+${Math.round(fx.healAcc)}`, PAL.heal, 14, 0.7);
    fx.healAcc = 0;
    fx.healT = 0.4;
  }
  // Fantômes du dash (traînée).
  const p = game.player;
  if (p.state === 'dash') fx.ghosts.push({ x: p.x, y: p.y, facing: p.facing, life: 0.18, max: 0.18 });
  for (const g of fx.ghosts) g.life -= dt;
  fx.ghosts = fx.ghosts.filter((g) => g.life > 0);
  // Braises ambiantes.
  if (Math.random() < 0.35 * fx.quality && game.room) {
    const room = game.room;
    spawnParticle(fx, Math.random() * room.w, room.h + 10, (Math.random() - 0.5) * 20, -30 - Math.random() * 50, 4 + Math.random() * 3, 1.5 + Math.random() * 1.5, Math.random() < 0.5 ? PAL.lava : '#ffb36a', 0.05);
  }
}

function clearFx(fx) {
  P.n = 0;
  fx.texts.length = 0;
  fx.effects.length = 0;
  fx.ghosts.length = 0;
}

function drawParticles(ctx) {
  for (let i = 0; i < P.n; i++) {
    const a = P.life[i] / P.max[i];
    ctx.globalAlpha = a;
    ctx.fillStyle = P.color[i];
    ctx.strokeStyle = P.color[i];
    const s = P.size[i];
    if (P.streak[i]) {
      ctx.lineWidth = s;
      ctx.beginPath();
      ctx.moveTo(P.x[i], P.y[i]);
      ctx.lineTo(P.x[i] - P.vx[i] * 0.03, P.y[i] - P.vy[i] * 0.03);
      ctx.stroke();
    } else {
      ctx.fillRect(P.x[i] - s / 2, P.y[i] - s / 2, s, s);
    }
  }
  ctx.globalAlpha = 1;
}

// Effets « de sol » : dessinés sous les ennemis et le héros (ils ne les ternissent pas).
const GROUND_EFFECTS = new Set(['nova', 'shock']);

/** ground = true : seulement les effets de sol ; false : tous les autres. */
function drawEffects(ctx, fx, game, ground = false) {
  const p = game.player;
  for (const e of fx.effects) {
    if (GROUND_EFFECTS.has(e.type) !== ground) continue;
    const t = 1 - e.life / e.max; // 0 -> 1
    const a = e.life / e.max;
    switch (e.type) {
      case 'slash':
        drawSlash(ctx, p.x, p.y, e, t, a);
        break;
      case 'ring':
        ctx.globalAlpha = a;
        ctx.strokeStyle = e.color;
        ctx.lineWidth = e.width * a + 0.5;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r0 + (e.r1 - e.r0) * t, 0, TAU);
        ctx.stroke();
        break;
      case 'shock':
        ctx.globalAlpha = a * 0.9;
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r * (0.6 + 0.4 * t), 0, TAU);
        ctx.globalAlpha = a * 0.35;
        ctx.fill();
        ctx.globalAlpha = a;
        ctx.strokeStyle = e.edge ?? '#ffd0a0';
        ctx.lineWidth = 4 * a + 1;
        ctx.stroke();
        break;
      case 'nova':
        ctx.globalAlpha = a * 0.12;
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r * t, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = a;
        ctx.strokeStyle = '#fff1d6';
        ctx.lineWidth = 5 * a + 1;
        ctx.stroke();
        break;
      case 'swirl':
        ctx.globalAlpha = a * 0.8;
        ctx.strokeStyle = PAL.superBar;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(p.x, p.y, e.r * 0.85, e.a0 + t * 3, e.a0 + t * 3 + 2.2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(p.x, p.y, e.r * 0.85, e.a0 + Math.PI + t * 3, e.a0 + Math.PI + t * 3 + 2.2);
        ctx.stroke();
        break;
      case 'streak':
        ctx.globalAlpha = a * 0.7;
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.angle);
        ctx.fillStyle = '#ffb08a';
        ctx.fillRect(0, (-e.width / 2) * a, e.length, e.width * a);
        ctx.restore();
        break;
      case 'bolt':
        drawBolt(ctx, e, a);
        break;
      case 'death':
        ctx.globalAlpha = a;
        ctx.fillStyle = t < 0.35 ? PAL.impactRing : e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, Math.max(0.5, e.r * (1 + 0.3 * t) * (1 - t * t)), 0, TAU);
        ctx.fill();
        break;
      default:
        break;
    }
  }
  ctx.globalAlpha = 1;
}

function drawSlash(ctx, px, py, e, t, a) {
  const half = e.arc / 2;
  const heavy = e.index === 2 || e.strike;
  const r = e.range * (0.75 + 0.25 * t);
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(e.angle);
  // Croissant : l'arc balaie de -half à +half (ou l'inverse pour le 2e coup).
  const dir = e.index === 1 ? -1 : 1;
  const sweep = Math.min(1, t * 2.2);
  const a0 = -half * dir;
  const a1 = a0 + e.arc * dir * sweep;
  ctx.globalAlpha = a * 0.95;
  ctx.fillStyle = e.color ?? (e.strike ? PAL.slashStrike : PAL.slash);
  ctx.beginPath();
  ctx.arc(0, 0, r, Math.min(a0, a1), Math.max(a0, a1));
  ctx.arc(0, 0, r * (heavy ? 0.45 : 0.6), Math.max(a0, a1), Math.min(a0, a1), true);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = a * 0.35;
  ctx.fillStyle = PAL.heroCape;
  ctx.beginPath();
  ctx.arc(0, 0, r * 1.08, Math.min(a0, a1), Math.max(a0, a1));
  ctx.arc(0, 0, r * 0.9, Math.max(a0, a1), Math.min(a0, a1), true);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

    for (let j = 0; j < n; j++) {
      const x = i * TILE + 1.5;
      const y = j * TILE + 1.5;
      const w = TILE - 3;
      g.fillStyle = shades[Math.floor(rnd() * shades.length)];
      g.fillRect(x, y, w, w);
      // Biseau discret : lumière en haut à gauche, ombre en bas à droite.
      g.fillStyle = 'rgba(255, 220, 200, 0.035)';
      g.fillRect(x, y, w, 3);
      g.fillRect(x, y, 3, w);
      g.fillStyle = 'rgba(0, 0, 0, 0.18)';
      g.fillRect(x, y + w - 3, w, 3);
      g.fillRect(x + w - 3, y, 3, w);
      // Grain de pierre.
      for (let k = 0; k < 10; k++) {
        g.fillStyle = rnd() < 0.5 ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.025)';
        g.fillRect(x + rnd() * w, y + rnd() * w, 2 + rnd() * 3, 2 + rnd() * 3);
      }
      g.globalAlpha = 0.04;
      g.fillStyle = tint;
      g.fillRect(x, y, w, w);
      g.globalAlpha = 1;
    }
  }
  pat = ctx.createPattern(c, 'repeat');
  cache.tiles.set(tint, pat);
  return pat;
}

function glow(color, radius) {
  const key = `${color}|${radius}`;
  let c = cache.glows.get(key);
  if (c) return c;
  const s = radius * 2;
  c = makeCanvas(s, s);
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(radius, radius, 0, radius, radius, radius);
  grad.addColorStop(0, color);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, s, s);
  cache.glows.set(key, c);
  return c;
}

function drawGlow(ctx, x, y, radius, color, alpha) {
  ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(glow(color, 64), x - radius, y - radius, radius * 2, radius * 2);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

/** Décor procédural d'une salle (fissures, veines de lave), stable pour une salle donnée. */
function roomDeco(room, seed) {
  if (cache.decoRoom === room) return cache.deco;
  let s = seed >>> 0 || 1;
  const rnd = () => {
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    return s / 4294967296;
  };
  const cracks = [];
  for (let i = 0; i < 14; i++) {
    const pts = [[rnd() * room.w, rnd() * room.h]];
    let a = rnd() * TAU;
    for (let k = 0; k < 4; k++) {
      a += (rnd() - 0.5) * 1.4;
      const [x, y] = pts[pts.length - 1];
      pts.push([x + Math.cos(a) * (20 + rnd() * 40), y + Math.sin(a) * (20 + rnd() * 40)]);
    }
    cracks.push({ pts, lava: rnd() < 0.35 });
  }
  const pools = [];
  for (let i = 0; i < 4; i++) pools.push({ x: rnd() * room.w, y: rnd() * room.h, r: 30 + rnd() * 50 });
  cache.deco = { cracks, pools };
  cache.decoRoom = room;
  return cache.deco;
}

// ------------------------------------------------------------------ salle

function drawRoom(ctx, game, time) {
  const room = game.room;
  const tint = CIRCLE_TINTS[(game.info.circle - 1) % CIRCLE_TINTS.length];
  ctx.fillStyle = tilePattern(ctx, tint);
  ctx.fillRect(0, 0, room.w, room.h);
  const deco = roomDeco(room, game.run.floor * 7919 + game.seed);
  for (const pool of deco.pools) drawGlow(ctx, pool.x, pool.y, pool.r * 2, tint, 0.1 + 0.03 * Math.sin(time * 1.3 + pool.x));
  ctx.lineCap = 'round';
  for (const c of deco.cracks) {
    ctx.strokeStyle = c.lava ? tint : PAL.crack;
    ctx.globalAlpha = c.lava ? 0.35 + 0.15 * Math.sin(time * 2 + c.pts[0][0]) : 0.9;
    ctx.lineWidth = c.lava ? 2.5 : 3;
    ctx.beginPath();
    ctx.moveTo(c.pts[0][0], c.pts[0][1]);
    for (let i = 1; i < c.pts.length; i++) ctx.lineTo(c.pts[i][0], c.pts[i][1]);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  drawWalls(ctx, room, tint, time);
  for (const o of room.obstacles) drawPillar(ctx, o);
}

function drawWalls(ctx, room, tint, time) {
  const p = room.pad;
  const out = WALL_OVERDRAW;
  ctx.fillStyle = PAL.wall;
  ctx.fillRect(-out, -out, room.w + 2 * out, out + p);
  ctx.fillRect(-out, room.h - p, room.w + 2 * out, out + p);
  ctx.fillRect(-out, 0, out + p, room.h);
  ctx.fillRect(room.w - p, 0, out + p, room.h);
  ctx.strokeStyle = PAL.wallEdge;
  ctx.lineWidth = 3;
  ctx.strokeRect(p, p, room.w - 2 * p, room.h - 2 * p);
  // Ombre portée des murs vers l'intérieur.
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(p, p, room.w - 2 * p, 18);
  for (const d of room.doors) drawDoor(ctx, d, time);
}

function drawDoor(ctx, d, time) {
  const color = d.reward === 'boon' && d.family ? FAMILIES[d.family].color : REWARD_COLORS[d.reward] ?? CALM_COLORS[d.reward] ?? '#ffffff';
  const cx = d.x + d.w / 2;
  // Arche : fond noir, voûte arrondie en haut.
  const archPath = () => {
    ctx.beginPath();
    ctx.moveTo(d.x, d.y + d.h);
    ctx.lineTo(d.x, d.y + d.w / 2 - 20);
    ctx.arc(cx, d.y + d.w / 2 - 20, d.w / 2, Math.PI, 0);
    ctx.lineTo(d.x + d.w, d.y + d.h);
    ctx.closePath();
  };
  ctx.fillStyle = '#0a0508';
  archPath();
  ctx.fill();
  if (d.open) {
    drawGlow(ctx, cx, d.h - 10, 90, color, 0.35 + 0.1 * Math.sin(time * 4));
    ctx.globalAlpha = 0.45 + 0.1 * Math.sin(time * 3);
    ctx.fillStyle = verticalGradient(ctx, d.y, d.y + d.h, color);
    archPath();
    ctx.fill();
    ctx.globalAlpha = 1;
  } else {
    ctx.strokeStyle = '#3a2a30';
    ctx.lineWidth = 4;
    for (let x = d.x + 14; x < d.x + d.w; x += 18) {
      ctx.beginPath();
      ctx.moveTo(x, d.y);
      ctx.lineTo(x, d.y + d.h);
      ctx.stroke();
    }
  }
  ctx.strokeStyle = d.open ? color : PAL.wallEdge;
  ctx.lineWidth = 4;
  archPath();
  ctx.stroke();
  // Icône de récompense + libellé.
  const label = d.reward === 'boon' && d.family ? FAMILIES[d.family].name : REWARD_LABELS[d.reward];
  const iconColor = d.reward === 'boon' && d.family ? FAMILIES[d.family].color : color;
  drawRewardIcon(ctx, d.reward, cx, d.h + 26, 13, iconColor, time);
  ctx.font = `700 14px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,0,0,0.8)';
  ctx.strokeText(label, cx, d.h + 50);
  ctx.fillStyle = d.open ? iconColor : PAL.textDim;
  ctx.fillText(label, cx, d.h + 50);
}

function drawRewardIcon(ctx, reward, x, y, r, color, time) {
  ctx.save();
  ctx.translate(x, y + Math.sin(time * 3) * 2);
  ctx.fillStyle = color;
  ctx.strokeStyle = 'rgba(0,0,0,0.7)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  switch (reward) {
    case 'boon':
      ctx.arc(0, 0, r, 0, TAU);
      break;
    case 'loot':
    case 'elite':
      ctx.moveTo(0, -r);
      ctx.lineTo(r, 0);
      ctx.lineTo(0, r);
      ctx.lineTo(-r, 0);
      break;
    case 'gold':
      ctx.ellipse(0, 0, r, r * 0.8, 0, 0, TAU);
      break;
    case 'heal':
      ctx.rect(-r * 0.35, -r, r * 0.7, r * 2);
      ctx.rect(-r, -r * 0.35, r * 2, r * 0.7);
      break;
    case 'boss':
      ctx.arc(0, 0, r, 0, TAU);
      ctx.moveTo(-r, -r * 0.4);
      ctx.lineTo(-r * 0.6, -r * 1.4);
      ctx.lineTo(-r * 0.2, -r * 0.6);
      ctx.moveTo(r, -r * 0.4);
      ctx.lineTo(r * 0.6, -r * 1.4);
      ctx.lineTo(r * 0.2, -r * 0.6);
      break;
    case 'town':
      // Portail : anneau (téléportation vers la Ville).
      ctx.arc(0, 0, r, 0, TAU);
      ctx.arc(0, 0, r * 0.55, 0, TAU, true);
      break;
    case 'treasure':
      // Coffre : caisse et couvercle bombé.
      ctx.rect(-r, -r * 0.2, r * 2, r);
      ctx.moveTo(-r, -r * 0.2);
      ctx.quadraticCurveTo(0, -r * 1.3, r, -r * 0.2);
      ctx.closePath();
      break;
    case 'rest':
      // Goutte d'eau (fontaine).
      ctx.moveTo(0, -r * 1.2);
      ctx.quadraticCurveTo(r, 0, r * 0.7, r * 0.45);
      ctx.arc(0, r * 0.2, r * 0.75, 0.35, Math.PI - 0.35);
      ctx.quadraticCurveTo(-r, 0, 0, -r * 1.2);
      break;
    default:
      ctx.rect(-r * 0.8, -r * 0.8, r * 1.6, r * 1.6);
  }
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function drawPillar(ctx, o) {
  const h = 14; // hauteur apparente (fausse 3D vue de dessus)
  ctx.fillStyle = PAL.shadow;
  ctx.fillRect(o.x0 + 6, o.y0 + 10, o.x1 - o.x0, o.y1 - o.y0);
  ctx.fillStyle = PAL.pillarSide;
  ctx.fillRect(o.x0, o.y0, o.x1 - o.x0, o.y1 - o.y0);
  ctx.fillStyle = PAL.pillarTop;
  ctx.fillRect(o.x0, o.y0 - h, o.x1 - o.x0, o.y1 - o.y0);
  ctx.strokeStyle = PAL.wallEdge;
  ctx.lineWidth = 2;
  ctx.strokeRect(o.x0, o.y0 - h, o.x1 - o.x0, o.y1 - o.y0);
}

// ------------------------------------------------------------------ télégraphes

function dangerAlpha(progress) {
  // Clignotement accéléré dans le dernier quart : « ça part ».
  if (progress < 0.75) return 1;
  return 0.75 + 0.25 * Math.sin(progress * 60);
}

function drawCone(ctx, x, y, angle, range, arc, progress) {
  ctx.fillStyle = PAL.dangerFill;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.arc(x, y, range, angle - arc / 2, angle + arc / 2);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = dangerAlpha(progress);
  ctx.fillStyle = PAL.dangerFillHot;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.arc(x, y, range * Math.min(1, progress), angle - arc / 2, angle + arc / 2);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = PAL.danger;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, y, range, angle - arc / 2, angle + arc / 2);
  ctx.stroke();
}

function drawLine(ctx, x, y, angle, length, width, progress) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.fillStyle = PAL.dangerFill;
  ctx.fillRect(0, -width / 2, length, width);
  ctx.globalAlpha = dangerAlpha(progress);
  ctx.fillStyle = PAL.dangerFillHot;
  ctx.fillRect(0, -width / 2, length * Math.min(1, progress), width);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = PAL.danger;
  ctx.lineWidth = 2;
  ctx.strokeRect(0, -width / 2, length, width);
  ctx.restore();
}

function drawCircleDanger(ctx, x, y, r, progress, inner = 0) {
  ctx.fillStyle = PAL.dangerFill;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  if (inner > 0) ctx.arc(x, y, inner, 0, TAU, true);
  ctx.fill();
  ctx.globalAlpha = dangerAlpha(progress);
  ctx.fillStyle = PAL.dangerFillHot;
  ctx.beginPath();
  // Anneau : la jauge part du bord intérieur, le centre (sûr) n'est jamais peint en rouge vif.
  ctx.arc(x, y, Math.max(0.1, inner + (r - inner) * Math.min(1, progress)), 0, TAU);
  if (inner > 0) ctx.arc(x, y, inner, 0, TAU, true);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = PAL.danger;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.stroke();
  if (inner > 0) {
    ctx.beginPath();
    ctx.arc(x, y, inner, 0, TAU);
    ctx.stroke();
  }
}

function drawTelegraphs(ctx, game) {
  for (const h of game.hazards) {
    const pr = hazardProgress(h);
    if (!h.hitsPlayer) continue; // les explosions des bénédictions ne menacent pas le héros
    if (h.burning) continue; // flaque allumée : drawLingeringZones
    if (h.shape === 'circle') drawCircleDanger(ctx, h.x, h.y, h.r, pr);
    else if (h.shape === 'ring') drawCircleDanger(ctx, h.x, h.y, h.r, pr, h.inner);
    else drawLine(ctx, h.x, h.y, h.angle, h.length, h.width, pr);
  }
  for (const e of game.enemies) {
    const t = e.tele;
    if (!t || e.dead) continue;
    if (t.harmless) drawHarmlessCircle(ctx, e.x, e.y, t.r, t.progress);
    else if (t.shape === 'cone') drawCone(ctx, e.x, e.y, t.angle, t.range, t.arc, t.progress);
    else if (t.shape === 'line') drawLine(ctx, e.x, e.y, t.angle, t.length, t.width, t.progress);
    else drawCircleDanger(ctx, e.x, e.y, t.r, t.progress);
  }
}

/** Alerte sans danger (invocation) : violet, sans remplissage rouge. Rouge = ça fait mal. */
function drawHarmlessCircle(ctx, x, y, r, progress) {
  ctx.strokeStyle = PAL.summon;
  ctx.globalAlpha = 0.35 + 0.5 * Math.min(1, progress);
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x, y, Math.max(0.1, r * Math.min(1, progress)), 0, TAU);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

/** Contours seuls des télégraphes, retracés au-dessus du héros et des ennemis : le bord reste lisible. */
function drawTelegraphEdges(ctx, game) {
  ctx.strokeStyle = PAL.danger;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (const h of game.hazards) {
    if (!h.hitsPlayer) continue;
    if (h.shape === 'line') lineEdge(ctx, h.x, h.y, h.angle, h.length, h.width);
    else {
      ctx.moveTo(h.x + h.r, h.y);
      ctx.arc(h.x, h.y, h.r, 0, TAU);
      if (h.shape === 'ring' && h.inner > 0) {
        ctx.moveTo(h.x + h.inner, h.y);
        ctx.arc(h.x, h.y, h.inner, 0, TAU);
      }
    }
  }
  for (const e of game.enemies) {
    const t = e.tele;
    if (!t || e.dead || t.harmless) continue;
    if (t.shape === 'cone') {
      const a0 = t.angle - t.arc / 2;
      ctx.moveTo(e.x + Math.cos(a0) * t.range, e.y + Math.sin(a0) * t.range);
      ctx.arc(e.x, e.y, t.range, a0, t.angle + t.arc / 2);
    } else if (t.shape === 'line') lineEdge(ctx, e.x, e.y, t.angle, t.length, t.width);
    else {
      ctx.moveTo(e.x + t.r, e.y);
      ctx.arc(e.x, e.y, t.r, 0, TAU);
    }
  }
  ctx.stroke();
}

function lineEdge(ctx, x, y, angle, length, width) {
  const c = Math.cos(angle);
  const s = Math.sin(angle);
  const hw = width / 2;
  ctx.moveTo(x - s * hw, y + c * hw);
  ctx.lineTo(x + c * length - s * hw, y + s * length + c * hw);
  ctx.lineTo(x + c * length + s * hw, y + s * length - c * hw);
  ctx.lineTo(x + s * hw, y - c * hw);
  ctx.closePath();
}

// ------------------------------------------------------------------ bestiaire V2 : flaques et champions

const FLAME_TONGUES = 10;
const PUDDLE_FADE = 4; // la flaque pâlit dans le dernier quart de sa vie
const SHIELD_FILL = 'rgba(255, 233, 168, 0.16)';

/**
 * Flaque brûlante (zone persistante allumée, ex. Pyromancienne) : sol embrasé, langues de feu
 * au bord, contour rouge (« ça fait mal »), et une jauge circulaire qui se vide — le temps
 * restant se LIT à l'écran (c'est aussi ce que lisent les bots).
 */
function drawLingeringZones(ctx, game, time) {
  for (const h of game.hazards) {
    if (!h.burning || h.done || !h.hitsPlayer) continue;
    const left = lingerLeft(h);
    const fade = Math.min(1, left * PUDDLE_FADE);
    drawGlow(ctx, h.x, h.y, h.r * 1.6, PAL.lava, 0.35 * fade);
    ctx.globalAlpha = 0.15 + 0.5 * fade;
    ctx.fillStyle = PAL.lavaDim;
    ctx.beginPath();
    ctx.arc(h.x, h.y, h.r, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = (0.3 + 0.12 * Math.sin(time * 9 + h.id)) * fade;
    ctx.fillStyle = PAL.lava;
    ctx.beginPath();
    ctx.arc(h.x, h.y, h.r * 0.82, 0, TAU);
    ctx.fill();
    // Langues de feu qui lèchent le bord : la zone « vit ».
    ctx.globalAlpha = 0.85 * fade;
    ctx.fillStyle = '#ffb03a';
    ctx.beginPath();
    for (let i = 0; i < FLAME_TONGUES; i++) {
      const a = (i / FLAME_TONGUES) * TAU + time * 0.6;
      const tl = h.r * (0.2 + 0.1 * Math.sin(time * 14 + i * 1.7 + h.id));
      const bx = h.x + Math.cos(a) * h.r * 0.92;
      const by = h.y + Math.sin(a) * h.r * 0.92;
      ctx.moveTo(bx + Math.cos(a + 1.57) * 6, by + Math.sin(a + 1.57) * 6);
      ctx.lineTo(bx - Math.cos(a) * tl, by - Math.sin(a) * tl - tl * 0.4);
      ctx.lineTo(bx + Math.cos(a - 1.57) * 6, by + Math.sin(a - 1.57) * 6);
    }
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = PAL.danger;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(h.x, h.y, h.r, 0, TAU);
    ctx.stroke();
    // Jauge du temps restant (se vide dans le sens horaire).
    ctx.strokeStyle = PAL.impactRing;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(h.x, h.y, h.r + 6, -Math.PI / 2, -Math.PI / 2 + left * TAU);
    ctx.stroke();
  }
}

/**
 * Champions V2 par-dessus les corps : rayon de drain du vampirique (du héros vers l'élite),
 * anneau doré d'annonce puis bulle du bouclier, alerte violette inoffensive de l'invocateur.
 */
function drawFoeOverlays(ctx, game, time) {
  const p = game.player;
  const mods = game.tuning.elite.mods;
  for (const e of game.enemies) {
    if (e.dead) continue;
    if (e.leechFlash > 0 && mods.vampirique) {
      const k = Math.min(1, e.leechFlash / mods.vampirique.flash);
      ctx.globalAlpha = 0.9 * k;
      ctx.strokeStyle = PAL.eliteVampirique;
      ctx.lineWidth = 2 + 4 * k;
      ctx.setLineDash([10, 6]);
      ctx.lineDashOffset = -time * 120; // le sang coule vers l'élite
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(e.x, e.y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      drawGlow(ctx, e.x, e.y, e.r * 2.4, PAL.eliteVampirique, 0.55 * k);
    }
    if (e.modPhase === 'warn' && e.modDur > 0) {
      const k = Math.min(1, 1 - e.modT / e.modDur);
      ctx.globalAlpha = 0.4 + 0.5 * k;
      ctx.strokeStyle = PAL.eliteBouclier;
      ctx.lineWidth = 2.5;
      ctx.setLineDash([5, 5]);
      ctx.lineDashOffset = time * 40;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 22 - 10 * k, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }
    if (e.invuln > 0 && !e.boss) {
      const br = e.r + 12;
      ctx.fillStyle = SHIELD_FILL;
      ctx.strokeStyle = PAL.eliteBouclier;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(e.x, e.y, br, 0, TAU);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = '#ffffff';
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(e.x, e.y, br - 5, -2.4 + Math.sin(time * 3) * 0.2, -1.4 + Math.sin(time * 3) * 0.2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (e.modPhase === 'channel' && e.modDur > 0 && mods.invocateur) {
      drawHarmlessCircle(ctx, e.x, e.y, mods.invocateur.channelRadius, Math.min(1, 1 - e.modT / e.modDur));
    }
  }
}

function drawSpawnWarns(ctx, game, time) {
  for (const s of game.spawns) {
    const k = 1 - s.t / s.warn;
    const r = 18 + 14 * k;
    ctx.strokeStyle = s.elite ? PAL.eliteArdent : '#c0304a';
    ctx.globalAlpha = 0.4 + 0.5 * k;
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.lineDashOffset = -time * 40;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(s.x, s.y, r * 0.55, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1;
    drawGlow(ctx, s.x, s.y, r * 2, '#ff2a4a', 0.25 * k);
  }
}

// ------------------------------------------------------------------ objets et butin

function drawPickups(ctx, game, time) {
  for (const pk of game.pickups) {
    if (pk.kind === 'gold') {
      ctx.save();
      ctx.translate(pk.x, pk.y);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = PAL.gold;
      ctx.fillRect(-4, -4, 8, 8);
      ctx.restore();
      if ((time * 4 + pk.id) % 3 < 0.2) drawGlow(ctx, pk.x, pk.y, 14, PAL.gold, 0.6);
    } else {
      drawGlow(ctx, pk.x, pk.y, 26, PAL.heal, 0.5);
      ctx.fillStyle = PAL.heal;
      ctx.fillRect(pk.x - 3, pk.y - 9, 6, 18);
      ctx.fillRect(pk.x - 9, pk.y - 3, 18, 6);
    }
  }
}

function drawInteract(ctx, game, time) {
  const it = game.room.interact;
  if (!it || it.used) return;
  const bob = Math.sin(time * 3) * 4;
  let color = '#ffffff';
  let label = '';
  if (it.kind === 'boon') {
    color = FAMILIES[it.family].color;
    label = `Bénédiction · ${FAMILIES[it.family].name}`;
    drawGlow(ctx, it.x, it.y + bob, 70, color, 0.55);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(it.x, it.y + bob, 15, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(it.x, it.y + bob, 22 + 3 * Math.sin(time * 5), 0, TAU);
    ctx.stroke();
  } else if (it.kind === 'loot') {
    const rar = ITEM_RARITIES.find((r) => r.id === it.item.rarity);
    color = rar.color;
    label = it.item.name;
    // Colonne de lumière façon Diablo, plus haute pour les raretés élevées.
    const idx = ITEM_RARITIES.indexOf(rar);
    const h = 60 + idx * 50;
    ctx.globalAlpha = 0.35 + 0.1 * Math.sin(time * 4);
    ctx.fillStyle = verticalGradient(ctx, it.y - h, it.y, color);
    ctx.fillRect(it.x - 10, it.y - h, 20, h);
    ctx.globalAlpha = 1;
    drawGlow(ctx, it.x, it.y, 40, color, 0.5);
    drawItemGlyph(ctx, it.item.slot, it.x, it.y + bob * 0.5, color);
  } else if (it.kind === 'shop') {
    color = '#7fe8ff';
    label = 'Marchand des âmes';
    ctx.fillStyle = '#3a2430';
    ctx.fillRect(it.x - 46, it.y - 6, 92, 26);
    ctx.fillStyle = '#5a3a44';
    ctx.fillRect(it.x - 50, it.y - 12, 100, 8);
    ctx.fillStyle = '#18101a';
    ctx.beginPath();
    ctx.arc(it.x, it.y - 30, 16, 0, TAU);
    ctx.fill();
    ctx.fillStyle = color;
    ctx.fillRect(it.x - 6, it.y - 34, 3, 3);
    ctx.fillRect(it.x + 3, it.y - 34, 3, 3);
    drawGlow(ctx, it.x, it.y - 20, 50, color, 0.25);
  } else if (it.kind === 'event') {
    color = '#b98cff';
    label = 'Autel';
    ctx.fillStyle = '#2e2433';
    ctx.fillRect(it.x - 30, it.y - 14, 60, 28);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.strokeRect(it.x - 30, it.y - 14, 60, 28);
    drawGlow(ctx, it.x, it.y - 10, 60, color, 0.35 + 0.15 * Math.sin(time * 3));
  } else if (it.kind === 'treasure') {
    color = CALM_COLORS.treasure;
    label = 'Chambre forte';
    drawChest(ctx, it.x, it.y, color, time);
  } else if (it.kind === 'rest') {
    color = CALM_COLORS.rest;
    label = 'Fontaine du Léthé';
    drawFountain(ctx, it.x, it.y, color, time);
  }
  ctx.font = `700 14px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,0,0,0.85)';
  ctx.strokeText(label, it.x, it.y + 40);
  ctx.fillStyle = color;
  ctx.fillText(label, it.x, it.y + 40);
}

/** Coffre scellé de la chambre forte : caisse, couvercle, ferrures et sceau qui pulse. */
function drawChest(ctx, x, y, color, time) {
  drawGlow(ctx, x, y - 6, 70, color, 0.3 + 0.1 * Math.sin(time * 2.5));
  ctx.fillStyle = PAL.shadow;
  ctx.fillRect(x - 30, y + 12, 64, 10);
  ctx.fillStyle = '#4a2a1a';
  ctx.fillRect(x - 32, y - 8, 64, 26);
  ctx.beginPath();
  ctx.moveTo(x - 32, y - 8);
  ctx.quadraticCurveTo(x, y - 34, x + 32, y - 8);
  ctx.closePath();
  ctx.fillStyle = '#5e3620';
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.strokeRect(x - 32, y - 8, 64, 26);
  ctx.beginPath();
  ctx.moveTo(x - 32, y - 8);
  ctx.quadraticCurveTo(x, y - 34, x + 32, y - 8);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.fillRect(x - 6, y - 12, 12, 14);
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time * 4);
  ctx.fillStyle = '#fff4c0';
  ctx.fillRect(x - 2, y - 8, 4, 6);
  ctx.globalAlpha = 1;
}

/** Fontaine du repos : vasque de pierre, eau claire qui ondule (jamais rouge : rien ne blesse). */
function drawFountain(ctx, x, y, color, time) {
  drawGlow(ctx, x, y - 4, 80, color, 0.3 + 0.1 * Math.sin(time * 2));
  ctx.fillStyle = PAL.shadow;
  ctx.beginPath();
  ctx.ellipse(x + 4, y + 16, 40, 12, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#3a3440';
  ctx.beginPath();
  ctx.ellipse(x, y + 4, 38, 18, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.75;
  ctx.beginPath();
  ctx.ellipse(x, y + 2, 30, 12, 0, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#e8fbff';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 2; i++) {
    const k = (time * 0.8 + i * 0.5) % 1;
    ctx.globalAlpha = 1 - k;
    ctx.beginPath();
    ctx.ellipse(x, y + 2, 6 + 22 * k, 2 + 9 * k, 0, 0, TAU);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#5a5262';
  ctx.fillRect(x - 5, y - 26, 10, 26);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y - 28, 5 + Math.sin(time * 5), 0, TAU);
  ctx.fill();
}

function drawItemGlyph(ctx, slot, x, y, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.strokeStyle = '#120a0e';
  ctx.lineWidth = 2;
  ctx.beginPath();
  if (slot === 'arme') {
    ctx.rotate(-Math.PI / 4);
    ctx.rect(-3, -18, 6, 26);
    ctx.rect(-9, 6, 18, 4);
    ctx.rect(-2, 10, 4, 8);
  } else if (slot === 'armure') {
    ctx.moveTo(-14, -12);
    ctx.lineTo(14, -12);
    ctx.lineTo(10, 14);
    ctx.lineTo(-10, 14);
    ctx.closePath();
  } else {
    ctx.arc(0, 0, 10, 0, TAU);
    ctx.moveTo(4, 0);
    ctx.arc(0, 0, 4, 0, TAU, true);
  }
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

// ------------------------------------------------------------------ créatures

const ENEMY_BODY = { imp: PAL.imp, archer: PAL.archer, brute: PAL.brute, charger: PAL.charger, exploder: PAL.exploder, gardien: PAL.boss };

function drawShadow(ctx, x, y, r) {
  ctx.fillStyle = PAL.shadow;
  ctx.beginPath();
  ctx.ellipse(x, y + r * 0.55, r * 1.05, r * 0.5, 0, 0, TAU);
  ctx.fill();
}

function drawEnemy(ctx, e, game, time) {
  let scale = 1;
  let alpha = 1;
  if (e.spawnT > 0) {
    // Apparition « easeOutBack » : 0 -> 1,15 -> 1.
    const k = 1 - Math.max(0, e.spawnT) / 0.25;
    const s = 1.70158;
    scale = Math.max(0.05, 1 + (s + 1) * (k - 1) ** 3 + s * (k - 1) ** 2);
    alpha = 0.5 + 0.5 * k;
  }
  if (e.state === 'windup') scale *= 1 + 0.1 * Math.sin(e.stateTime * 30);
  const r = e.r * scale;
  const face = Math.atan2(game.player.y - e.y, game.player.x - e.x);
  drawShadow(ctx, e.x, e.y, r);
  if (e.eliteMod) {
    const ec = ELITE_COLORS[e.eliteMod];
    drawGlow(ctx, e.x, e.y, r * 2.6, ec, 0.45);
    ctx.strokeStyle = ec;
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 6]);
    ctx.lineDashOffset = -time * 30;
    ctx.beginPath();
    ctx.arc(e.x, e.y, r + 7, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  if (e.boss) drawGlow(ctx, e.x, e.y, r * 2.4, e.phase === 2 ? '#ff3a1a' : '#8a1a3a', 0.5 + 0.15 * Math.sin(time * 5));
  if (e.kind === 'exploder' && e.state === 'windup') drawGlow(ctx, e.x, e.y, r * 4, '#ff9c2a', 0.4 + 0.4 * Math.sin(e.stateTime * 40));
  ctx.globalAlpha = alpha;
  ctx.save();
  ctx.translate(e.x, e.y);
  if (e.flash > 0 && (e.hitDirX || e.hitDirY)) {
    // Touché : tremblement le long de l'axe du coup pendant le gel (principe de Sakurai),
    // puis écrasement dans l'axe (aire conservée).
    const a = Math.atan2(e.hitDirY, e.hitDirX);
    const jitter = game.hitstop > 0 || e.freeze > 0 ? (Math.floor(time * 60) % 2 === 0 ? 2 : -2) : 0;
    ctx.translate(Math.cos(a) * jitter, Math.sin(a) * jitter);
    if (!e.boss) {
      ctx.rotate(a);
      ctx.scale(0.8, 1.25);
      ctx.rotate(-a);
    }
  }
  const body = e.flash > 0 ? PAL.enemyFlash : ENEMY_BODY[e.kind] ?? EXTRA_BODY[e.kind] ?? PAL.imp;
  (KIND_DRAW[e.kind] ?? EXTRA_ART[e.kind] ?? KIND_DRAW.imp)(ctx, r, face, body, e, time);
  ctx.restore();
  ctx.globalAlpha = 1;
  if (e.chill > 0) {
    ctx.strokeStyle = '#8fd8ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(e.x, e.y, r + 3, 0, TAU);
    ctx.stroke();
  }
  if (e.burn > 0) drawGlow(ctx, e.x, e.y - r * 0.5, r * 1.6, PAL.lava, 0.45 + 0.2 * Math.sin(time * 20 + e.id));
  if (e.stun > 0) drawStun(ctx, e.x, e.y - r - 10, time);
  if (!e.boss && (e.hp < e.maxHp || e.eliteMod)) drawEnemyHp(ctx, e, r);
  if (e.eliteMod) {
    ctx.font = `800 11px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.fillStyle = ELITE_COLORS[e.eliteMod];
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.lineWidth = 3;
    const label = ELITE_NAMES[e.eliteMod].toUpperCase();
    ctx.strokeText(label, e.x, e.y - r - 22);
    ctx.fillText(label, e.x, e.y - r - 22);
  }
}

function outlineCircle(ctx, r, fill) {
  ctx.fillStyle = fill;
  ctx.strokeStyle = PAL.enemyOutline;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, TAU);
  ctx.fill();
  ctx.stroke();
}

function eyes(ctx, r, face, color = '#ffe14a', spread = 0.45, dist = 0.45) {
  ctx.fillStyle = color;
  for (const s of [-spread, spread]) {
    const a = face + s;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * r * dist, Math.sin(a) * r * dist, Math.max(1.5, r * 0.13), 0, TAU);
    ctx.fill();
  }
}

function horns(ctx, r, face, color, size = 0.6) {
  ctx.fillStyle = color;
  ctx.strokeStyle = PAL.enemyOutline;
  ctx.lineWidth = 2;
  for (const s of [-0.8, 0.8]) {
    const a = face + s;
    const bx = Math.cos(a) * r * 0.8;
    const by = Math.sin(a) * r * 0.8;
    ctx.beginPath();
    ctx.moveTo(bx + Math.cos(a + 1.6) * r * 0.25, by + Math.sin(a + 1.6) * r * 0.25);
    ctx.lineTo(bx + Math.cos(face + s * 0.6) * r * size, by + Math.sin(face + s * 0.6) * r * size);
    ctx.lineTo(bx + Math.cos(a - 1.6) * r * 0.25, by + Math.sin(a - 1.6) * r * 0.25);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
}

const KIND_DRAW = {
  imp(ctx, r, face, body) {
    horns(ctx, r, face, '#2a0a0a', 0.7);
    outlineCircle(ctx, r, body);
    eyes(ctx, r, face);
  },
  archer(ctx, r, face, body, e) {
    outlineCircle(ctx, r, body);
    ctx.fillStyle = '#5b4436';
    ctx.beginPath();
    ctx.arc(-Math.cos(face) * r * 0.2, -Math.sin(face) * r * 0.2, r * 0.48, 0, TAU);
    ctx.fill();
    eyes(ctx, r, face, '#ff3b3b', 0.4, 0.4);
    // Arc tendu pendant la visée.
    const draw = e.state === 'windup' ? Math.min(1, e.stateTime / 0.4) : 0;
    ctx.strokeStyle = '#8a6a4a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(Math.cos(face) * r * (0.6 - 0.3 * draw), Math.sin(face) * r * (0.6 - 0.3 * draw), r * 0.9, face - 1.1, face + 1.1);
    ctx.stroke();
  },
  brute(ctx, r, face, body, e) {
    const raise = e.state === 'windup' ? 1.25 : 1;
    ctx.fillStyle = '#5a1a1a';
    ctx.strokeStyle = PAL.enemyOutline;
    ctx.lineWidth = 3;
    for (const s of [-1.3, 1.3]) {
      const a = face + s;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * r * 0.85 * raise, Math.sin(a) * r * 0.85 * raise, r * 0.45, 0, TAU);
      ctx.fill();
      ctx.stroke();
    }
    outlineCircle(ctx, r, body);
    eyes(ctx, r, face, '#ffb03a', 0.35, 0.55);
  },
  charger(ctx, r, face, body, e) {
    horns(ctx, r, face, '#f0e0c0', e.state === 'charge' ? 1.5 : 1.2);
    outlineCircle(ctx, r, body);
    eyes(ctx, r, face, '#fff3a0', 0.5, 0.5);
  },
  exploder(ctx, r, face, body, e, time) {
    const pulse = e.state === 'windup' ? (Math.sin(e.stateTime * 40) > 0 ? '#ffffff' : body) : body;
    outlineCircle(ctx, r, pulse);
    ctx.strokeStyle = '#5a1a00';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = i * 1.7 + time;
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * r * 0.9, Math.sin(a) * r * 0.9);
    }
    ctx.stroke();
  },
  gardien(ctx, r, face, body, e, time) {
    // Couronne de pointes dorées.
    ctx.fillStyle = PAL.bossTrim;
    ctx.strokeStyle = PAL.enemyOutline;
    ctx.lineWidth = 3;
    ctx.beginPath();
    const spikes = 9;
    for (let i = 0; i < spikes; i++) {
      const a = (i / spikes) * TAU + time * 0.3;
      ctx.moveTo(Math.cos(a - 0.18) * r, Math.sin(a - 0.18) * r);
      ctx.lineTo(Math.cos(a) * r * 1.35, Math.sin(a) * r * 1.35);
      ctx.lineTo(Math.cos(a + 0.18) * r, Math.sin(a + 0.18) * r);
    }
    ctx.fill();
    ctx.stroke();
    outlineCircle(ctx, r, body);
    ctx.fillStyle = '#2a0610';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.62, 0, TAU);
    ctx.fill();
    eyes(ctx, r, face, e.phase === 2 ? '#ff3a1a' : '#ffcf5a', 0.42, 0.35);
  },
};

function drawStun(ctx, x, y, time) {
  ctx.fillStyle = '#ffe14a';
  for (let i = 0; i < 3; i++) {
    const a = time * 6 + (i * TAU) / 3;
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * 12, y + Math.sin(a) * 4, 3, 0, TAU);
    ctx.fill();
  }
}

function drawEnemyHp(ctx, e, r) {
  const w = Math.max(28, r * 2.2);
  const x = e.x - w / 2;
  const y = e.y - r - 12;
  ctx.fillStyle = PAL.hpBack;
  ctx.fillRect(x, y, w, 5);
  ctx.fillStyle = e.eliteMod ? ELITE_COLORS[e.eliteMod] : PAL.hpBar;
  ctx.fillRect(x, y, (w * Math.max(0, e.hp)) / e.maxHp, 5);
}

function playerAlpha(p, time) {
  if (p.state === 'dead') return Math.max(0, 1 - p.stateTime);
  if (p.iframes > 0 && p.state !== 'dash' && p.hurtFlash <= 0 && Math.floor(time * 15) % 2 === 0) return 0.4;
  return 1;
}

/**
 * Traînées de dash, ombre et halos du héros : dessinés SOUS les télégraphes, sinon leur
 * mélange additif délave le rouge exactement là où l'attaque va frapper.
 */
function drawPlayerUnderlay(ctx, game, fx, time) {
  const p = game.player;
  const pr = p.r * HERO_VISUAL;
  drawHeroZones(ctx, game, time);
  for (const g of fx.ghosts) {
    ctx.globalAlpha = (g.life / g.max) * 0.45;
    ctx.fillStyle = PAL.heroCape;
    ctx.beginPath();
    ctx.arc(g.x, g.y, pr * 0.95, 0, TAU);
    ctx.fill();
  }
  const a = playerAlpha(p, time);
  ctx.globalAlpha = a;
  drawShadow(ctx, p.x, p.y, pr);
  drawGlow(ctx, p.x, p.y, 60, PAL.heroGlow, 0.9 * a);
  if (p.state === 'super') drawGlow(ctx, p.x, p.y, 150, PAL.superBar, (0.4 + 0.2 * Math.sin(time * 18)) * a);
  ctx.globalAlpha = 1;
}

function drawPlayer(ctx, game, fx, time) {
  const p = game.player;
  const pr = p.r * HERO_VISUAL;
  ctx.globalAlpha = playerAlpha(p, time);
  ctx.save();
  ctx.translate(p.x, p.y);
  const f = p.facing;
  const speed = Math.hypot(p.vx, p.vy);
  // Cape qui flotte à l'opposé du mouvement.
  const capeLen = pr * (1.1 + Math.min(1, speed / 400) * 0.8);
  ctx.fillStyle = PAL.heroCape;
  ctx.beginPath();
  ctx.moveTo(Math.cos(f + 1.9) * pr * 0.9, Math.sin(f + 1.9) * pr * 0.9);
  ctx.quadraticCurveTo(Math.cos(f + Math.PI) * capeLen * 1.3 + Math.sin(time * 12) * 3, Math.sin(f + Math.PI) * capeLen * 1.3, Math.cos(f - 1.9) * pr * 0.9, Math.sin(f - 1.9) * pr * 0.9);
  ctx.closePath();
  ctx.fill();
  // Étirement (dash, frappe) et écrasement (sortie de dash), aire conservée.
  let sx = 1;
  let axis = f;
  if (p.state === 'dash') sx = 1.35;
  else if (fx.landT > 0) {
    sx = 0.82;
    axis = Math.atan2(p.dashDirY, p.dashDirX);
  } else if (fx.swingT > 0) {
    sx = 1.18;
    axis = fx.swingAngle;
  }
  if (sx !== 1) {
    ctx.rotate(axis);
    ctx.scale(sx, 1 / sx);
    ctx.rotate(-axis);
  }
  ctx.fillStyle = p.hurtFlash > 0 ? PAL.heroHurt : PAL.hero;
  ctx.strokeStyle = PAL.heroCape; // liseré propre au héros : on ne le confond avec aucun ennemi flashé
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.arc(0, 0, pr, 0, TAU);
  ctx.fill();
  ctx.stroke();
  // Visière orientée.
  ctx.fillStyle = '#0d2a36';
  ctx.beginPath();
  ctx.arc(Math.cos(f) * pr * 0.35, Math.sin(f) * pr * 0.35, pr * 0.42, f - 1.2, f + 1.2);
  ctx.closePath();
  ctx.fill();
  drawClassAccent(ctx, game.kit?.classId, f, pr, time);
  drawWeapon(ctx, game, p, pr);
  ctx.restore();
  ctx.globalAlpha = 1;
}

// Silhouette de classe : un détail sombre et froid sur le corps (le héros reste cyan et blanc).
const CLASS_ACCENT = '#123c4c';

function drawClassAccent(ctx, classId, f, pr, time) {
  if (classId === 'bourreau') {
    // Cagoule de bourreau : calotte sombre sur l'arrière du crâne, deux pointes.
    ctx.fillStyle = CLASS_ACCENT;
    ctx.beginPath();
    ctx.arc(0, 0, pr * 0.98, f + 1.5, f + Math.PI * 2 - 1.5);
    ctx.closePath();
    ctx.fill();
    for (const s of [-1, 1]) {
      const a = f + Math.PI + s * 0.75;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - 0.25) * pr * 0.9, Math.sin(a - 0.25) * pr * 0.9);
      ctx.lineTo(Math.cos(a) * pr * 1.45, Math.sin(a) * pr * 1.45);
      ctx.lineTo(Math.cos(a + 0.25) * pr * 0.9, Math.sin(a + 0.25) * pr * 0.9);
      ctx.closePath();
      ctx.fill();
    }
  } else if (classId === 'chasseresse') {
    // Carquois dans le dos et mèche qui flotte.
    const b = f + Math.PI;
    ctx.save();
    ctx.rotate(b + 0.5);
    ctx.fillStyle = CLASS_ACCENT;
    ctx.fillRect(pr * 0.35, -pr * 0.22, pr * 0.95, pr * 0.44);
    ctx.fillStyle = PAL.hero;
    for (let i = 0; i < 3; i++) ctx.fillRect(pr * 1.25, -pr * 0.18 + i * pr * 0.16, pr * 0.22, pr * 0.06);
    ctx.restore();
    ctx.strokeStyle = PAL.heroCape;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(Math.cos(b - 0.4) * pr * 0.8, Math.sin(b - 0.4) * pr * 0.8);
    ctx.quadraticCurveTo(Math.cos(b - 0.2) * pr * 1.5, Math.sin(b - 0.2) * pr * 1.5 + Math.sin(time * 10) * 2, Math.cos(b - 0.5) * pr * 1.9, Math.sin(b - 0.5) * pr * 1.9);
    ctx.stroke();
  }
}

/** Arme portée (forme selon le type d'arme) ; la Lame garde son dessin d'origine. */
function drawWeapon(ctx, game, p, pr) {
  const wt = game.kit?.weaponType;

    // Gardien enchaîné (bouclier tenu par ses serviteurs) : barre violette, consigne explicite.
    const barColor = boss.shielded ? PAL.summon : boss.phase === 1 ? '#c0304a' : '#ff4a1a';
    bar(ctx, cx - bw / 2, y + 14, bw, 14, boss.hp / boss.maxHp, barColor);
    const name = game.tuning.boss[boss.kind].name;
    text(ctx, boss.shielded ? `${name} — ENCHAÎNÉ : abats ses geôliers` : name, cx, y + 21, 10, PAL.bossTrim, 'center', 800);
    return;
  }
  // Six pastilles = la section ; la dernière est le Gardien.
  const n = game.tuning.floors.sectionLength;
  const step = 16;
  const x0 = cx - ((n - 1) * step) / 2;
  for (let i = 1; i <= n; i++) {
    const px = x0 + (i - 1) * step;
    const done = i < info.indexInSection;
    const cur = i === info.indexInSection;
    ctx.fillStyle = i === n ? (done || cur ? PAL.danger : '#5a1a22') : done ? PAL.text : cur ? PAL.gold : '#3a2a30';
    ctx.beginPath();
    ctx.arc(px, y + 18, i === n ? 5 : 3.5, 0, TAU);
    ctx.fill();
  }
  text(ctx, info.circleName, cx, y + 33, 11, PAL.textDim, 'center', 600);
}

function drawTopRight(ctx, game, w, safe) {
  const x = w - EDGE - safe.right - 52;
  const y = EDGE + safe.top + 8;
  text(ctx, `${game.run.gold}`, x - 8, y, 15, PAL.gold, 'right', 800);
  ctx.save();
  ctx.translate(x + 2, y);
  ctx.rotate(Math.PI / 4);
  ctx.fillStyle = PAL.gold;
  ctx.fillRect(-5, -5, 10, 10);
  ctx.restore();
  // Âmes (PERMANENTES) sous la bourse : on les voit monter pendant la descente.
  if (!game.sandbox && !game.practice) text(ctx, `◆ ${game.meta.souls}`, x + 8, y + 20, 12, '#9ff4ff', 'right', 800);
  // Bouton pause (zone gérée par main).
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath();
  ctx.arc(w - EDGE - safe.right - 18, y + 4, 17, 0, TAU);
  ctx.fill();
  ctx.fillStyle = PAL.text;
  ctx.fillRect(w - EDGE - safe.right - 24, y - 3, 4, 14);
  ctx.fillRect(w - EDGE - safe.right - 16, y - 3, 4, 14);
}

/** Zone du bouton pause, en px CSS (pour main). */
function pauseButtonRect(w, safe) {
  const x = w - EDGE - safe.right - 18;
  const y = EDGE + safe.top + 12;
  return { x, y, r: 26 };
}

// ------------------------------------------------------------------ contrôles tactiles

const ICONS = {
  attack(ctx, r) {
    ctx.rotate(-Math.PI / 4);
    ctx.fillRect(-r * 0.09, -r * 0.55, r * 0.18, r * 0.8);
    ctx.fillRect(-r * 0.3, r * 0.22, r * 0.6, r * 0.1);
    ctx.fillRect(-r * 0.07, r * 0.3, r * 0.14, r * 0.22);
  },
  dash(ctx, r) {
    for (const o of [-0.22, 0.12]) {
      ctx.beginPath();
      ctx.moveTo(r * (o - 0.1), -r * 0.35);
      ctx.lineTo(r * (o + 0.22), 0);
      ctx.lineTo(r * (o - 0.1), r * 0.35);
      ctx.lineTo(r * (o - 0.0), 0);
      ctx.closePath();
      ctx.fill();
    }
  },
  skill(ctx, r) {
    ctx.rotate(-Math.PI / 4);
    ctx.fillRect(-r * 0.05, -r * 0.5, r * 0.1, r * 1.0);
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.62);
    ctx.lineTo(r * 0.16, -r * 0.38);
    ctx.lineTo(-r * 0.16, -r * 0.38);
    ctx.closePath();
    ctx.fill();
  },
  gadget(ctx, r) {
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU;
      ctx.fillRect(Math.cos(a) * r * 0.3 - 2, Math.sin(a) * r * 0.3 - 2, 4, 4);
    }
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.18, 0, TAU);
    ctx.fill();
  },
  super(ctx, r) {
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.5);
    ctx.quadraticCurveTo(r * 0.45, -r * 0.05, r * 0.2, r * 0.45);
    ctx.quadraticCurveTo(0, r * 0.2, -r * 0.2, r * 0.45);
    ctx.quadraticCurveTo(-r * 0.45, -r * 0.05, 0, -r * 0.5);
    ctx.fill();
  },
  // ---- pictogrammes des kits (champ `icon` des entrées de kits.mjs)
  daggers(ctx, r) {
    for (const s of [-1, 1]) {
      ctx.save();
      ctx.rotate(s * Math.PI / 5);
      ctx.fillRect(-r * 0.06, -r * 0.5, r * 0.12, r * 0.55);
      ctx.fillRect(-r * 0.18, r * 0.05, r * 0.36, r * 0.08);
      ctx.fillRect(-r * 0.05, r * 0.13, r * 0.1, r * 0.2);
      ctx.restore();
    }
  },
  axe(ctx, r) {
    ctx.rotate(-Math.PI / 4);
    ctx.fillRect(-r * 0.05, -r * 0.5, r * 0.1, r * 1.0);
    ctx.beginPath();
    ctx.moveTo(r * 0.05, -r * 0.45);
    ctx.quadraticCurveTo(r * 0.55, -r * 0.35, r * 0.45, r * 0.05);
    ctx.lineTo(r * 0.05, -r * 0.1);
    ctx.closePath();
    ctx.fill();
  },
  hammer(ctx, r) {
    ctx.rotate(-Math.PI / 4);
    ctx.fillRect(-r * 0.05, -r * 0.3, r * 0.1, r * 0.85);
    ctx.fillRect(-r * 0.36, -r * 0.55, r * 0.72, r * 0.3);
  },
  bow(ctx, r) {
    ctx.strokeStyle = ctx.fillStyle;
    ctx.lineWidth = r * 0.1;
    ctx.beginPath();
    ctx.arc(-r * 0.25, 0, r * 0.55, -1.1, 1.1);
    ctx.stroke();
    ctx.lineWidth = r * 0.04;
    ctx.beginPath();
    ctx.moveTo(-r * 0.25 + Math.cos(1.1) * r * 0.55, Math.sin(1.1) * r * 0.55);
    ctx.lineTo(-r * 0.25 + Math.cos(-1.1) * r * 0.55, Math.sin(-1.1) * r * 0.55);
    ctx.stroke();
    ctx.fillRect(-r * 0.3, -r * 0.035, r * 0.75, r * 0.07);
    ctx.beginPath();
    ctx.moveTo(r * 0.55, 0);
    ctx.lineTo(r * 0.38, -r * 0.12);
    ctx.lineTo(r * 0.38, r * 0.12);
    ctx.closePath();
    ctx.fill();
  },
  crossbow(ctx, r) {
    ctx.fillRect(-r * 0.45, -r * 0.06, r * 0.9, r * 0.12);
    ctx.strokeStyle = ctx.fillStyle;
    ctx.lineWidth = r * 0.1;
    ctx.beginPath();
    ctx.arc(r * 0.05, r * 0.45, r * 0.55, -Math.PI * 0.8, -Math.PI * 0.2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(r * 0.55, 0);
    ctx.lineTo(r * 0.38, -r * 0.13);
    ctx.lineTo(r * 0.38, r * 0.13);
    ctx.closePath();
    ctx.fill();
  },
  chain(ctx, r) {
    ctx.strokeStyle = ctx.fillStyle;
    ctx.lineWidth = r * 0.09;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.ellipse(-r * 0.36 + i * r * 0.3, r * 0.2 - i * r * 0.2, r * 0.17, r * 0.1, -Math.PI / 4, 0, TAU);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(r * 0.38, -r * 0.3, r * 0.2, Math.PI * 0.9, Math.PI * 2.1);
    ctx.stroke();
  },
  leap(ctx, r) {
    ctx.strokeStyle = ctx.fillStyle;
    ctx.lineWidth = r * 0.1;
    ctx.beginPath();
    ctx.moveTo(-r * 0.5, r * 0.3);
    ctx.quadraticCurveTo(0, -r * 0.75, r * 0.4, r * 0.15);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(r * 0.5, r * 0.35);
    ctx.lineTo(r * 0.22, r * 0.18);
    ctx.lineTo(r * 0.5, r * 0.02);
    ctx.closePath();
    ctx.fill();
    ctx.fillRect(-r * 0.55, r * 0.42, r * 1.1, r * 0.08);
  },
  fire(ctx, r) {
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.55);
    ctx.quadraticCurveTo(r * 0.5, -r * 0.1, r * 0.3, r * 0.35);
    ctx.quadraticCurveTo(r * 0.15, r * 0.5, 0, r * 0.5);
    ctx.quadraticCurveTo(-r * 0.15, r * 0.5, -r * 0.3, r * 0.35);
    ctx.quadraticCurveTo(-r * 0.45, 0, -r * 0.1, -r * 0.2);
    ctx.quadraticCurveTo(-r * 0.05, -r * 0.35, 0, -r * 0.55);
    ctx.fill();
  },
  fan(ctx, r) {
    for (let i = 0; i < 5; i++) {
      ctx.save();
      ctx.rotate(-Math.PI / 2 + (i - 2) * 0.32);
      ctx.fillRect(0, -r * 0.035, r * 0.55, r * 0.07);
      ctx.beginPath();
      ctx.moveTo(r * 0.62, 0);
      ctx.lineTo(r * 0.48, -r * 0.09);
      ctx.lineTo(r * 0.48, r * 0.09);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  },
  bomb(ctx, r) {
    ctx.beginPath();
    ctx.arc(-r * 0.05, r * 0.1, r * 0.36, 0, TAU);
    ctx.fill();
    ctx.fillRect(r * 0.12, -r * 0.38, r * 0.14, r * 0.2);
    ctx.beginPath();
    ctx.arc(r * 0.32, -r * 0.48, r * 0.09, 0, TAU);
    ctx.fill();
  },
  trap(ctx, r) {
    ctx.beginPath();
    ctx.arc(0, r * 0.1, r * 0.45, Math.PI, 0);
    ctx.lineTo(r * 0.45, r * 0.18);
    ctx.lineTo(-r * 0.45, r * 0.18);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(20, 10, 16, 0.9)';
    for (let i = 0; i < 4; i++) {
      const x = -r * 0.3 + i * r * 0.2;
      ctx.beginPath();
      ctx.moveTo(x - r * 0.07, r * 0.1);
      ctx.lineTo(x, -r * 0.12);
      ctx.lineTo(x + r * 0.07, r * 0.1);
      ctx.closePath();
      ctx.fill();
    }
  },
  roar(ctx, r) {
    // Gueule ouverte et ondes du cri.
    ctx.beginPath();
    ctx.moveTo(-r * 0.5, -r * 0.2);
    ctx.lineTo(-r * 0.05, -r * 0.05);
    ctx.lineTo(-r * 0.5, r * 0.2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = ctx.fillStyle;
    ctx.lineWidth = r * 0.08;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(-r * 0.15, 0, r * (0.28 + i * 0.16), -0.7, 0.7);
      ctx.stroke();
    }
  },
  totem(ctx, r) {
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.55);
    ctx.lineTo(r * 0.2, -r * 0.15);
    ctx.lineTo(r * 0.12, r * 0.45);
    ctx.lineTo(-r * 0.12, r * 0.45);
    ctx.lineTo(-r * 0.2, -r * 0.15);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = ctx.fillStyle;
    ctx.lineWidth = r * 0.05;
    ctx.beginPath();
    ctx.ellipse(0, r * 0.45, r * 0.5, r * 0.14, 0, 0, TAU);
    ctx.stroke();
  },
  sentence(ctx, r) {
    // Couperet de bourreau, lame vers le bas.
    ctx.fillRect(-r * 0.05, -r * 0.55, r * 0.1, r * 0.5);
    ctx.beginPath();
    ctx.moveTo(-r * 0.4, -r * 0.1);
    ctx.lineTo(r * 0.4, -r * 0.1);
    ctx.quadraticCurveTo(r * 0.45, r * 0.35, 0, r * 0.5);
    ctx.quadraticCurveTo(-r * 0.45, r * 0.35, -r * 0.4, -r * 0.1);
    ctx.fill();
  },
  rain(ctx, r) {
    for (const [x, y] of [[-0.3, -0.2], [0, 0.05], [0.3, -0.2], [-0.15, 0.35], [0.15, 0.35]]) {
      ctx.save();
      ctx.translate(x * r, y * r);
      ctx.rotate(Math.PI / 2);
      ctx.fillRect(-r * 0.25, -r * 0.03, r * 0.35, r * 0.06);
      ctx.beginPath();
      ctx.moveTo(r * 0.18, 0);
      ctx.lineTo(r * 0.08, -r * 0.08);
      ctx.lineTo(r * 0.08, r * 0.08);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  },
};

/** Pictogramme du bouton selon le kit équipé (champ `icon`) ; défaut : celui du bouton. */
function kitIcon(game, id) {
  const t = game.tuning;
  switch (id) {
    case 'attack':
      return t.weapon?.icon;
    case 'skill':
      return t.skill?.icon;
    case 'gadget':
      return t.gadget?.icon;
    case 'super':
      return t.super?.icon;
    default:
      return undefined;
  }
}

/** État d'un bouton d'aptitude, lu dans la simulation. ready ∈ [0, 1]. */
function abilityState(game, id) {
  const st = baseAbilityState(game, id);
  st.icon = kitIcon(game, id);
  return st;
}

function baseAbilityState(game, id) {
  const p = game.player;
  const t = game.tuning;
  switch (id) {
    case 'dash': {
      const max = maxDashCharges(game);
      const need = t.dash.recharge * p.stats.dashRechargeMult;
      return { ready: p.dashCharges > 0 ? 1 : p.dashRecharge / need, charges: p.dashCharges, max, partial: p.dashCharges < max ? p.dashRecharge / need : 0 };
    }
    case 'skill': {
      const cd = t.skill.cooldown * p.stats.skillCooldownMult;
      return { ready: 1 - p.skillCd / cd };
    }
    case 'gadget':
      return { ready: p.gadgetCharges > 0 ? 1 : 0, charges: p.gadgetCharges, max: t.gadget.chargesPerSection + p.stats.gadgetChargesBonus };
    case 'super':
      return { ready: p.superCharge, glow: p.superCharge >= 1 };
    default:
      return { ready: 1 };
  }
}

function drawButton(ctx, b, st, time) {
  const pressed = b.pointer !== null;
  const ready = st.ready >= 1;
  ctx.save();
  ctx.translate(b.x, b.y);
  if (st.glow) {
    ctx.fillStyle = 'rgba(255, 176, 46, 0.35)';
    ctx.beginPath();
    ctx.arc(0, 0, b.r + 8 + 3 * Math.sin(time * 8), 0, TAU);
    ctx.fill();
  }
  ctx.fillStyle = pressed ? 'rgba(255,255,255,0.32)' : 'rgba(20, 10, 16, 0.55)';
  ctx.strokeStyle = ready ? 'rgba(255,255,255,0.75)' : 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(0, 0, b.r * (pressed ? 0.94 : 1), 0, TAU);
  ctx.fill();
  ctx.stroke();
  // Recharge : secteur sombre qui se vide dans le sens horaire.
  if (st.ready < 1) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, b.r, -Math.PI / 2 + TAU * st.ready, -Math.PI / 2 + TAU);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = ready ? (b.id === 'super' ? PAL.superBar : PAL.text) : 'rgba(243,233,228,0.4)';
  ctx.save();
  (ICONS[st.icon] ?? ICONS[b.id])(ctx, b.r);
  ctx.restore();
  if (b.id === 'super') {
    ctx.strokeStyle = PAL.superBar;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(0, 0, b.r + 4, -Math.PI / 2, -Math.PI / 2 + TAU * st.ready);
    ctx.stroke();
  }
  if (st.max) drawChargeRing(ctx, b.r, st.charges, st.max, st.partial ?? 0, b.id === 'dash' ? PAL.dashPip : PAL.gold);
  ctx.restore();
}

const RING_GAP = 0.14; // rad entre deux segments de charge
const RING_WIDTH = 4;

/**
 * Charges en segments sur l'anneau du bouton (comme la jauge du Super) : rien ne dépasse du
 * bouton, donc aucun bouton voisin ne peut cacher la charge qui se recharge.
 */
function drawChargeRing(ctx, r, charges, max, partial, color) {
  const seg = TAU / max;
  const rr = r + RING_WIDTH;
  const gap = max > 1 ? RING_GAP : 0;
  ctx.lineWidth = RING_WIDTH;
  for (let i = 0; i < max; i++) {
    const a0 = -Math.PI / 2 + i * seg + gap / 2;
    const a1 = a0 + seg - gap;
    ctx.strokeStyle = i < charges ? color : 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.arc(0, 0, rr, a0, a1);
    ctx.stroke();
    if (i === charges && partial > 0) {
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      ctx.arc(0, 0, rr, a0, a0 + (a1 - a0) * Math.min(1, partial));
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

function drawTouchControls(ctx, game, touch, time) {
  const s = touch.stick;
  if (s.id !== null) {
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    // Dessin recalé loin des bords ; le bouton garde l'écart réel doigt/origine.
    const bx = s.drawX ?? s.baseX;
    const by = s.drawY ?? s.baseY;
    ctx.beginPath();
    ctx.arc(bx, by, 58, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    ctx.arc(bx + (s.knobX - s.baseX), by + (s.knobY - s.baseY), 26, 0, TAU);
    ctx.fill();
  }
  for (const b of touch.buttons) drawButton(ctx, b, abilityState(game, b.id), time);
}

function drawAbilityBar(ctx, game, w, h, safe, time) {
  // Clavier/souris : barre compacte en bas au centre, avec les touches.
  const items = [
    { id: 'dash', key: 'Espace' },
    { id: 'skill', key: 'Clic D' },
    { id: 'gadget', key: 'E' },
    { id: 'super', key: 'F' },
  ];
  const r = 22;
  const gap = 66;
  const x0 = w / 2 - ((items.length - 1) * gap) / 2;
  const y = h - EDGE - safe.bottom - r - 14;
  items.forEach((it, i) => {
    const b = { id: it.id, x: x0 + i * gap, y, r, pointer: null };
    drawButton(ctx, b, abilityState(game, it.id), time);
    text(ctx, it.key, b.x, y + r + 12, 10, PAL.textDim, 'center', 600);
  });
}

// ------------------------------------------------------------------ indicateurs et bannières

const ARROW_MARGIN = 26; // px des bords de la zone utile
const HUD_BAND = 60; // px : hauteur de la bande haute du HUD (hors combat de Gardien)
const HUD_BAND_BOSS = 52;

function drawOffscreen(ctx, game, cam, touch, w, h, safe) {
  const boss = game.enemies.some((e) => e.boss && !e.dead);
  const top = EDGE + safe.top + (boss ? HUD_BAND_BOSS : HUD_BAND);
  // Coin du groupe de boutons : une flèche n'y est jamais posée.
  let gx = w;
  let gy = h;
  if (touch.visible) {
    for (const b of touch.buttons) {
      gx = Math.min(gx, b.x - b.r);
      gy = Math.min(gy, b.y - b.r);
    }
  }
  const point = (x, y, color, size) => {
    worldToScreen(cam, w, h, x, y, tmp);
    if (tmp.x > 0 && tmp.x < w && tmp.y > top && tmp.y < h) return;
    const cx = w / 2;
    const cy = h / 2;
    const a = Math.atan2(tmp.y - cy, tmp.x - cx);
    const ey = Math.max(top + 10, Math.min(h - ARROW_MARGIN - safe.bottom, tmp.y));
    const right = ey > gy - ARROW_MARGIN ? gx - 14 : w - ARROW_MARGIN - safe.right;
    const ex = Math.max(ARROW_MARGIN + safe.left, Math.min(right, tmp.x));
    ctx.save();
    ctx.translate(ex, ey);
    ctx.rotate(a);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(size, 0);
    ctx.lineTo(-size * 0.6, -size * 0.7);
    ctx.lineTo(-size * 0.6, size * 0.7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  };
  for (const e of game.enemies) if (!e.dead) point(e.x, e.y, e.boss ? PAL.bossTrim : 'rgba(255,70,60,0.85)', e.boss || e.eliteMod ? 11 : 8);
  const it = game.room.interact;
  if (it && !it.used) point(it.x, it.y, PAL.gold, 11);
}

/** Ennemis cachés sous le groupe de boutons : marqueur au-dessus du groupe (pouce). */
function drawOccluded(ctx, game, cam, touch, w, h) {
  if (!touch.visible) return;
  let x0 = Infinity;
  let y0 = Infinity;
  for (const b of touch.buttons) {
    x0 = Math.min(x0, b.x - b.r - 24);
    y0 = Math.min(y0, b.y - b.r - 24);
  }
  for (const e of game.enemies) {
    if (e.dead) continue;
    worldToScreen(cam, w, h, e.x, e.y, tmp);
    if (tmp.x < x0 || tmp.y < y0 || tmp.x > w || tmp.y > h) continue;
    const danger = e.state === 'windup' || e.tele;
    ctx.fillStyle = danger ? '#ff3b3b' : 'rgba(255, 90, 70, 0.75)';
    ctx.beginPath();
    ctx.moveTo(tmp.x, y0 - 2);
    ctx.lineTo(tmp.x - 7, y0 - 14);
    ctx.lineTo(tmp.x + 7, y0 - 14);
    ctx.closePath();
    ctx.fill();
  }
}

const BANNER_ALPHA = 0.75;
const BANNER_Y = 92; // px sous le bord haut sûr : juste sous la bande du HUD, au-dessus de l'action

function drawBanner(ctx, fx, w, safe) {
  const b = fx.banner;
  if (!b) return;
  const t = 1 - b.life / b.max;

// ---------------------------------------------------------------- recettes

function swing(v, p) {
  const ev = p.ev;
  if (ev.ranged) {
    playLayers(v, ev.strike || lookup(HEAVY_WEAPONS, ev.weapon, false) ? SHOOT_HEAVY : SHOOT_BOW, p.pitch, p.gain);
    return;
  }
  const index = clamp(Math.round(finite(ev.index, 0)), 0, SWING_COMBO.length - 1);
  playLayers(v, ev.strike ? SWING_STRIKE : SWING_COMBO[index], p.pitch, p.gain);
}

function hit(v, p) {
  const ev = p.ev;
  const amount = finite(ev.amount, HIT_LIGHT_AMOUNT);
  const norm = clamp((amount - HIT_LIGHT_AMOUNT) / (HIT_HEAVY_AMOUNT - HIT_LIGHT_AMOUNT), 0, 1);
  const body = p.pitch * lerp(HIT_PITCH_RANGE[0], HIT_PITCH_RANGE[1], norm) * lookup(ENEMY_PITCH, ev.enemy, 1);
  const g = p.gain * lerp(HIT_GAIN_RANGE[0], HIT_GAIN_RANGE[1], norm);
  playLayers(v, HIT_BODY, body, g);
  if (p.heavy) playLayers(v, HIT_HEAVY, body, g);
  if (ev.crit) playLayers(v, HIT_CRIT, p.pitch, p.gain);
}

function burn(v, p) {
  playLayers(v, BURN, p.pitch, p.gain);
}

function kill(v, p) {

// Interpolation de rendu : la simulation avance par pas fixes de 1/60 s, l'écran peut tourner à
// 90, 120 ou 144 Hz. On dessine chaque entité entre sa position avant et après le dernier pas
// (alpha = reste de l'accumulateur / DT) : le mouvement reste fluide à toute fréquence.
//
// La sim n'est JAMAIS modifiée durablement : applyInterp() remplace x/y le temps du dessin,
// restoreInterp() les rétablit avant le pas suivant (appelés dans un try/finally par main).

const JUMP = 150; // u : au-delà (téléportation, changement de salle), pas d'interpolation

function lists(game) {
  return [game.enemies, game.projectiles, game.pickups];
}

/** À appeler juste AVANT chaque stepGame : mémorise la position de départ du pas. */
function recordPrev(game) {
  const p = game.player;
  p.px = p.x;
  p.py = p.y;
  for (const arr of lists(game)) {
    for (const e of arr) {
      e.px = e.x;
      e.py = e.y;
    }
  }
}

const touched = [];

function lerpInto(e, alpha) {
  if (e.px === undefined) return;
  const dx = e.x - e.px;
  const dy = e.y - e.py;
  if (dx * dx + dy * dy > JUMP * JUMP) return;
  e.cx = e.x;
  e.cy = e.y;
  e.x = e.px + dx * alpha;
  e.y = e.py + dy * alpha;
  touched.push(e);
}

function applyInterp(game, alpha) {
  touched.length = 0;
  lerpInto(game.player, alpha);
  for (const arr of lists(game)) for (const e of arr) lerpInto(e, alpha);
}

function restoreInterp() {
  for (const e of touched) {
    e.x = e.cx;
    e.y = e.cy;
  }
  touched.length = 0;
}

return { recordPrev, applyInterp, restoreInterp };
