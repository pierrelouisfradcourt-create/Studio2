  libertes_deleguees: Pierre 2026-09-02 — « le critère de réussite n'est pas que le
    jeu soit bon » ; la liberté de conception du jeu est donc entière dans les limites
    du socle N1
  non_delegue: Pierre 2026-09-02 (lignée web imposée, autorité des preuves et du verdict)
  principe: agent (Claude Opus 5) — calqué sur le principe du Brief de RUN 1, même
    structure
  redaction_fichier: 'Claude Opus 5 (agent) — structure, mise en forme YAML et répartition
    des champs ; le contenu normatif est sourcé Pierre 2026-09-02 champ par champ
