    explicitement attribué à l''agent avec la mécanique dont il dérive'
  derivation: 'dérivé de EVIDENCE/briefs/runm_breakout/project_brief.yaml (Pierre
    2026-09-02) : même intention casse-briques, NOUVEAU nom de projet — D4 ratifiée
