projet: chaton_clicker
intention: 'Créer de zéro, sous GAMES/chaton_clicker/, un jeu du genre « cookie clicker »
  où les cookies sont remplacés par des chatons : le joueur clique pour produire une
  ressource, achète des producteurs qui la génèrent sans clic, débloque des améliorations
  et progresse par paliers. Demande de Pierre 2026-09-05 (verbatim) : « fait moi un cookie
  clicker, remplace les cookie par des chatons. via notre méthode de forge ». Le jeu doit
  être JOUABLE par un joueur réel avec ses seules entrées (souris/clavier), pas seulement
  solvable par un canal interne : leçon V1 kitten_clicker (run 6, 2026-08-22) où 25 exigences
  à la voix passive ont produit un jeu « solvable 20/20 » mais injouable.'
contraintes:
  normative_refs:
  - spec: FORGE_DESIGN_FREEDOM_SPEC_V0
    rules:
    - N1
    - N2
    - N3
    - N4
    - N7
    - N8
    - N9
  project_specific:
    techniques:
    - 'cible technique conforme au socle N1 : page HTML+JS unique, RNG seedé, logique
      métier en module .mjs testable hors navigateur, exposition window.__game, actions
      DOM-only, déterminisme reproductible par hash'
    - 'lignée WEB : aucun binaire Godot ni Blender requis ni utilisé. La lignée Godot
      de la Forge V2 n''est pas configurée sur ce poste (forge/godot.config.json absent,
      mesuré 2026-09-05) — un recours silencieux à Godot est un écart à signaler'
    - 'toute affordance du joueur (cliquer le chaton, acheter, améliorer, prestige) est
      un élément DOM cliquable ; toute grandeur observée par un critère (ressource, taux,
      objectif) est lisible dans le DOM — c''est le canal du bot-joueur ET du joueur humain'
    - 'le temps de jeu est piloté par un tick déterministe (pas de Date.now() dans la
      logique) pour que la production passive soit testable hors navigateur'
    experimentales:
    - 'question du run : la Forge V2 sait-elle produire, à partir d''une phrase de Pierre,
      un jeu d''un genre encore jamais forgé en lignée web (idle/clicker), avec une boucle
      joueur complète prouvée par un bot n''utilisant que les entrées d''un joueur ?'
    - 'un échec est un résultat recevable : le run doit dire OÙ la chaîne casse, jamais
      produire un vert par contournement'
cible: web/HTML
references_autorisees:
- ref: 'Cookie Clicker (Orteil, 2013) — référence de GENRE uniquement : clic → ressource,
    producteurs passifs, améliorations, paliers/prestige. Pas une source à recopier.'
  source: Pierre 2026-09-05 — « fait moi un cookie clicker »
criteres_sortie:
- 'le run s''exécute dans les surfaces V2 : run_dir sous EVIDENCE/runs/chaton_clicker/,
  jamais lab/'
- le jeu est écrit sous GAMES/chaton_clicker/, jamais games/ ni ailleurs
- charter produit par s0 et validé par check_charter
- prisme.json, featuremap.json, blueprint et wiremap.json produits et validés par
  leurs oracles amont
- chaque ligne de wiremap porte un `couvre` NON VIDE citant l'id EXACT d'une capacité
  de featuremap.json
- 'loop_check : les exigences du Prisme couvrent les maillons de la boucle joueur
  (PLAYER_GOAL, PLAYER_ACTION, GAME_RESPONSE, REWARD, DECISION, UNLOCK, NEXT_GOAL, REPEAT,
  META_LOOP, ADVANTAGE) — un maillon manquant est un FAIL rapporté, jamais absorbé'
- preuves s10 produites (s10a-oracle-code avec e2e, mutation et solvabilité ; s10b-oracle-archi
  ; s10c-oracle-wiremap)
- 'la solvabilité est prouvée par un bot-joueur qui n''utilise QUE les affordances DOM
  du joueur (clics) et la lecture du DOM — jamais un appel direct à l''économie interne'
- verdict signé HMAC produit ET re-vérifié authentique par verify_run — pas seulement
  présent
- la clé de signature utilisée est celle de V2 (forge/.forge_key), jamais une clé
  héritée de V1
- le jeu se charge dans un navigateur et une session complète est jouable à la souris
  (clic sur le chaton, achat, amélioration, prestige) sans tutoriel externe
- LM Studio indisponible => HALT/BLOCKED sans repli silencieux vers une autre source
- aucun artefact n'est écrit hors des surfaces V2 déclarées — une écriture dans lab/,
  scripts/forge/ ou games/ est un FAIL
libertes_deleguees:
- choisir le thème visuel, le nom de la ressource (ronrons, câlins, croquettes…) et la
  direction artistique
- définir la boucle de jeu minimale et ses règles, y compris la forme du prestige
- décider du nombre de producteurs, d'améliorations, de paliers et de leurs coûts/courbes
  (valeurs uniques, N4)
- choisir les interactions et les affordances du joueur
- arbitrer les détails de conception non spécifiés par ce Brief
- choisir la structure interne des modules, dans les limites du socle N1
non_delegue:
- les règles normatives citées (N1-N4, N7-N9)
- les critères de sortie
- l'autorité des preuves
- l'autorité du verdict
- le genre (cookie clicker) et le thème (chatons à la place des cookies)
- le choix de la lignée web et l'interdiction de dépendre de Godot/Blender
- la définition du Project Input lui-même
principe: La chaîne est libre de concevoir le jeu, mais elle ne définit pas elle-même
  les conditions qui permettent de déclarer le run réussi.
